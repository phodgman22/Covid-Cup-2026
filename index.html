/* ==========================================================================
   3. SCORING ENGINE  (gross in -> everything else derived)
   ========================================================================== */
/* Standard USGA allocation, generalized past the old 2-stroke ceiling: a
   hole gets a first stroke once allowance reaches its stroke index, a
   second once allowance passes 18 + that index, a third past 36 + that
   index, and so on. With the 18-cap on relativeAllowance() gone (some real
   players' relative allowance now runs past 36 — a high-index player on a
   high-slope tee, playing against a scratch-marked field), a hole's hardest
   player needs to be able to pick up a 3rd+ stroke, not get silently capped
   at 2 while the strokes summary header still reports the true, higher
   allowance number. */
function strokesOn(allowance, strokeIndex){
  if (!allowance || allowance < strokeIndex) return 0;
  return Math.floor((allowance - strokeIndex) / 18) + 1;
}

/* ---- handicap engine ----------------------------------------------------
   Two competitions run off the same gross scores with two different playing
   handicaps, both at a locked 100% allowance, no cap (a hole can carry a
   2nd, 3rd, etc. stroke once a relative allowance runs past 18 — see
   strokesOn()):
     Course Handicap = Index × (Slope / 113) + (Rating − Par)
     Competition 1 (Ryder Cup match play): playing handicap = a player's own
       course handicap minus the LOWEST course handicap in his foursome (his
       match) — the low man in that group of four plays scratch.
     Competition 2 (foursome stroke play): playing handicap = a player's own
       course handicap minus the LOWEST course handicap across the ENTIRE
       field playing that round — the low man in the whole event plays
       scratch.
   Both are computed live from each player's own tee choice (Store.playerTee()
   /setPlayerTee()); nothing is baked into the round/match data. */
function coursePar(c){ return c.par.reduce((a, b) => a + b, 0); }
function courseHandicap(idx, c, tee){
  const t = c.tees[tee] || c.tees[Object.keys(c.tees)[0]];   // fall back if the tee is missing
  return Math.round(idx * (t.slope / 113) + (t.rating - coursePar(c)));
}
/* ---- performance & safety at 50+ players live at once --------------------
   liveAllowance/comp2Allowance run on every render, for every player, for
   every hole shown — leaderboard and stats screens loop all of that across
   every match. Three things make that cheap instead of recomputing from
   scratch tens of thousands of times a render:
     - matchOf/fieldPlayerIds are cached permanently — foursome assignments
       never change once ROUNDS is set, reset or no reset.
     - each player's own course handicap is cached per (id, tee) pair — a
       pure function of idx/course/tee, so it can never go stale even though
       a player's CHOSEN tee can change mid-event; changing tee just adds a
       new cache entry under the new key.
     - a player id that doesn't match anyone in PLAYERS (a roster typo,
       most likely once the real 50-person list gets typed in) is treated as
       scratch (0) rather than throwing — one bad id must never take down
       the render for every connected phone. */
const _matchOfCache = new Map();
function matchOf(r, id){
  if (_matchOfCache.has(id)) return _matchOfCache.get(id);
  const m = r.matches.find(mm => matchPlayerIds(r, mm).includes(id)) || null;
  _matchOfCache.set(id, m);
  return m;
}
let _fieldIdsCache = null;
function fieldPlayerIds(r){
  if (_fieldIdsCache) return _fieldIdsCache;
  const ids = new Set();
  r.matches.forEach(m => matchPlayerIds(r, m).forEach(id => ids.add(id)));
  return (_fieldIdsCache = [...ids]);
}
const _chCache = new Map();
function safeCourseHandicap(id, c, tee){
  const p = PLAYERS[id];
  if (!p){ console.warn(`Unknown player id in handicap lookup: ${id}`); return 0; }
  const idx = Store.playerIdx(id);
  const key = id + "|" + tee + "|" + idx;   // idx is now a live, player-editable override —
  let v = _chCache.get(key);                // keying on it keeps a changed index from ever
  if (v === undefined){ v = courseHandicap(idx, c, tee); _chCache.set(key, v); }  // reading stale
  return v;
}
/** Shared shape for both competitions: a player's own course handicap minus
    the lowest course handicap among a given pool of players, floored at 0
    (nobody owes strokes) — no cap. */
function relativeAllowance(r, id, pool){
  const c = COURSES[r.course];
  const ch = pid => safeCourseHandicap(pid, c, Store.playerTee(pid));
  const min = pool.length ? Math.min(...pool.map(ch)) : 0;
  return Math.max(0, ch(id) - min);   // no cap — strokesOn() already gives a hole a second stroke past 18
}
/** Competition 1 — playing handicap for the Ryder Cup match play. This is
    the name every existing match-play call site already uses, so redefining
    it here is the whole of Competition 1's implementation; nothing else in
    the match-play pipeline (playerStrokes, holeScores, matchState,
    standings, playerStats) needs to change. */
function liveAllowance(r, id){
  const m = matchOf(r, id);
  return relativeAllowance(r, id, m ? matchPlayerIds(r, m) : [id]);
}
function playerStrokes(r, side, pl, h){
  const c = COURSES[r.course];
  let allow = liveAllowance(r, pl[0]);
  if (r.par3Low && c.par[h] === 3) allow = Math.min(...side.p.map(x => liveAllowance(r, x[0])));
  return strokesOn(allow, c.hcp[h]);
}
function teamStrokes(r, side, h){ return strokesOn(side.net, COURSES[r.course].hcp[h]); }

/** Competition 2 — playing handicap for the foursome stroke play: relative
    to the lowest course handicap across the whole field playing this round. */
function comp2Allowance(r, id){ return relativeAllowance(r, id, fieldPlayerIds(r)); }
function comp2PlayerStrokes(r, pl, h){
  const c = COURSES[r.course];
  return strokesOn(comp2Allowance(r, pl[0]), c.hcp[h]);
}

/**
 * Everyone's number on one hole, with picked-up balls ("X") resolved.
 *
 * A pick-up scores double par — except when double par would actually win the
 * hole, which would reward walking in. In that case he takes one more than the
 * worst score in the group, so a pick-up can never help his side.
 *
 * Parameterized on which competition's strokes to apply — Competition 1
 * (match play, teamStrokes/playerStrokes) and Competition 2 (foursome stroke
 * play, comp2PlayerStrokes) score the exact same gross entries under two
 * different handicaps, so the pick-up resolution has to run once per
 * competition rather than being shared off one set of nets.
 */
function holeScoresFor(r, m, h, scores, strokesFn){
  const c = COURSES[r.course], par = c.par[h], row = scores[h] || {};
  const ents = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => ents.push({id:k, side:k, raw: row[k], strokes: teamStrokes(r, m[k], h)}));
  } else {
    ["s","d"].forEach(k => m[k].p.forEach(pl =>
      ents.push({id: pl[0], side: k, raw: row[pl[0]], strokes: strokesFn(m[k], pl)})));
  }
  const realNets = ents.filter(e => typeof e.raw === "number").map(e => e.raw - e.strokes);
  const best = realNets.length ? Math.min(...realNets) : null;
  const worst = realNets.length ? Math.max(...realNets) : null;

  const out = {};
  ents.forEach(e => {
    if (e.raw == null) return;
    if (e.raw === PICKED){
      // "<=" not "<": tying the best would still let a walk-in halve the hole
      const dbl = 2 * par;
      const gross = (best !== null && dbl - e.strokes <= best) ? worst + 1 + e.strokes : dbl;
      out[e.id] = {gross, net: gross - e.strokes, strokes: e.strokes, picked: true, side: e.side};
    } else {
      out[e.id] = {gross: e.raw, net: e.raw - e.strokes, strokes: e.strokes, picked: false, side: e.side};
    }
  });
  return out;
}
function holeScores(r, m, h, scores){
  return holeScoresFor(r, m, h, scores, (side, pl) => playerStrokes(r, side, pl, h));
}
/** Competition 2's version of holeScores — same gross entries, the foursome
    stroke-play handicap instead of the match-play one. */
function comp2HoleScores(r, m, h, scores){
  return holeScoresFor(r, m, h, scores, (side, pl) => comp2PlayerStrokes(r, pl, h));
}
/** A foursome's Competition 2 total so far: the lowest net among its four
    players on every hole entered, summed stroke-play style (lower wins). */
function comp2FoursomeTotal(r, m, scores){
  const c = COURSES[r.course];
  let total = 0, par = 0, thru = 0;
  for (let h = 0; h < 18; h++){
    if (!holeEntered(r, m, h, scores)) continue;
    const nets = Object.values(comp2HoleScores(r, m, h, scores)).map(v => v.net);
    if (!nets.length) continue;
    total += Math.min(...nets); par += c.par[h]; thru++;
  }
  return {total, par, toPar: total - par, thru};
}

/**
 * Every expected score for the hole is in — a number or an X for each team
 * (scramble / alt shot) or each of the four players (best ball / shamble) or
 * both singles players. Nothing is announced, counted toward the match, or
 * unlocked off a half-entered hole: in best ball, two of four scores can LOOK
 * like a result and then flip when the other two land.
 */
function holeEntered(r, m, h, scores){
  const row = scores[h] || {};
  const ids = r.mode === "team" ? ["s", "d"] : [...m.s.p, ...m.d.p].map(p => p[0]);
  return ids.every(id => row[id] != null);
}

function sideHole(r, m, key, h, scores){
  const hs = holeScores(r, m, h, scores);
  if (r.mode === "team"){
    const v = hs[key];
    return v ? {net: v.net, gross: v.gross, byId: null, picked: v.picked} : null;
  }
  let best = null;
  for (const pl of m[key].p){
    const v = hs[pl[0]];
    if (!v) continue;
    if (!best || v.net < best.net) best = {net: v.net, gross: v.gross, byId: pl[0], picked: v.picked};
  }
  return best;
}

function matchState(r, m, scores){
  let up = 0, sW = 0, dW = 0, halved = 0;
  const holes = new Array(18).fill(null);
  let closedAt = null, closedMargin = 0, decided = 0;
  for (let h = 0; h < 18; h++){
    if (!holeEntered(r, m, h, scores)) continue;   // partial holes count for nothing
    const s = sideHole(r, m, "s", h, scores);
    const d = sideHole(r, m, "d", h, scores);
    if (!s || !d) continue;
    let w;
    if (s.net < d.net){ w = "s"; up++; sW++; }
    else if (d.net < s.net){ w = "d"; up--; dW++; }
    else { w = "h"; halved++; }
    holes[h] = w;
    decided++;
    /* Holes left is 18 minus holes actually DECIDED — not "holes after this
       one on the card". A scorer who skips a hole and fills it in later would
       otherwise close the match early: nine straight wins with hole 1 still
       blank read as "9 & 8" and banked the point, when 9 up with 9 to play is
       only dormie. Counting decided holes makes the order of entry irrelevant. */
    if (closedAt === null && Math.abs(up) > 18 - decided){
      closedAt = decided; closedMargin = Math.abs(up);
    }
  }
  const played = sW + dW + halved, thru = played;
  const done = closedAt !== null || played === 18;
  let text, winner = null;
  if (closedAt !== null){
    winner = up > 0 ? "s" : "d";
    const rem = 18 - closedAt;
    text = rem === 0 ? `${closedMargin} UP` : `${closedMargin} & ${rem}`;
  } else if (played === 18){
    if (up === 0) text = "HALVED";
    else { winner = up > 0 ? "s" : "d"; text = `${Math.abs(up)} UP`; }
  } else if (played === 0){ text = "Not started"; }
  else {
    text = up === 0 ? "ALL SQUARE" : `${Math.abs(up)} UP`;
    winner = up === 0 ? null : (up > 0 ? "s" : "d");
  }
  return {up, thru, played, holes, done, winner, text, closedAt, started: played > 0,
          pts: {s: done ? (up > 0 ? PT_WIN : up < 0 ? 0 : PT_HALVE) : 0,
                d: done ? (up < 0 ? PT_WIN : up > 0 ? 0 : PT_HALVE) : 0}};
}

/** Any score at all has been entered — a match mid-hole-1 is live, even though
    no hole is COMPLETE yet (completed holes are a stricter test). */
function matchBegun(id){
  const sc = Store.scores(id);
  for (const h in sc) if (sc[h] && Object.keys(sc[h]).length) return true;
  return false;
}
/** Whether ANY match has a score in it yet — the format-settings lock. Once
    scoring starts, changing the tee or allowance percentage would silently
    reinterpret holes already played under a different number. The only way
    back is Reset ALL matches, same escape hatch as everything else in the
    Danger zone. */
function anyMatchBegun(){
  return Object.keys(ALL_MATCHES).some(matchBegun);
}

function standings(){
  let s = 0, d = 0, ps = 0, pd = 0, fin = 0, live = 0;
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done){ s += st.pts.s; d += st.pts.d; ps += st.pts.s; pd += st.pts.d; fin++; }
    else if (st.started || matchBegun(id)){
      live++;
      if (st.up > 0) ps += PT_WIN; else if (st.up < 0) pd += PT_WIN;
      else { ps += PT_HALVE; pd += PT_HALVE; }
    }
  }
  return {s, d, projS: ps, projD: pd, fin, live};
}

/**
 * Where the Outing stands overall.
 *   complete  - every match final
 *   tied      - complete and level on points, so a tiebreak decides it
 *   winner    - "s" | "d" | null (null while tied and undeclared)
 */
function eventResult(){
  const st = standings();
  const complete = st.fin === MATCH_COUNT;
  if (!complete) return {complete: false, tied: false, winner: null, st};
  if (st.s !== st.d) return {complete: true, tied: false, winner: st.s > st.d ? "s" : "d", st};
  const tb = Store.tiebreak();
  return {complete: true, tied: true, winner: (tb && tb.winner) || null, tb, st};
}

/**
 * Per-player totals across the whole trip.
 * Best Ball / Shamble / Singles have a score per man, so it's his own.
 * Scramble / Alternate Shot only have a team score — that score is credited
 * to BOTH partners, since it's the number they made together.
 * Birdies/bogeys are counted off GROSS vs par, the way a scorecard reads.
 */
function playerStats(){
  const acc = {};
  Object.keys(PLAYERS).forEach(id => acc[id] = {holes:0, gross:0, net:0, par:0,
    eagle:0, birdie:0, parCt:0, over:0,
    eagleN:0, birdieN:0, parCtN:0, overN:0, underN:0, rounds:new Set(),
    holesWon:0, holesLost:0});
  const bump = (a, gross, net, par, rid) => {
    a.holes++; a.gross += gross; a.net += net; a.par += par; a.rounds.add(rid);
    const d = gross - par;
    if (d <= -2) a.eagle++; else if (d === -1) a.birdie++;
    else if (d === 0) a.parCt++; else a.over++;
    const n = net - par;                       // same counts, measured off net
    if (n <= -2) a.eagleN++; else if (n === -1) a.birdieN++;
    else if (n === 0) a.parCtN++; else a.overN++;
    if (n < 0) a.underN++;
  };
  ROUNDS.forEach(r => {
    const c = COURSES[r.course];
    r.matches.forEach(m => {
      const scores = Store.scores(m.id);
      const st = matchState(r, m, scores);
      for (let h = 0; h < 18; h++){
        const hs = holeScores(r, m, h, scores);   // picked-up balls already resolved
        if (r.mode === "team"){
          ["s","d"].forEach(k => { const v = hs[k]; if (!v) return;
            m[k].p.forEach(pl => bump(acc[pl[0]], v.gross, v.net, c.par[h], r.n)); });
        } else for (const id in hs) bump(acc[id], hs[id].gross, hs[id].net, c.par[h], r.n);
        // Hole wins/losses credit both partners in team formats, same as match
        // points already do — a 2v2 win is shared, not personally attributed.
        const w = st.holes[h];
        if (w === "s" || w === "d"){
          m[w].p.forEach(pl => acc[pl[0]].holesWon++);
          m[w === "s" ? "d" : "s"].p.forEach(pl => acc[pl[0]].holesLost++);
        }
      }
    });
  });
  const pts = playerPoints();
  return Object.keys(acc).map(id => {
    const a = acc[id];
    return {id, name: PLAYERS[id].n, last: last(id), team: PLAYERS[id].t, holes: a.holes,
            grossToPar: a.gross - a.par, netToPar: a.net - a.par,
            eagle: a.eagle, birdie: a.birdie, parCt: a.parCt, over: a.over,
            eagleN: a.eagleN, birdieN: a.birdieN, parCtN: a.parCtN, overN: a.overN,
            underN: a.underN, points: pts[id] || 0, rounds: a.rounds.size,
            holesWon: a.holesWon, holesLost: a.holesLost, netHoles: a.holesWon - a.holesLost};
  }).filter(p => p.holes > 0);
}

/** Shotgun mulligans — Round 3 only. One row per Round-3 player: total taken,
    and which holes, folding repeats on the same hole into "5 (2x)". */
function mulliganStats(){
  const r3 = ROUNDS.find(rr => rr.n === 3);
  if (!r3) return [];
  const byPlayer = {};
  r3.matches.forEach(m => {
    [...m.s.p, ...m.d.p].forEach(pl => { byPlayer[pl[0]] = byPlayer[pl[0]] || {total:0, holes:{}}; });
    const mul = Store.mulligans(m.id);
    for (const h in mul) for (const e in mul[h]){
      const n = mul[h][e]; if (!n) continue;
      byPlayer[e] = byPlayer[e] || {total:0, holes:{}};
      byPlayer[e].total += n;
      byPlayer[e].holes[h] = (byPlayer[e].holes[h] || 0) + n;
    }
  });
  return Object.keys(byPlayer).map(id => {
    const d = byPlayer[id];
    const holesTxt = Object.keys(d.holes).map(Number).sort((a, b) => a - b)
      .map(h => d.holes[h] > 1 ? `${h + 1} (${d.holes[h]}x)` : `${h + 1}`).join(", ");
    return {id, name: PLAYERS[id].n, last: last(id), team: PLAYERS[id].t,
            total: d.total, holesTxt};
  }).sort((a, b) => b.total - a.total || a.last.localeCompare(b.last));
}

/** Points each player has contributed. In a 2v2 match both partners get the
    side's points — they won it together. */
function playerPoints(){
  const out = {};
  Object.keys(PLAYERS).forEach(id => out[id] = 0);
  ROUNDS.forEach(r => r.matches.forEach(m => {
    const st = matchState(r, m, Store.scores(m.id));
    if (!st.done) return;
    ["s","d"].forEach(k => m[k].p.forEach(pl => out[pl[0]] += st.pts[k]));
  }));
  return out;
}

/* ==========================================================================
   4. STORE  — localStorage is durable truth, Firebase is shared truth.
   Every cell is timestamped, so merging is "newest wins".
   ========================================================================== */
const Store = (() => {
  const LS = `${EVENT_KEY}_data`, LS_CHAT = `${EVENT_KEY}_chat`, LS_SEEN = `${EVENT_KEY}_chatseen`;
  const LS_TIE = `${EVENT_KEY}_tie`, LS_SETTINGS = `${EVENT_KEY}_settings`;
  const LS_PTEE = `${EVENT_KEY}_playertees`;
  const LS_PIDX = `${EVENT_KEY}_playeridx`;
  const DEFAULT_SETTINGS = {pct: 0.85};
  let data = {}, chatData = {}, chatSeen = {}, tie = null, settings = {...DEFAULT_SETTINGS};
  let playerTees = {};   // {playerId: {tee, by, t}} — each player picks their own, newest-wins
  try { playerTees = JSON.parse(localStorage.getItem(LS_PTEE) || "{}"); } catch(e){ playerTees = {}; }
  let playerIdxs = {};   // {playerId: {idx, by, t}} — self-reported handicap override, newest-wins
  try { playerIdxs = JSON.parse(localStorage.getItem(LS_PIDX) || "{}"); } catch(e){ playerIdxs = {}; }
  try { tie = JSON.parse(localStorage.getItem(LS_TIE) || "null"); } catch(e){ tie = null; }
  try { settings = {...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}")}; }
  catch(e){ settings = {...DEFAULT_SETTINGS}; }
  let db = null, connected = false, authed = false, chatBlocked = null, listeners = [];
  let synced = false;        // the first full matches snapshot has landed
  /* A rejected write used to vanish into an empty catch. That is the worst
     possible failure here: the merge is additive newest-wins, so the value
     sticks on the writer's phone forever and reaches nobody, while the sync
     pill still reads "Live" because the socket is open. Record it and let the
     UI say so. */
  let writeErr = null;
  const track = p => (p && p.then ? p.then(() => {
    // recovered — a later write got through, so stop shouting about the old one
    if (writeErr){ writeErr = null; listeners.forEach(f => f()); }
  }).catch(err => {
    writeErr = (err && (err.code || err.message)) || "write failed";
    console.warn("write rejected:", writeErr);
    listeners.forEach(f => f());
  }) : p);
  /* Every merge is "newest timestamp wins". If we trusted each phone's own
     clock, one man with a wrong clock would either lose every correction he
     makes or silently overwrite everyone else's. Firebase tells us how far
     this device is from the server, so we stamp everything in server time. */
  let clockOffset = 0;
  const now = () => Date.now() + clockOffset;
  try { data = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ data = {}; }
  try { chatData = JSON.parse(localStorage.getItem(LS_CHAT) || "{}"); } catch(e){ chatData = {}; }
  try { chatSeen = JSON.parse(localStorage.getItem(LS_SEEN) || "{}"); } catch(e){ chatSeen = {}; }
  const flush = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} };
  const flushChat = () => { try { localStorage.setItem(LS_CHAT, JSON.stringify(chatData)); } catch(e){} };
  const bucket = id => {
    const b = data[id] = data[id] || {scores:{}, scorer:null};
    b.mulligans = b.mulligans || {};       // older buckets predate this field
    return b;
  };

  function mergeRemote(id, remote){
    if (!remote) return false;
    const b = bucket(id); let changed = false;
    if (remote.scores) for (const h in remote.scores) for (const e in remote.scores[h]){
      const rc = remote.scores[h][e], lc = (b.scores[h] || {})[e];
      if (!rc || typeof rc.t !== "number") continue;
      if (!lc || rc.t > lc.t){ b.scores[h] = b.scores[h] || {}; b.scores[h][e] = rc; changed = true; }
    }
    if (remote.mulligans) for (const h in remote.mulligans) for (const e in remote.mulligans[h]){
      const rc = remote.mulligans[h][e], lc = (b.mulligans[h] || {})[e];
      if (!rc || typeof rc.t !== "number") continue;
      if (!lc || rc.t > lc.t){ b.mulligans[h] = b.mulligans[h] || {}; b.mulligans[h][e] = rc; changed = true; }
    }
    if (remote.scorer && (!b.scorer || remote.scorer.t > b.scorer.t)){
      b.scorer = remote.scorer; changed = true;
    }
    if (remote.submitted && (!b.submitted || remote.submitted.t > b.submitted.t)){
      b.submitted = remote.submitted; changed = true;
    }
    if (remote.teesConfirmed && (!b.teesConfirmed || remote.teesConfirmed.t > b.teesConfirmed.t)){
      b.teesConfirmed = remote.teesConfirmed; changed = true;
    }
    return changed;
  }

  return {
    get online(){ return connected; },
    get authed(){ return authed; },
    get chatBlocked(){ return chatBlocked; },
    onChange(fn){ listeners.push(fn); },
    _emit(){ listeners.forEach(f => f()); },
    get writeErr(){ return writeErr; },
    get synced(){ return synced; },

    scores(id){
      const b = data[id]; if (!b) return {};
      const out = {};
      for (const h in b.scores) for (const e in b.scores[h]){
        const c = b.scores[h][e];
        if (!c) continue;
        if (c.x){ out[h] = out[h] || {}; out[h][e] = PICKED; }
        else if (c.v != null){ out[h] = out[h] || {}; out[h][e] = c.v; }
      }
      return out;
    },

    /* val: a number, null to clear, or PICKED for a picked-up ball.
       silent = write through without re-rendering, so a focused input keeps focus */
    setScore(id, h, entrant, val, by, silent){
      const b = bucket(id), t = now();
      const pick = val === PICKED;
      const cell = {v: pick ? null : val, x: pick ? true : null, t, by};
      b.scores[h] = b.scores[h] || {};
      b.scores[h][entrant] = cell;
      flush();
      if (!silent) this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${entrant}`), cell));
    },

    /* ---- shotgun mulligans (Round 3 only) ----------------------------------
       A per-hole, per-player tally, same shape and sync path as scores. */
    mulligans(id){
      const b = data[id]; if (!b || !b.mulligans) return {};
      const out = {};
      for (const h in b.mulligans) for (const e in b.mulligans[h]){
        const c = b.mulligans[h][e];
        if (c && typeof c.v === "number" && c.v > 0){ out[h] = out[h] || {}; out[h][e] = c.v; }
      }
      return out;
    },
    setMulligan(id, h, entrant, val, by){
      const b = bucket(id), t = now(), v = Math.max(0, val | 0);
      const cell = {v, t, by};
      b.mulligans[h] = b.mulligans[h] || {};
      b.mulligans[h][entrant] = cell;
      flush(); this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/mulligans/${h}/${entrant}`), cell));
    },

    /* ---- tiebreak ----------------------------------------------------------
       If the Outing finishes level, Pat or Andrew declare the tiebreak on the
       spot: first what it is, then who won it. Deliberately free text, because
       nobody knows in advance what the course will allow. */
    tiebreak(){ return tie && (tie.format || tie.winner) ? tie : null; },
    setTiebreak(patch, by){
      tie = {...(tie || {}), ...patch, by, t: now()};
      try { localStorage.setItem(LS_TIE, JSON.stringify(tie)); } catch(e){}
      this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/tiebreak`), tie));
    },
    clearTiebreak(by){
      tie = {format: "", result: "", winner: null, by, t: now()};
      try { localStorage.setItem(LS_TIE, JSON.stringify(tie)); } catch(e){}
      this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/tiebreak`), tie));
    },

    /* ---- format settings ---------------------------------------------------
       The one admin-controlled number the whole handicap engine reads: what
       percentage of course handicap the format allows. Same shared-singleton
       pattern as tiebreak — one doc, synced everywhere, newest-wins on the
       timestamp. Write access is only gated in the UI (admin-only controls in
       viewSheet), the same as the Reset ALL matches button; there's no
       separate rules-level check. */
    settings(){ return settings; },
    setSettings(patch, by){
      settings = {...settings, ...patch, by, t: now()};
      try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch(e){}
      this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/settings`), settings));
    },

    /* ---- player tees --------------------------------------------------------
       Each player picks his own tee marker, unlike the shared allowance %
       above. Keyed by player id rather than one shared doc — every player
       only ever writes his own entry, so there's no real write contention,
       but each entry is still timestamped and merged newest-wins like
       everything else here for consistency. */
    playerTee(id){
      const p = playerTees[id];
      return (p && typeof p.tee === "string") ? p.tee : DEFAULT_TEE;
    },
    setPlayerTee(id, tee, by){
      playerTees[id] = {tee, by, t: now()};
      try { localStorage.setItem(LS_PTEE, JSON.stringify(playerTees)); } catch(e){}
      this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/playerTees/${id}`), playerTees[id]));
    },

    /* ---- player handicap index ---------------------------------------------
       Several players in the real roster came in with no submitted index
       ("X" on the Groups sheet, defaulted to 0 in PLAYERS) or one that's
       stale by event day. Same override pattern as playerTee — a player's
       PLAYERS[id].idx is the fallback, this is the newest-wins correction
       on top of it, editable from tee confirmation. */
    playerIdx(id){
      const p = playerIdxs[id];
      return (p && typeof p.idx === "number") ? p.idx : (PLAYERS[id] ? PLAYERS[id].idx : 0);
    },
    setPlayerIdx(id, idx, by){
      playerIdxs[id] = {idx, by, t: now()};
      try { localStorage.setItem(LS_PIDX, JSON.stringify(playerIdxs)); } catch(e){}
      this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/playerIdx/${id}`), playerIdxs[id]));
    },

    scorer(id){ return (data[id] || {}).scorer || null; },
    setScorer(id, pid){
      const b = bucket(id), t = now();
      b.scorer = {id: pid, t}; flush(); this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: pid, t}));
    },

    /* Whoever takes over scoring confirms every player's tee before hole 1
       unlocks — same per-match bucket/sync pattern as scorer/submitted. */
    teesConfirmed(id){ const s = (data[id] || {}).teesConfirmed; return !!(s && s.v); },
    setTeesConfirmed(id, by){
      const b = bucket(id), t = now();
      b.teesConfirmed = {v: true, by, t}; flush(); this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/teesConfirmed`), {v: true, by, t}));
    },

    /* A submitted match is signed off and locked. Scoring stays open until
       someone submits, so all 18 holes can be entered for the statistics even
       after the match itself is mathematically over. */
    isSubmitted(id){ const s = (data[id] || {}).submitted; return !!(s && s.v); },
    submittedBy(id){ const s = (data[id] || {}).submitted; return s && s.v ? s.by : null; },
    setSubmitted(id, val, by){
      const b = bucket(id), t = now();
      b.submitted = {v: !!val, by: by || "", t}; flush(); this._emit();
      if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/submitted`),
                     {v: !!val, by: by || "", t}));
    },

    /* Tombstone every hole/entrant this match could ever have, not just the
       ones this phone happens to know about — otherwise a reset issued here
       won't clear scores that only exist on someone else's phone. */
    resetMatch(id){
      const b = bucket(id), t = now(), payload = {};
      const entry = ALL_MATCHES[id];
      const ents = new Set(Object.keys(b.scores).flatMap(h => Object.keys(b.scores[h])));
      if (entry){
        const {r, m} = entry;
        if (r.mode === "team"){ ents.add("s"); ents.add("d"); }
        else ["s","d"].forEach(k => m[k].p.forEach(pl => ents.add(pl[0])));
      }
      const mulEnts = new Set(Object.keys(b.mulligans).flatMap(h => Object.keys(b.mulligans[h])));
      const mulPayload = {};
      for (let h = 0; h < 18; h++) for (const e of ents){
        b.scores[h] = b.scores[h] || {};
        b.scores[h][e] = {v: null, t, by: "reset"};
        payload[`${h}/${e}`] = {v: null, t, by: "reset"};
      }
      for (let h = 0; h < 18; h++) for (const e of mulEnts){
        b.mulligans[h] = b.mulligans[h] || {};
        b.mulligans[h][e] = {v: 0, t, by: "reset"};
        mulPayload[`${h}/${e}`] = {v: 0, t, by: "reset"};
      }
      b.scorer = {id: null, t};
      b.submitted = {v: false, by: "reset", t};
      b.teesConfirmed = {v: false, by: "reset", t};
      flush(); this._emit();
      if (db){
        track(update(ref(db, `${EVENT_KEY}/matches/${id}/scores`), payload));
        if (Object.keys(mulPayload).length)
          track(update(ref(db, `${EVENT_KEY}/matches/${id}/mulligans`), mulPayload));
        track(update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: null, t}));
        track(update(ref(db, `${EVENT_KEY}/matches/${id}/submitted`),
               {v: false, by: "reset", t}));
        track(update(ref(db, `${EVENT_KEY}/matches/${id}/teesConfirmed`),
               {v: false, by: "reset", t}));
      }
    },

    /* ---- chat -------------------------------------------------------------
       Messages are create-only: the rules refuse overwrites and deletes, so
       nobody (including a bot) can rewrite the history. Sends are optimistic —
       the message shows immediately and is marked "sending" until the server
       confirms, so a dead spot never eats a message silently. */
    chat(channel){
      const c = chatData[channel] || {};
      return Object.keys(c).map(id => ({id, ...c[id]}))
        .sort((a, b) => a.t - b.t);
    },
    chatSend(channel, txt, by){
      const t = now();
      const id = db ? push(ref(db, `${EVENT_KEY}/chat/${channel}`)).key
                    : `local-${t}-${Math.random().toString(36).slice(2, 8)}`;
      chatData[channel] = chatData[channel] || {};
      chatData[channel][id] = {by, txt, t, state: "sending"};
      flushChat(); this._emit();
      if (!db){ chatData[channel][id].state = "failed"; flushChat(); this._emit(); return; }
      set(ref(db, `${EVENT_KEY}/chat/${channel}/${id}`), {by, txt, t})
        .then(() => { if (chatData[channel][id]){ delete chatData[channel][id].state;
                      flushChat(); this._emit(); } })
        .catch(err => { chatData[channel][id].state = "failed";
                        chatData[channel][id].err = err.code || String(err);
                        flushChat(); this._emit(); });
    },
    chatRetry(){
      for (const ch in chatData) for (const id in chatData[ch]){
        const m = chatData[ch][id];
        if (m.state !== "failed") continue;
        delete chatData[ch][id];
        this.chatSend(ch, m.txt, m.by);
      }
    },
    chatSeenAt(channel){ return chatSeen[channel] || 0; },
    chatUnread(channel){
      const seen = chatSeen[channel] || 0;
      return this.chat(channel).filter(m => m.t > seen && m.by !== Session.id).length;
    },
    chatMarkRead(channel){
      const list = this.chat(channel);
      chatSeen[channel] = list.length ? list[list.length - 1].t : now();
      try { localStorage.setItem(LS_SEEN, JSON.stringify(chatSeen)); } catch(e){}
    },

    /* ---- backup ------------------------------------------------------------
       A full snapshot of every score, scorer, submission and chat message.
       Restoring feeds it back through the same newest-wins merge the live sync
       uses, so a restore can only ever add back what was lost — it can't
       clobber something newer that happened in the meantime. */
    exportAll(){
      return {app:"crusade-in-the-creek", build:BUILD, event:EVENT_KEY,
              takenAt:new Date(now()).toISOString(), matches:data, chat:chatData};
    },
    /* A restore has to beat a wipe. A reset writes "deleted" markers stamped
       LATER than the backup, so a plain newest-wins merge would refuse to bring
       anything back — useless in the one situation a backup is for. So: a cell
       that currently holds no score is treated as missing and always restored,
       and everything written is re-stamped now so it propagates to phones that
       are still holding the wipe. A cell that holds a real, newer score is left
       alone. */
    importAll(blob){
      if (!blob || blob.event !== EVENT_KEY) throw new Error("That file isn't a Outing backup.");
      let restored = 0, skipped = 0;
      const stamp = now();
      const empty = c => !c || (c.v == null && !c.x);
      for (const id in (blob.matches || {})){
        const inc = blob.matches[id], b = bucket(id);
        for (const h in (inc.scores || {})) for (const e in inc.scores[h]){
          const rc = inc.scores[h][e], lc = (b.scores[h] || {})[e];
          if (!rc || typeof rc.t !== "number") continue;
          if (empty(rc)) continue;                       // nothing to restore
          if (empty(lc) || rc.t > lc.t){
            const cell = {...rc, t: stamp};
            b.scores[h] = b.scores[h] || {}; b.scores[h][e] = cell; restored++;
            if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${e}`), cell));
          } else skipped++;
        }
        for (const h in (inc.mulligans || {})) for (const e in inc.mulligans[h]){
          const rc = inc.mulligans[h][e], lc = (b.mulligans[h] || {})[e];
          if (!rc || typeof rc.t !== "number") continue;
          if (!rc.v) continue;                             // nothing to restore
          if (!lc || !lc.v || rc.t > lc.t){
            const cell = {...rc, t: stamp};
            b.mulligans[h] = b.mulligans[h] || {}; b.mulligans[h][e] = cell; restored++;
            if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/mulligans/${h}/${e}`), cell));
          } else skipped++;
        }
        for (const field of ["scorer","submitted"]){
          const rc = inc[field];
          if (!rc || typeof rc.t !== "number") continue;
          const lc = b[field];
          const lcEmpty = !lc || (field === "scorer" ? !lc.id : !lc.v);
          if (lcEmpty || rc.t > lc.t){
            const cell = {...rc, t: stamp};
            b[field] = cell; restored++;
            if (db) track(update(ref(db, `${EVENT_KEY}/matches/${id}/${field}`), cell));
          } else skipped++;
        }
      }
      for (const ch in (blob.chat || {})){
        chatData[ch] = chatData[ch] || {};
        for (const mid in blob.chat[ch]){
          const msg = blob.chat[ch][mid];
          if (!msg || typeof msg.t !== "number" || chatData[ch][mid]) continue;
          delete msg.state; delete msg.err;
          chatData[ch][mid] = msg; restored++;
          if (db) track(set(ref(db, `${EVENT_KEY}/chat/${ch}/${mid}`), msg));
        }
      }
      flush(); flushChat(); this._emit();
      return {restored, skipped};
    },

    async connect(){
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        // Anonymous sign-in: no login screen, but the database can require a
        // token, which shuts out unauthenticated bots.
        try { await signInAnonymously(getAuth(app)); authed = true; }
        catch(e){ authed = false; console.warn("anonymous auth unavailable", e.code || e); }
        db = getDatabase(app);
        onValue(ref(db, ".info/connected"), s => { connected = !!s.val(); this._emit(); });
        onValue(ref(db, ".info/serverTimeOffset"), s => {
          const v = s.val();
          if (typeof v === "number") clockOffset = v;
        });
        onValue(ref(db, `${EVENT_KEY}/matches`), snap => {
          const all = snap.val() || {}; let changed = false;
          for (const id in all) if (mergeRemote(id, all[id])) changed = true;
          const first = !synced; synced = true;
          // always emit the first snapshot even if it merged nothing — that is
          // the tick the field broadcast uses to learn what's already history
          if (changed || first){ flush(); this._emit(); }
        }, err => console.warn("sync read blocked:", err.code || err));
        /* The server is the authority here, not this phone. Firebase applies a
           write to its local cache before the server has accepted it, so a
           message the rules reject briefly looks real. If we only ever ADDED
           from the snapshot, that phantom would live on this phone forever,
           showing its owner a message nobody else can see. So: rebuild from
           the snapshot each time, keeping only local messages that genuinely
           haven't reached the server yet (still sending, or failed). */
        /* The server is authoritative here, exactly as with chat. Firebase applies
           a write locally before the rules have judged it, so a value the server
           rejects briefly looks real. Taking only "newer" data would leave that
           phantom on this phone forever, and only this phone would see it. So:
           mirror the snapshot, and keep only the fields we recognise. */
        onValue(ref(db, `${EVENT_KEY}/tiebreak`), snap => {
          const v = snap.val();
          tie = (v && typeof v.t === "number")
            ? {format: typeof v.format === "string" ? v.format : "",
               result: typeof v.result === "string" ? v.result : "",
               winner: (v.winner === "s" || v.winner === "d") ? v.winner : null,
               by: typeof v.by === "string" ? v.by : "", t: v.t}
            : null;
          try { localStorage.setItem(LS_TIE, JSON.stringify(tie)); } catch(e){}
          this._emit();
        }, () => {});
        onValue(ref(db, `${EVENT_KEY}/settings`), snap => {
          const v = snap.val();
          settings = (v && typeof v.t === "number")
            ? {pct: typeof v.pct === "number" ? v.pct : DEFAULT_SETTINGS.pct,
               by: typeof v.by === "string" ? v.by : "", t: v.t}
            : {...DEFAULT_SETTINGS};
          try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch(e){}
          this._emit();
        }, () => {});
        onValue(ref(db, `${EVENT_KEY}/playerTees`), snap => {
          const all = snap.val() || {};
          for (const id in all){
            const v = all[id];
            if (!v || typeof v.t !== "number" || typeof v.tee !== "string") continue;
            const cur = playerTees[id];
            if (!cur || v.t > cur.t) playerTees[id] = v;
          }
          try { localStorage.setItem(LS_PTEE, JSON.stringify(playerTees)); } catch(e){}
          this._emit();
        }, () => {});
        onValue(ref(db, `${EVENT_KEY}/playerIdx`), snap => {
          const all = snap.val() || {};
          for (const id in all){
            const v = all[id];
            if (!v || typeof v.t !== "number" || typeof v.idx !== "number") continue;
            const cur = playerIdxs[id];
            if (!cur || v.t > cur.t) playerIdxs[id] = v;
          }
          try { localStorage.setItem(LS_PIDX, JSON.stringify(playerIdxs)); } catch(e){}
          this._emit();
        }, () => {});
        onValue(ref(db, `${EVENT_KEY}/chat`), snap => {
          const all = snap.val() || {}, next = {};
          for (const ch in all){
            next[ch] = {};
            for (const id in all[ch]){
              const m = all[ch][id];
              if (m && typeof m.t === "number") next[ch][id] = m;
            }
          }
          for (const ch in chatData){
            next[ch] = next[ch] || {};
            for (const id in chatData[ch]){
              const m = chatData[ch][id];
              if (m && m.state && !next[ch][id]) next[ch][id] = m;
            }
          }
          chatData = next; flushChat(); this._emit();
        }, err => { chatBlocked = err.code || String(err);
                    console.warn("chat read blocked:", chatBlocked); this._emit(); });
      } catch(e){ console.warn("sync unavailable", e); }
    }
  };
})();

/* ==========================================================================
   5. SESSION
   ========================================================================== */
const Session = {
  get id(){ return localStorage.getItem(`${EVENT_KEY}_me`); },
  set id(v){ v ? localStorage.setItem(`${EVENT_KEY}_me`, v)
                : localStorage.removeItem(`${EVENT_KEY}_me`); },
  get me(){ return PLAYERS[this.id] || null; },
  get admin(){ return !!(this.me && this.me.admin); },
  find(code){
    const c = (code || "").trim().toUpperCase();
    return Object.keys(PLAYERS).find(id => PLAYERS[id].code === c) || null;
  }
};
const inMatch = (m, pid) => [...m.s.p, ...m.d.p].some(x => x[0] === pid);
/* Scoring is never granted implicitly. Someone in the match must actively
   declare themselves scorekeeper first — otherwise four men open the same
   match, all get editable boxes, and the card turns to mush. */
function canScore(m){
  const me = Session.id; if (!me) return false;
  if (Store.isSubmitted(m.id)) return false;     // signed off — reopen to edit
  if (Session.admin) return true;
  const sc = Store.scorer(m.id);
  return !!(sc && sc.id === me);
}
const canClaim = m => Session.admin || inMatch(m, Session.id);
function myMatch(){
  for (const r of ROUNDS) for (const m of r.matches){
    if (inMatch(m, Session.id) && !matchState(r, m, Store.scores(m.id)).done) return m.id;
  }
  for (let i = ROUNDS.length - 1; i >= 0; i--)
    for (const m of ROUNDS[i].matches) if (inMatch(m, Session.id)) return m.id;
  return null;
}

/* ==========================================================================
   6. VIEW HELPERS
   ========================================================================== */
let V = {view:"home", round:0, matchId:null, hole:0, sheet:null, pending:false,
         chan:"all", draft:null, refocusChat:false, statSort:"net", fromCard:false,
         tagOpen:false, briefOpen:false};

/* GitHub Pages caches the page, so a phone can keep running an old build for
   hours after a fix ships. Poll for a newer BUILD and offer a one-tap reload —
   nobody on a golf course is going to know how to clear a browser cache. */
let updateReady = false;
async function checkForUpdate(){
  if (updateReady) return;
  try {
    // a 12-byte file, not the whole 100KB page — this runs every 10 minutes on
    // 20 phones using their cellular data
    const res = await fetch(`version.txt?cb=${Date.now()}`, {cache: "no-store"});
    if (!res.ok) return;
    const live = (await res.text()).trim();
    if (live && live !== BUILD){ updateReady = true; if (Session.id) render(); }
  } catch(e){ /* offline — try again later */ }
}
function applyUpdate(){
  // a plain reload can be served from cache; a fresh query string cannot
  location.replace(location.pathname + "?v=" + Date.now());
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
const shotLbl = n => `${n <= 0 ? 0 : n} shot${n === 1 ? "" : "s"}`;
const fmtIdx = i => i < 0 ? `+${Math.abs(i).toFixed(1)}` : i.toFixed(1);

/* Golf scorecard notation: under par is red and circled (1 ring per stroke
   under), over par is black and boxed. Par is a plain black number. */
function markCls(gross, par){
  if (gross == null) return "";
  const d = gross - par;
  if (d < 0) return `u c${Math.min(3, -d)}`;
  if (d > 0) return `b${Math.min(3, d)}`;
  return "";
}
function yards(r, m, h){
  const c = COURSES[r.course], tee = m.tee || r.tee;
  if (c.yds[tee]) return c.yds[tee][h] + " yds";
  const parts = tee.split("/").filter(p => c.yds[p]);
  if (parts.length === 2) return `${c.yds[parts[0]][h]}/${c.yds[parts[1]][h]} yds`;
  return null;
}
/** One dot per stroke, colour-coded by which competition it's for — red for
    the Ryder Cup match play (Comp 1), gold for the foursome stroke play
    (Comp 2). A hole can carry a stroke for one, the other, both, or neither. */
const dotsHTML = (n1, n2) => {
  n1 = n1 || 0; n2 = n2 || 0;
  if (n1 <= 0 && n2 <= 0) return "";
  const d1 = '<span class="dot c1"></span>'.repeat(n1);
  const d2 = '<span class="dot c2"></span>'.repeat(n2);
  return `<span class="gsdots">${d1}${d2}</span>`;
};

/* ==========================================================================
   7. RENDER
   ========================================================================== */
function render(){
  const app = $("#app");
  /* An id we don't recognise is worse than no id: it walks straight past the
     lock screen and then every view throws on a null player, leaving a white
     screen with no way back that nobody on a tee box can fix. Treat it as
     signed out. */
  if (Session.id && !Session.me) Session.id = null;
  if (!Session.id){ app.innerHTML = viewLogin(); wireLogin(); return; }
  if (V.view === "welcome"){ app.innerHTML = viewWelcome(); wireWelcome(); return; }
  let html = updateReady
    ? `<button class="updbar" data-update="1">A newer version is ready &mdash; tap to update</button>` : "";
  if (V.view === "home")  html += viewHome();
  if (V.view === "board") html += viewBoard();
  if (V.view === "matches") html += viewMatches();
  if (V.view === "profile") html += viewProfile();
  if (V.view === "stats") html += viewStats();
  if (V.view === "chat")  html += viewChat();
  if (V.view === "round") html += viewRound();
  if (V.view === "brief") html += viewBrief();
  if (V.view === "match") html += viewMatch();
  if (V.view === "card")  html += viewCard();
  if (V.view === "event") html += viewEventOverview();
  if (V.sheet) html += viewSheet();
  app.innerHTML = html;
  // turf only where legibility isn't critical: never on match entry or the card
  const TURF = ["home", "board", "matches", "profile", "stats", "round", "brief", "event"];
  document.body.classList.toggle("turf", TURF.includes(V.view));
  wire();
  mountVflashes();   // any live hole banners re-attach to the rebuilt DOM
}

   is exactly what it should track). */
const WELCOMED_KEY = `${EVENT_KEY}_welcomed`;

  try { return JSON.parse(localStorage.getItem(WELCOMED_KEY) || "[]"); } catch(e){ return []; }

  const inp = $("#code");

    render();
  };
  $("#go").onclick = submit;
  inp.oninput = () => { $("#err").textContent = ""; if (inp.value.length === 4) submit(); };
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
}

/** Round-level roll-up used by both the Matches list and the Leaderboard. */
function roundSummary(r){
  let s = 0, d = 0, done = 0, live = 0, sLead = 0, dLead = 0, allSq = 0, notStarted = 0;
  r.matches.forEach(m => {
    const ms = matchState(r, m, Store.scores(m.id));
    if (ms.done){ s += ms.pts.s; d += ms.pts.d; done++; }
    else if (ms.started || matchBegun(m.id)){ live++;
      if (ms.up > 0) sLead++; else if (ms.up < 0) dLead++; else allSq++; }
    else notStarted++;
  });
  return {s, d, done, live, sLead, dLead, allSq, notStarted,
          complete: done === r.matches.length, started: done + live > 0};
}
const roundBadge = sum => sum.complete ? `<span class="badge fin">Complete</span>`
  : sum.live ? `<span class="badge live">Live</span>`
  : `<span class="badge soon">Upcoming</span>`;

/** The tiebreak panel. Everyone sees the stand-off; only Pat and Andrew can act. */
function tiebreakHTML(){
  const ev = eventResult();
  if (!ev.complete || !ev.tied) return "";
  const tb = ev.tb || {};
  const admin = Session.admin;

  if (ev.winner){
    const w = ev.winner === "s" ? "KRAFT" : "HEINZ";
    return `<div class="tug decided ${ev.winner}">
      <div class="tugtitle">The Outing is tied ${fmtPt(ev.st.s)}&ndash;${fmtPt(ev.st.d)}</div>
      ${tugSVG()}
      <div class="tugwin">${w} WIN ON THE TIEBREAK</div>
      ${tb.format ? `<div class="tugrow"><span>Tiebreak</span><b>${esc(tb.format)}</b></div>` : ""}
      ${tb.result ? `<div class="tugrow"><span>Result</span><b>${esc(tb.result)}</b></div>` : ""}
      <div class="tugby">Declared by ${esc(PLAYERS[tb.by] ? PLAYERS[tb.by].n : "a commissioner")}</div>
      ${admin ? `<button class="btn ghost" data-tbreset="1" style="margin-top:10px">Redo the tiebreak</button>` : ""}
    </div>`;
  }

  // stage 1: nobody has said what the tiebreak is yet
  if (!tb.format){
    return `<div class="tug">
      <div class="tugtitle">The Outing is tied ${fmtPt(ev.st.s)}&ndash;${fmtPt(ev.st.d)}</div>
      ${tugSVG()}
      <div class="tugsub">It comes down to a tiebreak.</div>
      ${admin ? `<div class="tugform">
        <label for="tbformat">What is the tiebreak? Decide it on the spot &mdash; whatever the
          course will allow.</label>
        <textarea id="tbformat" class="tbin" rows="2" maxlength="300"
          placeholder="e.g. Sudden death, one man a side, 18th hole"></textarea>
        <button class="btn" data-tbformat="1">Set the tiebreak</button>
      </div>` : `<div class="tugsub small">Pat or Andrew will set it.</div>`}
    </div>`;
  }

  // stage 2: format declared, waiting on the result
  return `<div class="tug">
    <div class="tugtitle">The Outing is tied ${fmtPt(ev.st.s)}&ndash;${fmtPt(ev.st.d)}</div>
    ${tugSVG()}
    <div class="tugrow"><span>Tiebreak</span><b>${esc(tb.format)}</b></div>
    ${admin ? `<div class="tugform">
      <label for="tbresult">How did it finish?</label>

    </div>` : `<div class="tugsub small">Waiting on the result.</div>`}
  </div>`;
}

/* ---------- Competition 2: foursome stroke play ----------
   Every foursome (the same four who play Competition 1 together) stands as
   its own team here, ranked on total strokes relative to par — the lowest
   net score of the foursome on each hole, summed stroke-play style. */
function comp2Standings(){
  const rows = [];
  ROUNDS.forEach(r => r.matches.forEach(m => {
    if (r.mode === "team") return;   // Comp 2 only applies to individual-format rounds
    const stat = comp2FoursomeTotal(r, m, Store.scores(m.id));
    rows.push({r, m, ...stat, names: matchPlayerIds(r, m).map(id => last(id)).join(" / ")});
  }));
  rows.sort((a, b) => (b.thru > 0) - (a.thru > 0) || a.toPar - b.toPar || b.thru - a.thru);
  return rows;
}
function comp2BoardHTML(){
  const rows = comp2Standings();
  if (!rows.length) return `<div class="empty">No foursomes yet.</div>`;
  const body = rows.map((row, i) => `<button class="card" data-nav="match" data-id="${row.m.id}">
    <div class="rowline">
      <div class="rnum">${i + 1}</div>
      <div class="rmeta"><div class="t1">${esc(row.names)}</div>
        <div class="t2">${row.thru ? `thru ${row.thru}` : "not started"}</div></div>
      <div class="rright"><div class="big mono">${row.thru ? toPar(row.toPar) : "&mdash;"}</div></div>
      <div class="chev">&rsaquo;</div>
    </div></button>`).join("");
  return `<div class="legend" style="margin-bottom:10px;border:none;padding:0">
      Each foursome's best net score on every hole entered, added up stroke-play
      style against every other foursome in the round &mdash; lower is better.</div>${body}`;
}

/* ---------- leaderboard (Ryder Cup style) ----------
   Deliberately different from All Matches: this is a board you read, not a
   menu you navigate. Each row puts a side on the left, a side on the right,
   and the running status between them, with the leader's half tinted. */
function viewBoard(){
  const st = standings();
  let out = "";
  ROUNDS.forEach((r, ri) => {
    const sum = roundSummary(r);
    let rows = "";
    r.matches.forEach(m => {
      const ms = matchState(r, m, Store.scores(m.id));
      const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
      const win = ms.winner, done = ms.done;
      const cls = k => k === win ? `win ${k}` : (win ? "lose" : k);
      let status, thru, midCls = "";
      if (!ms.started){ status = `<span class="st h">&ndash;</span>`; thru = esc(m.t); }
      else if (done){
        // finished: the whole box takes the winner's colour, halves stay grey
        midCls = win ? `won ${win}` : "won h";
        status = `<span class="st">${win ? esc(ms.text) : "AS"}</span>`;
        thru = win ? (Store.isSubmitted(m.id) ? "FINAL" : "unconfirmed") : "HALVED";
      } else {
        status = `<span class="st ${ms.up > 0 ? "s" : ms.up < 0 ? "d" : "h"}">${
          ms.up === 0 ? "AS" : `${Math.abs(ms.up)}&#9650;`}</span>`;
        thru = `THRU ${ms.thru}`;
      }
      rows += `<button class="lbrow" data-nav="match" data-id="${m.id}">
        <span class="lbside ${cls("s")}">${esc(nm("s"))}</span>
        <span class="lbmid ${midCls}">${status}<span class="thru">${thru}</span></span>
        <span class="lbside right ${cls("d")}">${esc(nm("d"))}</span></button>`;
    });
    const tally = sum.live
      ? `<span class="s">Kraft lead ${sum.sLead}</span><span class="sep">&middot;</span>
         <span class="d">Heinz lead ${sum.dLead}</span>${
           sum.allSq ? `<span class="sep">&middot;</span><span style="color:var(--muted)">${sum.allSq} AS</span>` : ""}${
           sum.done ? `<span class="sep">&middot;</span><span style="color:var(--dim)">${sum.done} final</span>` : ""}`
      : sum.started
        ? `<span class="s">Kraft ${fmtPt(sum.s)}</span><span class="sep">&middot;</span>
           <span class="d">Heinz ${fmtPt(sum.d)}</span>`
        : `<span style="color:var(--dim);font-weight:650">${r.matches.length} matches &middot; ${esc(r.matches[0].t)}</span>`;
    out += `<div class="lbround">
      <div class="lbhead"><div class="rd">
        <div class="r1">ROUND ${r.n} &middot; ${esc(COURSES[r.course].n.toUpperCase())}</div>
        <div class="r2">${esc(r.fmt)} &middot; ${esc(r.day)}</div></div>
        ${roundBadge(sum)}</div>
      <div class="lbtally">${tally}</div>${rows}</div>`;
  });
  const tab = V.boardTab === "comp2" ? "comp2" : "comp1";
  const tabBtn = (key, label) => `<button data-boardtab="${key}" style="flex:1;padding:10px;
    border-radius:10px;font-weight:750;font-size:13px;border:1px solid var(--line);
    background:${tab === key ? "var(--text)" : "var(--surface)"};
    color:${tab === key ? "#fff" : "var(--text)"}">${label}</button>`;
  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Leaderboard<div class="sub">${tab === "comp2" ? "Foursome Stroke Play"
        : `Kraft vs Heinz &middot; ${fmtPt(CLINCH)} to clinch`}</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div style="display:flex;gap:8px;margin-bottom:14px">${tabBtn("comp1", "Ryder Cup")}${tabBtn("comp2", "Stroke Play")}</div>
      ${tab === "comp2" ? comp2BoardHTML() : `${boardHTML(st)}${tiebreakHTML()}${out}${syncHTML()}`}
    </div>`;
}

/* ---------- chat ----------
   Tags are parsed out of the message text rather than stored as their own field.
   That keeps the database shape unchanged — no rules to republish — and a tag
   still reads naturally to anyone looking at the raw message. */
const myChannel = () => Session.me.t === "s" ? "snots" : "ducks";
const mentionsMe = txt => {
  const me = PLAYERS[Session.id];
  if (!me || !txt) return false;
  const first = me.n.split(" ")[0], surname = last(Session.id);
  return new RegExp(`@(${esc(me.n)}|${first}|${surname})\\b`, "i").test(txt);
};
/** Wrap @Name in a highlight, flagging the reader's own tags. */
function renderMsgText(txt){
  const names = Object.keys(PLAYERS).map(id => PLAYERS[id].n)
    .sort((a, b) => b.length - a.length);
  const alts = names.concat(Object.keys(PLAYERS).map(id => last(id)))
    .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return esc(txt).replace(new RegExp(`@(${alts})\\b`, "gi"),
    m => `<span class="men${mentionsMe(m) ? " me" : ""}">${m}</span>`);
}
/** Unread messages in a channel that tag me. */
function taggedUnread(channel){
  const seen = Store.chatSeenAt(channel);
  return Store.chat(channel).filter(m =>
    m.t > seen && m.by !== Session.id && mentionsMe(m.txt)).length;
}
const taggedTotal = () => taggedUnread("all") + taggedUnread(myChannel());
const clockTime = t => new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});

function viewChat(){
  const ch = V.chan === "team" ? myChannel() : "all";
  const mine = Session.me.t;
  const msgs = Store.chat(ch);
  const otherUnread = Store.chatUnread(V.chan === "team" ? "all" : myChannel());
  const failed = msgs.some(m => m.state === "failed");

  const list = msgs.length ? msgs.map(m => {
    const p = PLAYERS[m.by], own = m.by === Session.id;
    const who = p ? p.n : "Unknown";
    const team = p ? p.t : "s";
    return `<div class="msg ${own ? "mine" : ""}${mentionsMe(m.txt) && !own ? " tagged" : ""}">
      ${own ? "" : `<div class="who ${team}">${esc(who)}</div>`}
      <div class="bub">${renderMsgText(m.txt)}</div>
      <div class="meta">${clockTime(m.t)}${
        m.state === "sending" ? ` &middot; <span class="sending">sending&hellip;</span>` :
        m.state === "failed"  ? ` &middot; <span class="failed">not sent</span>` : ""}</div>
    </div>`;
  }).join("") : `<div class="chatempty">${ch === "all"
      ? "Nothing here yet. Say something to all twenty."
      : `Nothing here yet. This one only goes to the ${mine === "s" ? "Kraft" : "Heinz"}.`}</div>`;

  const badge = n => n > 0 ? `<span class="dotbadge">${n > 99 ? "99+" : n}</span>` : "";

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Chat<div class="sub">${ch === "all" ? "Everyone &middot; all 20 players"
        : `${mine === "s" ? "Kraft" : "Heinz"} only &middot; your 10`}</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div class="chanbar">
        <button class="${V.chan !== "team" ? "on" : ""}" data-chan="all">Everyone${
          V.chan === "team" ? badge(otherUnread) : ""}</button>
        <button class="${V.chan === "team" ? "on " + mine : ""}" data-chan="team">${
          mine === "s" ? "Kraft" : "Heinz"} only${V.chan !== "team" ? badge(otherUnread) : ""}</button>
      </div>
      ${Store.chatBlocked ? `<div class="warnbar"><b>Chat isn't switched on yet.</b>
        The database is still refusing chat messages &mdash; Andrew needs to publish the
        updated rules in the Firebase console. Scoring is unaffected.</div>` : ""}
      ${failed ? `<div class="warnbar"><b>Some messages didn't send.</b>
        <button data-retry="1" style="color:var(--red);font-weight:750;text-decoration:underline">
        Try again &rsaquo;</button></div>` : ""}
      <div class="chatwrap">
        <div class="chatlist" id="chatlist">${list}</div>
        <div class="composer">
          <button class="tagbtn" id="tagbtn" title="Tag someone">@</button>
          <textarea class="chatin" id="chatin" rows="1" maxlength="500"
            placeholder="${ch === "all" ? "Message everyone…" : `Message the ${mine === "s" ? "Kraft" : "Heinz"}…`}"></textarea>
          <button class="sendbtn" id="chatsend">Send</button>
        </div>
        ${V.tagOpen ? `<div class="tagpick">
          <div class="tagpickhd">Tag someone &mdash; they'll see it next time they open the app</div>
          ${(ch === "all" ? Object.keys(PLAYERS)
              : Object.keys(PLAYERS).filter(id => PLAYERS[id].t === Session.me.t))
            .filter(id => id !== Session.id)
            .map(id => `<button class="tagname ${PLAYERS[id].t}" data-tag="${id}">
              ${avatarSVG(id, "sm")}<span>${esc(PLAYERS[id].n)}</span></button>`).join("")}
        </div>` : ""}
      </div>
      <div class="savedtag">${ch === "all"
        ? "Everyone on the trip sees this."
        : "Only your team sees this in the app &mdash; but it isn't encrypted. Don't put anything in here you'd mind the other side reading."}</div>
    </div>`;
}

/* Monogram: an astronaut for a Snot, a duck for a Duck. Stands in for a photo

/** Round 3's shotgun-mulligan badge: a small beer-mug monogram, same circular

/* ---------- appearances badge ----------
   Each man's `yrs` is how many Outings he's played. That earns a rank, shown
   as a pin flag: one stripe a year up to Mainstay, then stars for a Veteran. */
const TIERS = [
  {min:4, key:"vet",      label:"Veteran",  colour:"#e0b83a", edge:"#8a6d00", marks:4, stars:true},
  {min:3, key:"mainstay", label:"Mainstay", colour:"#c3ccd3", edge:"#78828a", marks:3},
  {min:2, key:"returner", label:"Returner", colour:"#c07f36", edge:"#7a4a17", marks:2},
  {min:1, key:"rookie",   label:"Rookie",   colour:"#49ab63", edge:"#1f6b36", marks:1}
];
const tierFor = yrs => TIERS.find(t => (yrs || 0) >= t.min) || TIERS[TIERS.length - 1];

function tierFlagSVG(yrs, cls){
  const t = tierFor(yrs), DEEP = "#0b2a1c";
  const star = (cx, cy, r) => {
    let d = "";
    for (let i = 0; i < 10; i++){
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
      d += `${i ? "L" : "M"}${(cx + Math.cos(a) * rr).toFixed(1)} ${(cy + Math.sin(a) * rr).toFixed(1)} `;
    }
    return `<path d="${d}Z" fill="${DEEP}" opacity=".8"/>`;
  };
  let marks = "";
  if (t.stars){
    marks = star(27, 17.5, 4.3) + star(39, 17.5, 4.3) + star(27, 27.5, 4.3) + star(39, 27.5, 4.3);
  } else {
    // stripes sit as a centred block on the flag, whatever the count
    const top = 22.5 - ((t.marks - 1) * 6) / 2 - 1.6;
    for (let i = 0; i < t.marks; i++)
      marks += `<rect x="21" y="${(top + i * 6).toFixed(1)}" width="26" height="3.2" rx="1.6"
        fill="${DEEP}" opacity=".78"/>`;
  }
  return `<svg class="tflag ${cls || ""}" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="14" y="8" width="3.4" height="48" rx="1.7" fill="#6b7078"/>
    <circle cx="15.7" cy="8" r="2.6" fill="#6b7078"/>
    <path d="M17.4 10 H50 v25 H17.4 z" fill="${t.colour}" stroke="${t.edge}" stroke-width="2.4"
      stroke-linejoin="round"/>${marks}</svg>`;
}
/** The rank line under a player's team on his card. */
function tierBadgeHTML(yrs){
  const t = tierFor(yrs), n = yrs || 0;
  return `<div class="tierrow ${t.key}">${tierFlagSVG(yrs)}
    <span class="tiername">${t.label}</span>
    <span class="tiercount">${n} Outing${n === 1 ? "" : "s"}</span></div>`;
}

/* ---------- player profile ---------- */
/** The card at the top of a profile: monogram, name, team, admin flag, and

function profileCardHTML(id){

      ${avatarSVG(id, "big")}
      <div class="pname">${esc(p.n)}</div>
      <div class="pteam">${p.t === "s" ? "KRAFT" : "HEINZ"}${

      <div class="pfacts">
        ${fact("Handicap", fmtIdx(Store.playerIdx(id)))}
        ${fact("Gross to Par", stats ? toPar(stats.grossToPar) : "&mdash;")}
        ${fact("Net to Par", stats ? toPar(stats.netToPar) : "&mdash;")}
