<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Covid Cup 2026</title>
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a1830">
<style>
:root{
  --bg:#0a1830; --surface:#0f2038; --surface2:#122845; --surface3:#173058;
  --line:#28405f; --text:#f0f3f8; --muted:#9fb0c9; --dim:#7288a6; --accent:#c7a34d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:64px;}
h1{font-size:22px;margin:0;}
h2{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
p{color:var(--muted);margin:0 0 8px;font-size:14px;}
header{padding:22px 16px 14px;border-bottom:1px solid var(--line);}
header .sub{color:var(--muted);font-size:14px;margin-top:4px;}
main{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;}
th{color:var(--dim);font-weight:500;}
.pairing{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.pairing:last-child{border-bottom:none;}
.pairing .names{font-size:15px;}
.pairing .meta{color:var(--dim);font-size:13px;}
.empty{color:var(--dim);font-size:14px;padding:12px 0;text-align:center;}
.stats{display:flex;gap:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:12px;color:var(--dim);}
footer{text-align:center;color:var(--dim);font-size:12px;padding:20px;}
nav.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--bg);border-bottom:1px solid var(--line);}
nav.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:12px 4px;font-size:14px;
  cursor:pointer;border-bottom:2px solid transparent;}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
.hidden{display:none !important;}
.pick-item{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);
  border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;}
.pick-item .pair{color:var(--dim);font-size:12px;}
button.link{background:none;border:none;color:var(--accent);padding:2px 4px;cursor:pointer;font-size:13px;}
.hole-row{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--line);}
.hole-row:last-child{border-bottom:none;}
.hole-row .hno{font-size:13px;color:var(--dim);}
.hole-row .hno b{color:var(--text);display:block;font-size:15px;}
.hole-row input{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px;font-size:15px;text-align:center;}
.hole-row input:focus{outline:2px solid var(--accent);}
.hole-row.scramble{grid-template-columns:44px 1fr;}
.entry-label{font-size:11px;color:var(--dim);text-align:center;margin-bottom:2px;}
.totals{display:flex;justify-content:space-between;padding-top:10px;font-size:14px;}
.totals b{color:var(--accent);}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:22px;color:var(--dim);font-size:13px;}
.lb-names{flex:1;font-size:14px;}
.lb-thru{color:var(--dim);font-size:12px;}
.lb-topar{font-weight:700;min-width:36px;text-align:right;}
</style>
</head>
<body>

<header>
  <h1 id="eventName">Covid Cup 2026</h1>
  <div class="sub" id="eventSub">Loading event details…</div>
</header>

<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="score">Scorecard</button>
  <button data-tab="board">Leaderboard</button>
</nav>

<main>
  <section id="tab-home">
    <div class="card">
      <h2>Course</h2>
      <div id="courseInfo"><p>Not set up yet.</p></div>
    </div>
    <div class="card">
      <h2>Format</h2>
      <div class="stats" id="formatStats"></div>
    </div>
    <div class="card">
      <h2>Pairings</h2>
      <div id="pairingsList"><p class="empty">No pairings posted yet.</p></div>
    </div>
  </section>

  <section id="tab-score" class="hidden">
    <div class="card" id="whoAmICard">
      <h2>Who are you?</h2>
      <p>Pick your name to pull up your pairing's scorecard.</p>
      <div id="whoAmIList"></div>
    </div>
    <div class="card hidden" id="scorecardCard">
      <h2>Scorecard</h2>
      <p id="scorecardSub"></p>
      <div id="holeGrid"></div>
      <div class="totals">
        <span>Thru <b id="scThru">0</b></span>
        <span>Total <b id="scToPar">—</b></span>
      </div>
      <button class="link" id="switchPlayerBtn" style="margin-top:8px;">Not you? Switch player</button>
    </div>
  </section>

  <section id="tab-board" class="hidden">
    <div class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboardList"><p class="empty">No scores posted yet.</p></div>
    </div>
  </section>
</main>

<footer id="versionFooter"></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { FIREBASE_CONFIG, FIREBASE_CONFIGURED } from "./firebase-config.js";
import { coursePar, playingHandicap, scrambleTeamHandicap, pairingTotals, fmtToPar } from "./scoring.js";

const DB_PATH = "covidcup";
const SCORES_PATH = "covidcup_scores";
const LS_KEY = "covidcup_admin_draft"; // local fallback if Firebase isn't configured
const ME_KEY = "covidcup_me";

const SCORING_LABELS = {
  "net-best-ball": "Net best ball",
  "shamble": "Shamble",
  "scramble": "Scramble",
  "stroke-net": "Stroke play (net)",
  "stroke-gross": "Stroke play (gross)"
};

let cfg = { course: {}, roster: {}, pairings: {}, settings: {} };
let scores = {};
let db = null;
const writeTimers = new Map();

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- tabs ---------- */
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["home", "score", "board"].forEach(t => document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab));
    if (btn.dataset.tab === "score") renderScoreTab();
    if (btn.dataset.tab === "board") renderLeaderboard();
  });
});

/* ---------- home tab ---------- */
function renderHome(){
  const course = cfg.course || {};
  const roster = cfg.roster || {};
  const pairings = cfg.pairings || {};
  const settings = cfg.settings || {};

  document.getElementById("eventName").textContent = course.name || "Covid Cup 2026";
  document.getElementById("eventSub").textContent = course.location
    ? `${course.location} · ${Object.keys(roster).length} players`
    : `${Object.keys(roster).length} players`;

  const courseInfo = document.getElementById("courseInfo");
  if (course.holes && course.holes.length){
    const teesLine = (course.tees || []).map(t => esc(t.name) + (t.rating ? ` (${t.rating}/${t.slope || "?"})` : "")).join(" &middot; ");
    courseInfo.innerHTML = `
      <p>${course.holes.length} holes &middot; par ${coursePar(course.holes)}</p>
      ${teesLine ? `<p>Tees: ${teesLine}</p>` : ""}
    `;
  } else {
    courseInfo.innerHTML = `<p>Not set up yet.</p>`;
  }

  document.getElementById("formatStats").innerHTML = `
    <div class="stat"><div class="n">${SCORING_LABELS[settings.scoringType] || "—"}</div><div class="l">Scoring</div></div>
    <div class="stat"><div class="n">${settings.hcpAllowance != null ? settings.hcpAllowance + "%" : "—"}</div><div class="l">Handicap allowance</div></div>
    <div class="stat"><div class="n">${settings.shotgun ? "Shotgun" : "Tee times"}</div><div class="l">Start</div></div>
  `;

  const list = document.getElementById("pairingsList");
  const entries = Object.values(pairings);
  list.innerHTML = entries.length ? entries.map(p => {
    const names = (p.playerIds || []).map(id => roster[id]?.name || "?").join(" / ");
    return `<div class="pairing"><span class="names">${esc(names)}</span><span class="meta">${esc(p.start || "")}</span></div>`;
  }).join("") : `<p class="empty">No pairings posted yet.</p>`;
}

/* ---------- handicap helpers ---------- */
function teeFor(playerId){
  const p = cfg.roster[playerId];
  const tees = cfg.course.tees || [];
  return tees.find(t => t.name === p?.tee) || tees[0];
}
function phFor(playerId){
  const p = cfg.roster[playerId];
  if (!p) return 0;
  return playingHandicap(+p.hcp || 0, teeFor(playerId), coursePar(cfg.course.holes || []), cfg.settings.hcpAllowance);
}
function pairingHandicaps(pairing){
  const [idA, idB] = pairing.playerIds || [];
  const phA = phFor(idA), phB = phFor(idB);
  const teamPh = (cfg.settings.scoringType === "scramble") ? scrambleTeamHandicap(phA, phB) : null;
  return { idA, idB, phA, phB, teamPh };
}
function myPairing(){
  const me = localStorage.getItem(ME_KEY);
  if (!me) return null;
  const entry = Object.entries(cfg.pairings || {}).find(([, p]) => (p.playerIds || []).includes(me));
  return entry ? { id: entry[0], pairing: entry[1] } : null;
}

/* ---------- score tab ---------- */
function renderScoreTab(){
  const mine = myPairing();
  document.getElementById("whoAmICard").classList.toggle("hidden", !!mine);
  document.getElementById("scorecardCard").classList.toggle("hidden", !mine);
  if (!mine){ renderWhoAmI(); return; }
  renderScorecard(mine.id, mine.pairing);
}

function renderWhoAmI(){
  const list = document.getElementById("whoAmIList");
  const roster = cfg.roster || {};
  const pairings = cfg.pairings || {};
  const partnerOf = {};
  Object.values(pairings).forEach(p => {
    const [a, b] = p.playerIds || [];
    if (a) partnerOf[a] = roster[b]?.name || "unpaired";
    if (b) partnerOf[b] = roster[a]?.name || "unpaired";
  });
  const ids = Object.keys(roster);
  list.innerHTML = ids.length ? ids.map(id => `
    <div class="pick-item" data-id="${id}">
      <span>${esc(roster[id].name)}</span>
      <span class="pair">${partnerOf[id] ? "w/ " + esc(partnerOf[id]) : "unpaired"}</span>
    </div>
  `).join("") : `<p class="empty">Roster isn't posted yet.</p>`;
  list.querySelectorAll(".pick-item").forEach(el => el.addEventListener("click", () => {
    localStorage.setItem(ME_KEY, el.dataset.id);
    renderScoreTab();
  }));
}

function renderScorecard(pairingId, pairing){
  const roster = cfg.roster || {};
  const holes = cfg.course.holes || [];
  const format = cfg.settings.scoringType || "net-best-ball";
  const { idA, idB, phA, phB, teamPh } = pairingHandicaps(pairing);
  const nameA = roster[idA]?.name || "Player A";
  const nameB = roster[idB]?.name || "Player B";
  const isScramble = format === "scramble";

  document.getElementById("scorecardSub").textContent =
    `${nameA} / ${nameB} · ${SCORING_LABELS[format]}` +
    (isScramble ? ` · team hcp ${teamPh}` : ` · hcp ${phA} / ${phB}`);

  const holeScores = scores[pairingId] || {};
  const grid = document.getElementById("holeGrid");
  grid.innerHTML = holes.map(h => {
    const entry = holeScores[h.number] || {};
    if (isScramble){
      return `
        <div class="hole-row scramble" data-hole="${h.number}">
          <div class="hno"><b>${h.number}</b>par ${h.par}</div>
          <div><div class="entry-label">Team</div>
            <input type="number" min="1" inputmode="numeric" data-field="team" value="${entry.team ?? ""}"></div>
        </div>`;
    }
    return `
      <div class="hole-row" data-hole="${h.number}">
        <div class="hno"><b>${h.number}</b>par ${h.par}</div>
        <div><div class="entry-label">${esc(nameA.split(" ")[0])}</div>
          <input type="number" min="1" inputmode="numeric" data-field="${idA}" value="${entry[idA] ?? ""}"></div>
        <div><div class="entry-label">${esc(nameB.split(" ")[0])}</div>
          <input type="number" min="1" inputmode="numeric" data-field="${idB}" value="${entry[idB] ?? ""}"></div>
      </div>`;
  }).join("");

  grid.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => {
    const hole = inp.closest(".hole-row").dataset.hole;
    const field = inp.dataset.field;
    const val = inp.value === "" ? null : +inp.value;
    scores[pairingId] = scores[pairingId] || {};
    scores[pairingId][hole] = scores[pairingId][hole] || {};
    scores[pairingId][hole][field] = val;
    updateScoreTotals(pairingId, pairing);
    queueScoreWrite(pairingId, hole, field, val);
  }));

  document.getElementById("switchPlayerBtn").onclick = () => {
    localStorage.removeItem(ME_KEY);
    renderScoreTab();
  };

  updateScoreTotals(pairingId, pairing);
}

// scoring.js works in generic {a,b,team} terms; storage is keyed by real
// player id so either partner's entry is unambiguous. Remap between the two.
function mapForScoring(rawHoleScores, idA, idB){
  const out = {};
  Object.entries(rawHoleScores || {}).forEach(([hole, entry]) => {
    out[hole] = { a: entry[idA] ?? null, b: entry[idB] ?? null, team: entry.team ?? null };
  });
  return out;
}

function updateScoreTotals(pairingId, pairing){
  const holes = cfg.course.holes || [];
  const format = cfg.settings.scoringType || "net-best-ball";
  const { idA, idB, phA, phB, teamPh } = pairingHandicaps(pairing);
  const holeScores = mapForScoring(scores[pairingId], idA, idB);
  const t = pairingTotals(format, holes, holeScores, phA, phB, teamPh);
  document.getElementById("scThru").textContent = t.thru;
  document.getElementById("scToPar").textContent = t.thru ? fmtToPar(t.toPar) : "—";
}

function queueScoreWrite(pairingId, hole, field, val){
  if (!db) { localStorage.setItem("covidcup_scores_draft", JSON.stringify(scores)); return; }
  const key = `${pairingId}|${hole}|${field}`;
  clearTimeout(writeTimers.get(key));
  writeTimers.set(key, setTimeout(() => {
    writeTimers.delete(key);
    update(ref(db, `${SCORES_PATH}/${pairingId}/${hole}`), { [field]: val }).catch(err => console.error(err));
  }, 400));
}

/* ---------- leaderboard tab ---------- */
function renderLeaderboard(){
  const roster = cfg.roster || {};
  const pairings = cfg.pairings || {};
  const holes = cfg.course.holes || [];
  const format = cfg.settings.scoringType || "net-best-ball";

  const rows = Object.entries(pairings).map(([id, pairing]) => {
    const { idA, idB, phA, phB, teamPh } = pairingHandicaps(pairing);
    const names = (pairing.playerIds || []).map(pid => roster[pid]?.name || "?").join(" / ");
    const holeScores = mapForScoring(scores[id], idA, idB);
    const t = pairingTotals(format, holes, holeScores, phA, phB, teamPh);
    return { names, ...t };
  }).filter(r => r.thru > 0);

  rows.sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);

  const list = document.getElementById("leaderboardList");
  list.innerHTML = rows.length ? rows.map((r, i) => `
    <div class="lb-row">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-names">${esc(r.names)}<div class="lb-thru">thru ${r.thru}</div></span>
      <span class="lb-topar">${fmtToPar(r.toPar)}</span>
    </div>
  `).join("") : `<p class="empty">No scores posted yet.</p>`;
}

/* ---------- data wiring ---------- */
if (FIREBASE_CONFIGURED){
  const app = initializeApp(FIREBASE_CONFIG);
  db = getDatabase(app);
  onValue(ref(db, DB_PATH), snap => {
    cfg = snap.val() || { course: {}, roster: {}, pairings: {}, settings: {} };
    renderHome();
    if (!document.getElementById("tab-score").classList.contains("hidden")) renderScoreTab();
    if (!document.getElementById("tab-board").classList.contains("hidden")) renderLeaderboard();
  });
  onValue(ref(db, SCORES_PATH), snap => {
    scores = snap.val() || {};
    if (!document.getElementById("tab-score").classList.contains("hidden")) renderScoreTab();
    if (!document.getElementById("tab-board").classList.contains("hidden")) renderLeaderboard();
  });
} else {
  try { cfg = JSON.parse(localStorage.getItem(LS_KEY) || "null") || cfg; } catch (e) {}
  try { scores = JSON.parse(localStorage.getItem("covidcup_scores_draft") || "null") || {}; } catch (e) {}
  renderHome();
  document.getElementById("eventSub").textContent = "Event setup in progress";
}

(async () => {
  try {
    const res = await fetch(`version.txt?cb=${Date.now()}`, { cache: "no-store" });
    document.getElementById("versionFooter").textContent = "v" + (await res.text()).trim();
  } catch (e) {}
})();
</script>
</body>
</html>
