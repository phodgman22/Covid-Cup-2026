<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KHC Outing">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="site.webmanifest">
<title>Covid Cup 2026</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --surface2:#f4f6f8; --surface3:#e7ebef;
  --line:#dce2e8; --text:#0e1216; --muted:#5c6773; --dim:#8d97a3;
  --red:#c8102e; --red-dim:#fbe9ec;
  --snots:#1c4f9c; --snots-solid:#2f6fd6; --snots-tint:#e7eefb; --snots-edge:#c2d6f5;
  --ducks:#a3121f; --ducks-solid:#c8102e; --ducks-tint:#fbe9ea; --ducks-edge:#f0c3c7;
  --half:#9aa4b0;
  --shadow:0 1px 2px rgba(14,18,22,.06), 0 1px 8px rgba(14,18,22,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* The lock screen is a neutral dark navy so it doesn't lean toward either
   team's color before you've even logged in. */
.splash{
  --crest-green:#12294a; --crest-deep:#0a1830; --crest-gold:#c7d2e6; --crest-cream:#f0f3f8;
  --surface:#0a1830; --surface2:#122845; --line:#28405f;
  --text:#f0f3f8; --muted:#9fb0c9; --dim:#7288a6; --red:#c7d2e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:var(--safe-b)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.1px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:var(--surface2);border:1px solid var(--line);
  flex:none;font-size:16px;line-height:1}
.iconbtn:active{background:var(--surface3)}
.tbi{width:19px;height:19px;color:var(--muted)}
/* home | info | profile, always in that order, profile furthest right */
.tbb{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:3px 5px;border-radius:9px;background:none;border:none;min-width:38px}
.tbb:active{background:var(--surface2)}
.tbb i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:var(--dim);line-height:1}
.tbb .ava{width:27px;height:27px}
.tbb.lbl .tbi{width:27px;height:27px}
.wrap{padding:14px 14px 40px}

/* Course texture — deliberately kept off the scoring screens, where contrast
   in bright sun matters more than atmosphere. */
.turf{background-color:var(--bg);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(31,95,63,.09) 0 38%, transparent 39%),
    radial-gradient(circle at 82% 26%, rgba(31,95,63,.07) 0 32%, transparent 33%),
    radial-gradient(circle at 46% 78%, rgba(31,95,63,.08) 0 42%, transparent 43%),
    repeating-linear-gradient(115deg, rgba(31,95,63,.045) 0 22px, transparent 22px 46px);
  background-attachment:fixed}

/* ---------- lock screen ---------- */
/* TODO: replace the stripe pattern below with url("your-photo.jpg") center/cover
   no-repeat, #0a1830 once you have your own course/event background photo. */
.splash{position:fixed;inset:0;
  background:
    radial-gradient(900px 620px at 50% 18%, rgba(18,40,74,.6) 0%, rgba(10,24,48,.9) 70%),
    repeating-linear-gradient(45deg, #122845 0 18px, #0a1830 18px 36px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px;z-index:100;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;background:var(--crest-gold);border-radius:50%;opacity:.4;
  animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.55}}
.splash-inner{position:relative;z-index:2;width:100%;max-width:390px;text-align:center}
.crest{width:100%;max-width:272px;height:auto;margin:0 auto 16px;display:block}
.dates{font-size:11px;color:var(--crest-gold);letter-spacing:2.6px;text-transform:uppercase;
  font-weight:750;margin-bottom:15px}
.teamrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:15px}
.teamrow .t{font-size:12.5px;font-weight:850;letter-spacing:2.4px}
.teamrow .t.s{color:#a9c6f2} .teamrow .t.d{color:#f3a9ae}
.teamrow .vs{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:1px}
.codein{width:100%;text-align:center;font-size:26px;letter-spacing:11px;font-weight:800;
  padding:15px 10px 15px 21px;border-radius:13px;background:rgba(0,0,0,.28);
  border:1.5px solid var(--line);color:var(--crest-cream);text-transform:uppercase;outline:none}
.codein:focus{border-color:var(--crest-gold)}
.codein::placeholder{letter-spacing:9px;color:#4a5b74;font-weight:600}
.splash .btn{background:var(--crest-gold);color:#0a1830}
.splash .hint{color:var(--dim)}
.btn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--red);
  color:#fff;font-weight:750;font-size:16px;margin-top:10px;letter-spacing:.2px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow)}
.btn.ghost:active{background:var(--surface2)}
.btn.big{padding:17px;font-size:16.5px}
.hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.55}
.err{color:#ff8787;font-size:13px;margin-top:10px;font-weight:600;min-height:18px}

/* ---------- scoreboard ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.board-top{display:flex;align-items:flex-end;gap:8px}
.bteam{flex:1;text-align:center}
.bteam .nm{font-size:11px;font-weight:850;letter-spacing:2px;margin-bottom:3px}
.bteam.s .nm{color:var(--snots)} .bteam.d .nm{color:var(--ducks)}
.bteam .pts{font-size:42px;font-weight:850;line-height:.95;letter-spacing:-1.5px}
.bmid{flex:none;text-align:center;padding-bottom:11px}
.bmid .dash{font-size:15px;color:var(--dim);font-weight:800}
.clinch{text-align:center;font-size:11.5px;color:var(--dim);margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.clinch b{color:var(--muted)}
.pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:13px;background:var(--surface3)}
.pbar .s{background:var(--snots-solid)} .pbar .d{background:var(--ducks-solid)}

/* ---------- profile ---------- */
.ava{width:38px;height:38px;flex:none;display:block}
.ava.sm{width:34px;height:34px}
.ava.big{width:86px;height:86px;margin:0 auto 10px}
.ava.beermono{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-left:6px}
.mully{display:inline-flex;align-items:center;gap:5px;margin:0 8px}
.mully .beermono{width:36px;height:36px;margin-left:0}
.mystep{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--surface2);border:1px solid var(--line);
  font-weight:800;font-size:15px;line-height:1;color:var(--text)}
.mystep:active{filter:brightness(.92)}
.mystep:disabled{opacity:.4}
.avabtn{width:38px;height:38px;border-radius:50%;flex:none;padding:0;overflow:hidden;
  border:1.5px solid var(--line);background:var(--surface)}
.avabtn.s{border-color:var(--snots-edge)} .avabtn.d{border-color:var(--ducks-edge)}
.avabtn:active{filter:brightness(.95)}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:15px;
  padding:18px 14px 14px;margin-bottom:11px;text-align:center;box-shadow:var(--shadow)}
.pcard.s{border-color:var(--snots-edge);background:var(--snots-tint)}
.pcard.d{border-color:var(--ducks-edge);background:var(--ducks-tint)}
.pcard .pname{font-size:20px;font-weight:850;letter-spacing:-.3px}
.pcard .pteam{font-size:10.5px;font-weight:800;letter-spacing:2px;margin-top:3px}
.pcard.s .pteam{color:var(--snots)} .pcard.d .pteam{color:var(--ducks)}
.tierrow{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:5px 11px 5px 7px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tflag{width:24px;height:24px;flex:none;display:block}
.tiername{font-size:12px;font-weight:850;letter-spacing:.6px;text-transform:uppercase}
.tiercount{font-size:11px;font-weight:650;color:var(--dim)}
.tierrow.vet      .tiername{color:#8a6d00}
.tierrow.mainstay .tiername{color:#6e767c}
.tierrow.returner .tiername{color:#7a4a17}
.tierrow.rookie   .tiername{color:#1f6b36}
.pfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pfact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.pfact .k{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.pfact .v{font-size:17px;font-weight:850;margin-top:2px}
.cmsh{font-size:9px;font-weight:850;letter-spacing:1px;color:var(--red);
  background:var(--red-dim);padding:2px 5px;border-radius:5px;vertical-align:middle}

/* ---------- tiebreak ---------- */
.tug{background:#12301f;border:1.5px solid var(--snots-solid);border-radius:15px;
  padding:15px 14px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow)}
.tug.decided.s{border-color:var(--snots-solid)} .tug.decided.d{border-color:var(--ducks-solid)}
.tugtitle{font-size:11px;font-weight:850;letter-spacing:2.2px;text-transform:uppercase;
  color:#c9a227}
.tugsvg{width:100%;max-width:320px;margin:8px auto 4px;display:block}
.tugsub{font-size:13px;color:#a9bfae;font-weight:650}
.tugsub.small{font-size:12px;color:#7d9a88;margin-top:6px}
.tugwin{font-size:20px;font-weight:850;color:#f2e7cd;letter-spacing:.3px;margin:6px 0 10px}
.tugrow{display:flex;gap:10px;justify-content:space-between;align-items:baseline;
  border-top:1px solid #2c6144;padding:8px 2px;font-size:12.5px;text-align:left}
.tugrow span{color:#7d9a88;font-weight:700;flex:none}
.tugrow b{color:#f2e7cd;font-weight:700;text-align:right}
.tugby{font-size:11px;color:#7d9a88;margin-top:8px}
.tugform{margin-top:12px;text-align:left}
.tugform label{display:block;font-size:12px;color:#a9bfae;font-weight:650;
  margin:0 0 6px;line-height:1.5}
.tbin{width:100%;border-radius:11px;padding:11px 12px;font-size:15px;
  background:rgba(0,0,0,.3);border:1.5px solid #2c6144;color:#f2e7cd;outline:none;
  resize:none;margin-bottom:10px}
.tbin:focus{border-color:#c9a227}
.tbwin{display:flex;gap:8px;margin-bottom:4px}
.tbteam{flex:1;padding:13px 6px;border-radius:11px;font-weight:850;font-size:14px;
  letter-spacing:1.4px;border:1.5px solid}
.tbteam.s{background:var(--snots-solid);border-color:var(--snots-solid);color:#fff}
.tbteam.d{background:var(--ducks-solid);border-color:var(--ducks-solid);color:#fff}
.tbteam:active{filter:brightness(.88)}
.tug .btn{margin-top:4px}
.tugL{animation:tugl 2.4s ease-in-out infinite alternate}
.tugR{animation:tugr 2.4s ease-in-out infinite alternate}
.tugrope{animation:tugc 2.4s ease-in-out infinite alternate}
@keyframes tugl{from{transform:translateX(-7px)}to{transform:translateX(5px)}}
@keyframes tugr{from{transform:translateX(7px)}to{transform:translateX(-5px)}}
@keyframes tugc{from{transform:translateX(-2px)}to{transform:translateX(2px)}}

.series{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:11px 14px;margin-bottom:11px;box-shadow:var(--shadow);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.series .sl{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-weight:650}
.series .sl b{color:var(--text);font-size:15px;font-weight:850;margin-left:3px}
.series .sy{display:flex;gap:5px}
.series .sy span{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;
  letter-spacing:.3px}
.series .sy .s{background:var(--snots-tint);color:var(--snots)}
.series .sy .d{background:var(--ducks-tint);color:var(--ducks)}
.series .sy .now{outline:1.5px solid var(--red);outline-offset:1px}

/* ---------- round briefing ---------- */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.brief .bt{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--dim);
  text-transform:uppercase;margin-bottom:6px}
.brief .bd{font-size:12.5px;color:var(--muted);line-height:1.55}
.brief .bd b{color:var(--text)}
.brief ul{margin:8px 0 0;padding:0;list-style:none}
.brief li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);line-height:1.45}
.brief li .who{font-weight:750}
.brief li .who.s{color:var(--snots)} .brief li .who.d{color:var(--ducks)}
.brief li .hl{color:var(--muted)}
.brief .none{color:var(--dim)}

/* ---------- match briefing screen + its collapsed twin ---------- */
.vsbox{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:14px 12px;margin-bottom:10px;
  box-shadow:var(--shadow)}
.vsside{flex:1;font-size:13.5px;font-weight:750;line-height:1.35;text-align:center}
.vsside.s{color:var(--snots)} .vsside.d{color:var(--ducks)}
.vsmid{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--dim);
  border:1px solid var(--line);border-radius:20px;padding:4px 8px}
/* The collapsed header inside scoring: says what round you're on, opens the brief. */
.roundbar{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.roundbar .rbn{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.roundbar .rbt{flex:1;font-size:13px;font-weight:750;color:var(--text)}
.roundbar .rbc{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;color:var(--red)}
.roundbar .rbc i{font-style:normal;font-size:13px;transition:transform .18s}
.roundbar.open{border-radius:11px 11px 0 0;margin-bottom:0;border-bottom-color:transparent}
.roundbar.open .rbc i{transform:rotate(180deg)}
.briefdrop{border-radius:0 0 13px 13px;border-top:none;margin-bottom:11px}
/* Hand the card to a named player — one tap, no typing, works for everyone in the group. */
.handoff{margin-top:11px;border-top:1px solid var(--line);padding-top:11px}
.handoff .hoh{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--dim);
  text-transform:uppercase;margin-bottom:8px}
.honame{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--text)}
.honame.s{border-left:3px solid var(--snots)} .honame.d{border-left:3px solid var(--ducks)}
.honame span{flex:1}
.honame em{font-style:normal;font-size:11px;font-weight:700;color:var(--dim);
  letter-spacing:.4px;text-transform:uppercase}

/* ---------- pre-match taunt ----------
   Plays once per match, on the way in. Always pro-Kraft by design. Tap to skip.
   Pure CSS on inline SVG: nothing downloaded, nothing that can fail on course. */
.taunt{position:fixed;inset:0;z-index:95;background:radial-gradient(700px 500px at 50% 45%,#1a5638,#0b2a1c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:tfade .25s ease-out;cursor:pointer}
.taunt.out{animation:tout .32s ease-in forwards}
@keyframes tfade{from{opacity:0}to{opacity:1}}
@keyframes tout{to{opacity:0}}
.taunt svg{width:min(88vw,380px);height:auto;overflow:visible}
.taunt img{width:min(72vw,300px);height:auto;border-radius:16px;
  box-shadow:0 14px 44px rgba(0,0,0,.5);display:block}
.taunt .tline{color:#f2e7cd;font-size:15px;font-weight:800;letter-spacing:2.4px;
  text-transform:uppercase;margin-top:20px;opacity:0;animation:tin .4s ease-out 1.25s forwards;
  text-align:center;padding:0 20px;line-height:1.5}
.taunt .tsub{color:#c9a227;font-size:11.5px;font-weight:750;letter-spacing:1.6px;
  text-transform:uppercase;margin-top:8px;opacity:0;animation:tin .4s ease-out 1.5s forwards;
  text-align:center;padding:0 24px;line-height:1.6}
/* which match a relayed scene came from — quieter than the scene's own caption */
.taunt .tsub .tfrom{display:block;margin-top:5px;color:#7d9a88;font-size:10.5px;
  letter-spacing:1.1px;font-weight:650}
.taunt .tskip{position:absolute;bottom:calc(26px + var(--safe-b));color:#7d9a88;
  font-size:11.5px;font-weight:650;letter-spacing:.6px}
@keyframes tin{to{opacity:1}}
/* Win-only banner, slapped across the artwork itself rather than tucked in
   the caption below it. Outlined so it stays legible over any of the six
   scenes it can land on. */
.taunt .tstamp{position:absolute;top:26%;left:50%;z-index:6;pointer-events:none;
  width:100%;text-align:center;font-size:min(11.5vw,54px);font-weight:900;
  letter-spacing:.5px;text-transform:uppercase;color:#fff;
  text-shadow:-2px -2px 0 #0b2a1c,2px -2px 0 #0b2a1c,-2px 2px 0 #0b2a1c,
    2px 2px 0 #0b2a1c,0 8px 22px rgba(0,0,0,.5);
  opacity:0;animation:tstampin .4s cubic-bezier(.2,1.5,.4,1) .1s forwards,
    tstamppulse 1s ease-in-out .6s infinite alternate}
@keyframes tstampin{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(2.2)}
  100%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}}
@keyframes tstamppulse{from{opacity:1}to{opacity:.8}}
/* SVG elements default to transform-box:view-box with transform-origin 0 0, so
   any rotate() or scale() pivots on the top-left of the whole picture and flings
   the shape off screen. Everything that rotates or scales names its own pivot. */
/* Ball flies in, loops once around the duck's head, then hits home — a
   straight-line approach read as "thrown at" rather than "hit and flew off",
   which is what the loop is there to sell. Impact-linked pieces (duck flinch,
   flash ring, feathers, stars) all shift together with the longer flight. */
.tball{transform-origin:196px 96px;animation:tfly 1.35s cubic-bezier(.4,.1,.4,1) forwards}
@keyframes tfly{
  0%{transform:translate(-320px,-90px) rotate(0deg)}
  34%{transform:translate(70px,-6px) rotate(240deg)}
  50%{transform:translate(18px,-72px) rotate(430deg)}
  66%{transform:translate(-68px,-4px) rotate(600deg)}
  80%{transform:translate(-18px,42px) rotate(760deg)}
  100%{transform:translate(0,0) rotate(940deg)}}
.tduck{transform-origin:205px 175px;animation:thit .55s ease-out 1.32s both}
@keyframes thit{0%{transform:translate(0,0) rotate(0)}
  35%{transform:translate(26px,-14px) rotate(16deg)}
  100%{transform:translate(18px,4px) rotate(9deg)}}
.tfeather{transform-origin:196px 96px;opacity:0;animation:tpuff .9s ease-out 1.35s forwards}
@keyframes tpuff{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}
  100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(1)}}
.tstar{opacity:0;animation:tstar 1.5s ease-out 1.38s forwards;transform-origin:center}
@keyframes tstar{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.1)}}
.timpact{transform-origin:196px 96px;opacity:0;animation:timp .38s ease-out 1.32s forwards}
@keyframes timp{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.9)}}

/* ---------- shared scene animations ---------- */
.rstar{animation:rtw 1.6s ease-in-out infinite alternate}
@keyframes rtw{from{opacity:.25}to{opacity:1}}
.rrocket{animation:rlift 2.6s cubic-bezier(.5,0,.85,.4) .5s forwards}
@keyframes rlift{0%{transform:translateY(0)}18%{transform:translateY(6px)}
  100%{transform:translateY(-300px)}}
.rflame{transform-origin:200px 164px;animation:rfl .12s ease-in-out infinite alternate,
  rlift 2.6s cubic-bezier(.5,0,.85,.4) .5s forwards}
@keyframes rfl{from{transform:scaleY(.75)}to{transform:scaleY(1.25)}}
/* Heinz strapped to the fuselage tumble in place as the rocket climbs — the
   spin lives on this inner group so it doesn't fight the outer translate/scale
   that positions each duck on the hull. */
.rduck{transform-origin:0 0;animation:rduckspin 1s linear infinite}
@keyframes rduckspin{to{transform:rotate(360deg)}}
.dbolt{animation:dbz .5s ease-in-out infinite alternate}
@keyframes dbz{from{opacity:.2;transform:translateX(-4px)}to{opacity:.95;transform:translateX(4px)}}
.dchoke{transform-origin:300px 110px;animation:dch 1.4s ease-in-out infinite alternate}
@keyframes dch{from{transform:translateY(0) rotate(0)}to{transform:translateY(-12px) rotate(4deg)}}
/* Mars campfire: flames flicker continuously, the duck rocks gently on the
   spit as though slowly turning. */
.mrsflame{transform-origin:0 0;animation:mrsflick .15s ease-in-out infinite alternate}
@keyframes mrsflick{from{transform:scaleY(.85)}to{transform:scaleY(1.15)}}
.mrsduck{transform-origin:0 0;animation:mrsroast 1.6s ease-in-out infinite alternate}
@keyframes mrsroast{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* Lunar rover drives in from off-screen and PAST where the ducks are standing
   — the front wheel's final resting spot lands right on top of them, so even
   a single freeze-frame reads as "ran them over," not just "arrived nearby."
   Wheels spin the whole time it's rolling. */
.rvrover{animation:rvdrive 1.15s cubic-bezier(.3,.4,.2,1) forwards}
@keyframes rvdrive{0%{transform:translateX(-260px)}100%{transform:translateX(80px)}}
.rvwheel{transform-origin:0 0;animation:rduckspin .5s linear infinite}
/* Heinz stand there crossing, visible the whole approach, then get knocked
   clear — up and back over the roofline — right as the front wheel reaches
   them, so they're never just swallowed silently under the chassis. */
.rvduck{transform-origin:0 0;animation:rvscatter .5s ease-out .96s both}
@keyframes rvscatter{0%{transform:translate(0,0) rotate(0)}
  100%{transform:translate(55px,-55px) rotate(240deg)}}
.rvdust{opacity:0;animation:rvpuff .55s ease-out .65s forwards}
@keyframes rvpuff{0%{opacity:.7;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
.tkball{transform-origin:150px 152px;animation:tkroll 1s cubic-bezier(.4,0,.9,.6) .2s both}
@keyframes tkroll{0%{transform:translateX(-180px) rotate(0)}100%{transform:translateX(56px) rotate(540deg)}}
.tkastro{transform-origin:57px 160px;animation:tkth .6s ease-out both}
@keyframes tkth{0%{transform:rotate(16deg)}100%{transform:rotate(0)}}
.tkpin{transform-origin:0 176px;animation:tkfall .5s cubic-bezier(.4,0,.8,1) both}
@keyframes tkfall{0%{transform:rotate(0)}100%{transform:rotate(74deg) translateY(6px)}}
.bdbird{transform-origin:200px 110px;animation:bdfly 1.1s ease-out both, bdhov 2.2s ease-in-out 1.1s infinite alternate}
@keyframes bdfly{0%{transform:translateY(150px) scale(.5);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes bdhov{from{transform:translateY(0)}to{transform:translateY(-12px)}}
/* Alert beacon: two rings pulsing outward on a stagger, like a real siren. */
.bapulse,.bapulse2{transform-origin:0 0;opacity:0;animation:bapulse 1.1s ease-out infinite}
.bapulse2{animation-delay:.5s}
@keyframes bapulse{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.7)}}
.vtrophy{transform-origin:200px 56px;animation:vtr 1.8s ease-in-out infinite alternate}
@keyframes vtr{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-8px) rotate(3deg)}}
.vtear{animation:vtd 1.5s ease-in infinite}
@keyframes vtd{0%{opacity:0;transform:translateY(0)}20%{opacity:1}
  100%{opacity:0;transform:translateY(26px)}}
/* Four in a row: the hambone held aloft, with a little triumphant bounce. */
.hbbone{transform-origin:0 0;animation:hbraise .5s cubic-bezier(.2,1.4,.4,1) both,
  hbbob 1.4s ease-in-out .5s infinite alternate}
@keyframes hbraise{0%{transform:translateY(40px) rotate(10deg);opacity:0}
  100%{transform:translateY(0) rotate(-15deg);opacity:1}}
@keyframes hbbob{from{transform:translateY(0) rotate(-15deg)}to{transform:translateY(-8px) rotate(-10deg)}}
/* Five in a row: same falling-tear treatment as the victory scene's sad
   ducks, just given the whole stage this time. */
.sdtear{animation:vtd 1.5s ease-in infinite}
/* Heinz win: one pull of the lever, then it settles on triple sevens. */
.dwlever{transform-origin:62px 20px;animation:dwpull 1.2s ease-in-out .3s both}
@keyframes dwpull{0%{transform:rotate(0)}40%{transform:rotate(38deg)}100%{transform:rotate(0)}}

/* Clinching fireworks: each burst pops out and fades, staggered so they
   don't all go off in the same instant. */
.fwburst{opacity:0;animation:fwpop 1.1s ease-out var(--fwd,0s) both}
@keyframes fwpop{0%{transform:scale(.2);opacity:0}30%{opacity:1}100%{transform:scale(1.5);opacity:0}}

/* ---------- Kraft win: duck hunt ---------- */
.wsky{animation:tfade .3s ease-out}
.wgrass{animation:wrise .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes wrise{from{transform:translateY(70px)}to{transform:translateY(0)}}
.wastro{animation:wpop .55s cubic-bezier(.2,.9,.3,1.3) .45s both}
@keyframes wpop{from{transform:translateY(90px)}to{transform:translateY(0)}}
.wduck{transform-origin:center}
.wduck.a{animation:wfly1 2.5s ease-in .25s both}
.wduck.b{animation:wfly2 2.5s ease-in .55s both}
@keyframes wfly1{
  0%{transform:translate(-230px,26px) rotate(-6deg)}
  44%{transform:translate(6px,-12px) rotate(4deg)}
  52%{transform:translate(16px,-6px) rotate(24deg)}
  100%{transform:translate(46px,250px) rotate(230deg);opacity:.85}}
@keyframes wfly2{
  0%{transform:translate(-260px,-34px) rotate(-4deg)}
  44%{transform:translate(-24px,-58px) rotate(6deg)}
  52%{transform:translate(-14px,-50px) rotate(-22deg)}
  100%{transform:translate(-58px,250px) rotate(-210deg);opacity:.85}}
.wwing{transform-origin:22px 8px;animation:wflap .26s ease-in-out infinite alternate}
@keyframes wflap{from{transform:rotate(-26deg)}to{transform:rotate(24deg)}}
.wflash{opacity:0;animation:wbang .3s ease-out 1.32s}
.wflash.two{animation-delay:1.62s}
@keyframes wbang{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.wpuff{opacity:0;animation:wbang .5s ease-out 1.35s}
.wpuff.two{animation-delay:1.65s}

/* ---------- side contest flash ---------- */
.flashwrap{position:fixed;inset:0;z-index:92;display:flex;align-items:center;
  justify-content:center;background:rgba(11,42,28,.9);animation:tfade .2s ease-out;padding:24px}
.flashwrap.out{animation:tout .3s ease-in forwards}
.flashin{text-align:center;max-width:340px;animation:fpop .45s cubic-bezier(.2,.9,.3,1.25)}
@keyframes fpop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.flashin .fkick{font-size:11.5px;font-weight:800;letter-spacing:3px;color:#c9a227;
  text-transform:uppercase}
.flashin .fbig{font-size:34px;font-weight:850;color:#f2e7cd;letter-spacing:-.5px;
  line-height:1.05;margin:8px 0 6px}
.flashin .fhole{font-size:15px;font-weight:750;color:#a9bfae}
.flashin svg{width:98px;height:98px;margin:0 auto 10px;display:block}
.flashin .ftap{font-size:11.5px;color:#7d9a88;margin-top:18px;font-weight:650}

/* ---------- dormie banner: full-screen, sticks until dismissed ---------- */
.dormiewrap{position:fixed;inset:0;z-index:95;display:flex;align-items:center;
  justify-content:center;padding:28px;animation:tfade .25s ease-out}
.dormiewrap.out{animation:tout .3s ease-in forwards}
.dormiewrap.s{background:radial-gradient(circle at 50% 35%,#12294a,#050d1a 72%)}
.dormiewrap.d{background:radial-gradient(circle at 50% 35%,#3a0f14,#140506 72%)}
.dormiein{text-align:center;max-width:400px;animation:fpop .5s cubic-bezier(.2,.9,.3,1.25)}
.dormiefig{margin:0 auto 14px}
.dormiefig svg{width:110px;height:auto;margin:0 auto;display:block}
.dormiehd{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.dormiehd svg{width:34px;height:34px;flex:none;display:block}
.dormietitle{font-size:15px;font-weight:850;letter-spacing:3px;text-transform:uppercase}
.dormiewrap.s .dormietitle{color:#8fb5f0}
.dormiewrap.d .dormietitle{color:#f3a9ae}
.dormieline{font-size:28px;font-weight:850;color:#fff;line-height:1.3}
.dormiebtn{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom,0px));
  z-index:96;background:var(--red);color:#fff;font-weight:800;font-size:15px;
  padding:16px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dormiebtn:active{filter:brightness(.9)}

/* ---------- profile popup: someone else's card, over your own page ---------- */
.ppopwrap{position:fixed;inset:0;z-index:90;display:flex;align-items:center;
  justify-content:center;background:rgba(11,42,28,.55);padding:24px;animation:tfade .2s ease-out}
.ppopwrap.out{animation:tout .25s ease-in forwards}
.ppopin{position:relative;width:100%;max-width:360px;animation:fpop .35s cubic-bezier(.2,.9,.3,1.25)}
.ppopin .pcard{margin-bottom:0}
.ppopclose{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;
  color:var(--text);z-index:1}
.ppopclose:active{filter:brightness(.95)}

/* ---------- toast ---------- */
/* Mid-screen, not tucked at the bottom — this is the confirmation a scorer
   actually needs to see before moving on. */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:90;max-width:min(420px,calc(100% - 36px));width:max-content;
  background:#0e1216;color:#fff;border-radius:16px;padding:18px 22px;
  font-size:16px;font-weight:700;line-height:1.45;
  box-shadow:0 14px 44px rgba(0,0,0,.42);text-align:center;animation:tup .22s ease-out}
@keyframes tup{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.toast b{font-weight:850}
.toast .win.s{color:#8fb5f0} .toast .win.d{color:#f3a9ae}

/* ---------- cards ---------- */
.sect{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--dim);
  text-transform:uppercase;margin:22px 0 9px}
.sect:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;display:block;width:100%;text-align:left;
  box-shadow:var(--shadow)}
.card:active{background:var(--surface2)}
.card.flat{background:var(--surface2);box-shadow:none}
.card.me{border-color:var(--red);border-width:1.5px}
.rowline{display:flex;align-items:center;gap:11px}
.rnum{width:33px;height:33px;border-radius:9px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--muted)}
.rnum.done{background:var(--red-dim);border-color:#f2ccd3;color:var(--red)}
.rmeta{flex:1;min-width:0}
.rmeta .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rright{flex:none;text-align:right}
.rright .big{font-weight:800;font-size:15px}
.rright .small{font-size:11px;color:var(--dim);margin-top:2px}
.chev{color:var(--dim);font-size:19px;flex:none;margin-left:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.badge.live{background:var(--red);color:#fff}
.badge.fin{background:var(--surface3);color:var(--muted)}
.badge.soon{background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.badge.s{background:var(--snots-tint);color:var(--snots)}
.badge.d{background:var(--ducks-tint);color:var(--ducks)}
.badge.h{background:var(--surface3);color:var(--muted)}

/* ---------- hole entry ---------- */
.holehead{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.holenav{display:flex;align-items:center;gap:12px}
.navbtn{width:42px;height:42px;border-radius:11px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:700}
.navbtn:active{background:var(--surface3)}
.navbtn:disabled{opacity:.32}
.holeinfo{flex:1;text-align:center}
.holeinfo .hn{font-size:23px;font-weight:850;line-height:1;letter-spacing:-.5px}
.holeinfo .hd{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.strip{display:flex;gap:3px;margin-top:10px}
.strip button{flex:1;height:27px;border-radius:5px;background:var(--surface2);
  border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--dim);
  display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.strip button.cur{outline:2px solid var(--text);outline-offset:-1px;color:var(--text)}
.strip button.lock{opacity:.34}
.strip button.sp{position:relative}
.strip button .spdot{position:absolute;top:1px;right:1px;width:5px;height:5px;
  border-radius:50%;background:var(--red)}
.spbadge{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:7px;
  font-size:10px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase;
  background:var(--red);color:#fff}
.gate{background:#fff6e5;border:1px solid #f0d9a8;color:#7a5600;border-radius:11px;
  padding:10px 13px;margin-top:9px;font-size:12.5px;font-weight:650;text-align:center}
.gate b{color:#5c4100}
.gate.off{display:none}   /* always in the DOM so patch() can toggle it live */
.strip button.w{background:var(--snots-solid);border-color:var(--snots-solid);color:#fff}
.strip button.l{background:var(--ducks-solid);border-color:var(--ducks-solid);color:#fff}
.strip button.h{background:var(--half);border-color:var(--half);color:#fff}

.sidebox{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.sidehdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  font-size:11px;font-weight:850;letter-spacing:2px;border-bottom:1px solid var(--line)}
.sidebox.s .sidehdr{color:var(--snots);background:var(--snots-tint)}
.sidebox.d .sidehdr{color:var(--ducks);background:var(--ducks-tint)}
.sidehdr .net{letter-spacing:.3px;font-weight:700;font-size:12px;color:var(--muted);text-transform:none}
.prow{padding:8px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow.best{background:var(--surface2)}
.pname{font-size:13.5px;font-weight:700;line-height:1.2}
.pname .hc{color:var(--dim);font-weight:600;font-size:10.5px;margin-left:5px}
.pname .ball{color:var(--red);font-weight:800;font-size:9.5px;letter-spacing:.6px;
  text-transform:uppercase;margin-left:5px}
.entry{display:flex;align-items:center;gap:9px;margin-top:5px;flex-wrap:wrap}
.entry .lab{font-size:11.5px;color:var(--muted);font-weight:650;flex:none}
.gswrap{position:relative;flex:none}
.gsin{width:54px;height:44px;text-align:center;font-size:20px;font-weight:800;
  background:var(--surface2);border:1.5px solid transparent;border-radius:11px;
  color:var(--text);outline:none;padding:0;-moz-appearance:textfield}
.gsin::-webkit-outer-spin-button,.gsin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gsin:focus{background:#fff;border-color:var(--text)!important;border-radius:11px!important;
  box-shadow:0 0 0 3px rgba(14,18,22,.09)!important}
.gsin.blank{border:1.5px dashed var(--line);background:transparent}
/* Sits outside the score box so it stays visible on top of a circled birdie. */
.gsdots{position:absolute;top:-3px;right:-3px;display:flex;flex-wrap:wrap;gap:2px;
  max-width:16px;justify-content:flex-end;pointer-events:none}
.gsdots .dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 2px var(--surface)}
.gsdots .dot.c2{background:#c9a227}
.dotlegend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;
  color:var(--muted);font-weight:650;margin:-2px 0 10px}
.dotlegend .dot{width:7px;height:7px;border-radius:50%;background:var(--red);
  flex:none;margin-left:9px}
.dotlegend .dot:first-child{margin-left:0}
.dotlegend .dot.c2{background:#c9a227}
.entry .out{flex:1;text-align:right;font-size:11px;color:var(--dim);font-weight:650}
.entry .out b{display:block;font-size:17px;color:var(--text);font-weight:800;line-height:1.15}
/* Two clearly-labelled actions. Previously an unlabelled X and a ↺ arrow, which
   read as if the X was the clear button. */
.entry .acts{display:flex;gap:6px;flex:none}
.entry .act{width:54px;padding:5px 2px;border-radius:9px;background:var(--surface2);
  border:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.1}
.entry .act b{font-size:11.5px;font-weight:850}
.entry .act i{font-size:8.5px;font-style:normal;font-weight:750;letter-spacing:.2px;
  text-transform:uppercase;margin-top:1px}
.entry .act:disabled{opacity:.32}
.entry .act.pick.on{background:var(--red);border-color:var(--red);color:#fff}
.gsin.picked{background:var(--red-dim);border:1.5px solid var(--red)!important;
  color:var(--red);border-radius:11px!important}

/* prev / save / next bar under the score boxes */
.holebar{display:flex;gap:7px;margin-top:12px}
.holebar button{border-radius:12px;padding:13px 6px;font-weight:750;font-size:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.holebar button:disabled{opacity:.34}
.holebar .side{flex:none;width:84px;color:var(--muted);font-size:11px;white-space:nowrap}
.holebar .go{flex:1;background:var(--red);border-color:var(--red);color:#fff;font-size:14px}
.holebar .go:active{filter:brightness(.9)}
.holebar .go.fin{background:var(--text);border-color:var(--text)}
.savedtag{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}

/* under par = red + circles.  par = plain black.  over par = black + boxes. */
.u{color:var(--red)!important}
.c1,.c2,.c3{border:1.5px solid currentColor!important;border-radius:50%!important}
.b1,.b2,.b3{border:1.5px solid currentColor!important;border-radius:4px!important}
.c2,.b2{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor}
.c3,.b3{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor,
        0 0 0 4.6px var(--surface),0 0 0 6px currentColor}
.mk{display:inline-flex;align-items:center;justify-content:center;
  min-width:21px;height:21px;line-height:1;font-weight:750}
.mk.picked{color:var(--red);font-weight:850}
table.gc td.tap,table.gc th.tap{cursor:pointer}
table.gc td.tap:active,table.gc th.tap:active{background:var(--surface3)}
table.gc .hrange{font-weight:600;color:var(--dim);font-size:9.5px;letter-spacing:0}

.resbar{border-radius:13px;padding:11px;text-align:center;margin-bottom:9px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.resbar .r1{font-size:11.5px;color:var(--muted);font-weight:650}
.resbar .r2{font-size:19px;font-weight:850;margin-top:3px;letter-spacing:-.3px}
.resbar.s{background:var(--snots-tint);border-color:var(--snots-edge)}
.resbar.d{background:var(--ducks-tint);border-color:var(--ducks-edge)}
.resbar.halved{background:var(--surface3);border-color:var(--line)}
.resbar.s .r2{color:var(--snots)} .resbar.d .r2{color:var(--ducks)}
.resbar.halved .r2{color:var(--muted)}
/* Hole-won announcements flash right over the match bar, not mid-screen —
   the old centre-screen banner covered the scorecard the scorer was using.
   Two at once (two singles matches in a group, or a quick correction) stack
   downward in the same spot rather than covering each other. */
.resbarwrap{position:relative;margin-bottom:9px}
.resbarwrap .resbar{margin-bottom:0}
.vflashstack{position:absolute;left:0;right:0;top:0;min-height:100%;z-index:8;
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
.vflash{flex:1 0 auto;border-radius:13px;
