<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Covid Cup 2026</title>
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1830; --surface:#0f2038; --surface2:#122845; --surface3:#173058;
  --line:#28405f; --text:#f0f3f8; --muted:#9fb0c9; --dim:#7288a6;
  --accent:#c7a34d; --accent-dim:#3a3320; --danger:#c8102e; --ok:#3fae6b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:40px;}
h1{font-size:19px;margin:0;}
h2{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
p{color:var(--muted);font-size:14px;margin:0 0 12px;}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg);}
header .sub{font-size:12px;color:var(--dim);margin-top:3px;}
nav.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
nav.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:12px 4px;font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
main{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.empty{color:var(--dim);font-size:14px;}
select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:12px;}
button.primary{background:var(--accent);border:1px solid var(--accent);color:#241d08;font-weight:600;
  border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;}
button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 4px;}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted);}
.pairing{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.pairing:last-child{border-bottom:none;}
.pairing .when{color:var(--dim);font-size:12px;}

.seg{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{flex:1;background:var(--surface2);border:none;color:var(--dim);padding:9px 4px;font-size:13px;cursor:pointer;}
.seg button.active{background:var(--surface3);color:var(--accent);}

/* hole strip */
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;}
.strip button{flex:0 0 34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--dim);font-size:13px;cursor:pointer;padding:0;}
.strip button.done{color:var(--text);border-color:var(--accent-dim);background:var(--accent-dim);}
.strip button.current{border-color:var(--accent);color:var(--accent);font-weight:700;}

/* one hole */
.hole-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;}
.hole-head .num{font-size:30px;font-weight:700;line-height:1;}
.hole-head .meta{font-size:13px;color:var(--muted);}
.entry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.entry:last-of-type{border-bottom:none;}
.entry .who{flex:1;font-size:15px;}
.entry .who .shots{display:block;font-size:11px;color:var(--dim);}
.big-box{position:relative;}
.big-box input{width:64px;height:56px;text-align:center;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:24px;padding:0;}
.big-box input:focus{outline:2px solid var(--accent);}
.big-box input.picked{color:var(--dim);}
.dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);}
.dot.two{box-shadow:-10px 0 0 var(--danger);}
.entry .acts{display:flex;flex-direction:column;gap:4px;}
.acts button{font-size:11px;color:var(--dim);background:var(--surface3);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px;cursor:pointer;}
.acts button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.nav-holes{display:flex;gap:10px;margin-top:16px;}
.nav-holes button{flex:1;padding:12px;background:var(--surface3);border:1px solid var(--line);
  color:var(--text);border-radius:8px;font-size:14px;cursor:pointer;}
.nav-holes button:disabled{opacity:.35;cursor:default;}
.nav-holes button.primary{background:var(--accent);border-color:var(--accent);color:#241d08;font-weight:600;}

/* The scorecard sits on eggshell stock, like the Michigan app, so scores read clearly
   outdoors. Redefining the palette on the card flips everything inside it at once. */
#tab-score .card{
  --surface:#fbf8f1; --surface2:#ffffff; --surface3:#f1ece0; --line:#d9d1bf;
  --text:#1c2330; --muted:#556070; --dim:#7b8390; --accent:#8d6b1d; --accent-dim:#f1e5c2;
  background:var(--surface); color:var(--text); border-color:#e3dac6;
  box-shadow:0 10px 24px rgba(0,0,0,.28);
}
#tab-score .nav-holes button.primary{background:#1c2330;border-color:#1c2330;color:#fff;}
#tab-score .nav-holes button:disabled{opacity:.3;}
.strip button{position:relative;}
.strip button.locked{opacity:.35;cursor:not-allowed;}
.strip button.ctp::after,.strip button.ld::after{content:"";position:absolute;top:3px;right:3px;
  width:6px;height:6px;border-radius:50%;}
.strip button.ctp::after{background:#c0272d;}
.strip button.ld::after{background:#2e6a3b;}
.strip button.ctp.ld::after{background:linear-gradient(90deg,#c0272d 50%,#2e6a3b 50%);}
.contest{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px;margin:6px 6px 2px 0;color:#fff;}
.contest.ctp{background:#c0272d;}
.contest.ld{background:#2e6a3b;}
.contest.mini{font-size:9px;padding:1px 5px;margin:0 1px;}
.gate-hint{font-size:12px;color:#9a3b1f;margin:12px 0 0;}
.team-head{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:14px 0 0;}
.card-totals{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
.tt-name{font-weight:700;color:var(--text);min-width:130px;}
table.scard tr.unit td{background:var(--surface3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;}
.next-contest{font-size:12px;color:var(--muted);margin:10px 0 0;}

/* full card */
.card-scroll{overflow-x:auto;}
table.scard{border-collapse:collapse;font-size:12px;white-space:nowrap;}
table.scard th,table.scard td{border:1px solid var(--line);padding:4px 6px;text-align:center;min-width:30px;}
table.scard th.name,table.scard td.name{text-align:left;position:sticky;left:0;background:var(--surface);
  min-width:96px;max-width:96px;overflow:hidden;text-overflow:ellipsis;}
table.scard tr.meta td,table.scard tr.meta th{color:var(--dim);font-weight:400;}
table.scard td.tot{background:var(--surface2);font-weight:700;}
/* standard scorecard notation, drawn rather than coloured in */
.mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;}
.mark.birdie{border:1px solid var(--danger);border-radius:50%;color:var(--danger);}
.mark.eagle{border:1px solid var(--danger);border-radius:50%;color:var(--danger);
  box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--danger);}
.mark.bogey{border:1px solid var(--text);}
.mark.double{border:1px solid var(--text);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--text);}

/* statistics */
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.hl{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.hl .cap{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;}
.hl .who{font-size:15px;margin-top:3px;}
.hl .val{font-size:20px;font-weight:700;color:var(--accent);}
table.statgrid{border-collapse:collapse;font-size:13px;width:100%;white-space:nowrap;}
table.statgrid th,table.statgrid td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;}
table.statgrid th{color:var(--dim);font-weight:500;font-size:11px;}
table.statgrid th.name,table.statgrid td.name{text-align:left;}
table.statgrid td.rank{color:var(--dim);width:22px;}
table.statgrid td.lead{font-weight:700;color:var(--accent);}

/* Clubhouse leaderboard — a deliberate single look (hand-lettered board on cream stock),
   so it does not follow the app's dark theme. */
.board{background:#f4ecd8;color:#161616;border-radius:4px;padding:16px 10px 18px;
  background-image:radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%);
  box-shadow:inset 0 0 0 1px #d9cca8, 0 12px 28px rgba(0,0,0,.35);}
.board-title{font-family:"Pirata One",Georgia,"Times New Roman",serif;color:#1f3a78;font-size:36px;line-height:1;
  display:flex;align-items:center;gap:12px;letter-spacing:.05em;white-space:nowrap;}
.board-title::before,.board-title::after{content:"";flex:1;height:2px;background:#161616;opacity:.5;}
.board-sub{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;color:#3f6149;text-align:center;font-size:14px;margin:6px 0 12px;}
.board-scroll{overflow-x:auto;}
.board-empty{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;color:#3f6149;text-align:center;font-size:18px;margin:18px 0 6px;}
table.lboard{width:100%;border-collapse:collapse;}
table.lboard th,table.lboard td{border:1px solid #a9bba9;text-align:center;padding:3px 5px;vertical-align:middle;}
table.lboard tr.parrow th{border-top:none;border-left:none;border-right:none;
  font-family:"Kalam","Segoe Print","Bradley Hand",cursive;font-weight:700;color:#2e6a3b;font-size:17px;}
table.lboard tr.parrow th.nm{text-align:right;font-family:Georgia,"Times New Roman",serif;font-size:11px;
  color:#161616;letter-spacing:.12em;text-transform:uppercase;}
table.lboard tr.head th{font-family:Georgia,"Times New Roman",serif;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#161616;background:rgba(46,106,59,.07);}
table.lboard th.nm,table.lboard td.nm{text-align:left;}
table.lboard td.nm{padding:6px 10px 3px;}
.lb-big{font-family:"Pirata One",Georgia,"Times New Roman",serif;font-size:25px;line-height:1;
  text-transform:uppercase;letter-spacing:.02em;color:#161616;}
.lb-big .sn{white-space:nowrap;}
.lb-big .cap{color:#2e6a3b;font-size:1.5em;}
.lb-small{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;font-size:12px;color:#4a6b55;text-align:right;line-height:1.1;}
table.lboard td.num{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;font-weight:700;font-size:23px;line-height:1;min-width:44px;}
table.lboard td.num.under{color:#c0272d;}
table.lboard td.num.over{color:#2e6a3b;}
table.lboard td.num.even{color:#161616;}
table.lboard td.num.dash{color:#9aa99b;font-weight:400;}
table.lboard td.tot{font-size:30px;min-width:56px;}
table.lboard td.pos{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;font-size:17px;width:36px;}
table.lboard td.thru{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;font-size:16px;color:#4a6b55;width:40px;}
@media (max-width:480px){
  .board-title{font-size:27px;gap:8px;}
  .lb-big{font-size:18px;}
  table.lboard td.nm{padding:5px 6px 2px;}
  table.lboard td.num{font-size:19px;min-width:34px;}
  table.lboard td.tot{font-size:24px;min-width:42px;}
}

#loginGate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
#loginGate .box{width:300px;text-align:center;}
#loginGate input{width:100%;text-align:center;letter-spacing:.4em;font-size:22px;text-transform:uppercase;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;margin-bottom:12px;}
.hidden{display:none !important;}
footer{text-align:center;color:var(--dim);font-size:11px;padding:16px;}
</style>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h1>Covid Cup 2026</h1>
    <p style="margin-top:6px;">Enter your player code</p>
    <input id="codeInput" placeholder="CODE" autocomplete="off" maxlength="8">
    <button class="primary" id="codeSubmit" style="width:100%">Enter</button>
    <p id="codeError" style="color:var(--danger);display:none;margin-top:10px;">Code not recognised</p>
    <p id="codeWait" style="margin-top:14px;font-size:12px;">Loading event&hellip;</p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <h1 id="eventName">Covid Cup 2026</h1>
  <div class="sub" id="eventSub">Loading event details&hellip;</div>
</header>

<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="score">Scorecard</button>
  <button data-tab="board">Leaderboard</button>
  <button data-tab="stats">Stats</button>
</nav>

<main>
  <section id="tab-home">
    <div class="card">
      <h2>Rounds</h2>
      <div id="roundsInfo"><p class="empty">Not set up yet.</p></div>
    </div>
    <div class="card">
      <h2>Tee times</h2>
      <select id="homeRoundSelect"></select>
      <div id="groupsList"><p class="empty">No groups posted yet.</p></div>
    </div>
  </section>

  <section id="tab-score" class="hidden">
    <div class="card">
      <select id="scoreRoundSelect"></select>
      <select id="scoreGroupSelect"></select>
      <div class="seg">
        <button data-view="hole" class="active">Hole by hole</button>
        <button data-view="card">Full card</button>
      </div>
      <div id="scorecardBody"><p class="empty">No rounds set up yet.</p></div>
    </div>
  </section>

  <section id="tab-board" class="hidden">
    <div class="card">
      <select id="boardRoundSelect"></select>
      <div id="leaderboardList"><p class="empty">No scores posted yet.</p></div>
    </div>
  </section>

  <section id="tab-stats" class="hidden">
    <div class="card">
      <h2>Statistics</h2>
      <select id="statsRoundSelect"></select>
      <div class="seg" id="statsBasis">
        <button data-basis="net" class="active">Net</button>
        <button data-basis="gross">Gross</button>
      </div>
      <div id="statHighlights" class="highlights"></div>
      <select id="statSort"></select>
      <div class="card-scroll"><div id="statTable"></div></div>
      <p id="statNote" style="font-size:12px;color:var(--dim);margin-top:12px;"></p>
    </div>
  </section>
</main>
<footer id="versionFooter"></footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { FIREBASE_CONFIG, FIREBASE_CONFIGURED } from "./firebase-config.js";
import { FORMATS, coursePar, playingHandicaps, teamHandicaps,
         computeHoleResult, roundTotals, fmtToPar, strokesOnHole,
         collectPlayerHoles, summarisePlayer,
         scoreCell, grossCap, DEFAULT_MAX_RULE } from "./scoring.js";
import { isAdminCode } from "./admin-pins.js";

const DB_PATH = "covidcup";
const SCORES_PATH = "covidcup_scores";
const ME_KEY = "covidcup_me";

let db = null;
let cfg = { event: {}, courses: {}, roster: {}, rounds: {}, groups: {} };
let scores = {};      // roundId -> groupId -> hole -> { playerId|team: {v,x} }
let meId = null;
let scoreView = "hole";   // "hole" or "card"
let loaded = false;

// One debounce timer per field. A single shared timer used to cancel earlier holes'
// pending writes before they reached Firebase — keep this keyed per field.
const writeTimers = new Map();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const orderedRounds = () =>
  Object.entries(cfg.rounds || {}).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));

const courseFor = roundId => cfg.courses?.[cfg.rounds?.[roundId]?.courseId] || null;

/* ---------- handicap context for a round ---------- */

// Contest holes are typed as free text ("2, 8"). Only numbers that exist on the round's
// course are kept, so a typo can't flag a hole that isn't there.
function contestHoles(on, text, holes){
  if (!on) return [];
  const valid = new Set((holes || []).map(h => h.number));
  const picked = String(text || "").split(/[^0-9]+/).filter(Boolean).map(Number);
  return [...new Set(picked)].filter(n => valid.has(n)).sort((a, b) => a - b);
}

// The competing entries for a round. Team formats use the teams the commissioner built;
// individual formats have none — every roster player is his own entry, keyed "p-<id>".
function unitsFor(roundId, round){
  if (FORMATS[round.format]?.unit === "player"){
    const out = {};
    Object.keys(cfg.roster || {}).forEach(pid => { out["p-" + pid] = { playerIds: [pid] }; });
    return out;
  }
  return cfg.groups?.[roundId] || {};
}

function roundContext(roundId){
  const round = cfg.rounds?.[roundId];
  const course = courseFor(roundId);
  if (!round || !course) return null;

  const playerPhs = playingHandicaps(cfg.roster || {}, course, {
    allowancePct: cfg.event?.allowancePct ?? 100,
    allowanceMode: cfg.event?.allowanceMode || "full"
  });

  const groups = unitsFor(roundId, round);
  const teamPhs = FORMATS[round.format]?.teamHcp
    ? teamHandicaps(round.format, groups, playerPhs, cfg.event?.teamHcpMode || "formula",
                    cfg.event?.teamWeights)
    : {};

  return { round, course, groups, units: groups, teeTimes: cfg.teeTimes?.[roundId] || {},
           playerPhs, teamPhs, holeCount: (course.holes || []).length,
           maxRule: round.maxScore || DEFAULT_MAX_RULE, maxPlus: round.maxPlus,
           contests: {
             ctp: contestHoles(round.ctpOn, round.ctpHoles, course.holes),
             ld: contestHoles(round.ldOn, round.ldHoles, course.holes)
           } };
}



/* ---------- round pickers ---------- */

function fillRoundSelect(el, { includeOverall = false } = {}){
  const rounds = orderedRounds();
  const current = el.value;
  el.innerHTML =
    (includeOverall ? `<option value="__all">Overall</option>` : "") +
    rounds.map(([id, r], i) => `<option value="${id}">${esc(r.name || `Round ${i + 1}`)}</option>`).join("");
  if (!rounds.length && !includeOverall) el.innerHTML = `<option value="">No rounds yet</option>`;
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

/* ---------- home ---------- */

function renderHome(){
  document.getElementById("eventName").textContent = cfg.event?.name || "Covid Cup 2026";

  const rounds = orderedRounds();
  document.getElementById("eventSub").textContent = rounds.length
    ? `${rounds.length} round${rounds.length > 1 ? "s" : ""} · ${Object.keys(cfg.roster || {}).length} players`
    : "Event setup in progress";

  document.getElementById("roundsInfo").innerHTML = rounds.length ? rounds.map(([id, r], i) => {
    const course = courseFor(id);
    return `<div class="pairing">
      <b>${esc(r.name || `Round ${i + 1}`)}</b> &middot; ${esc(FORMATS[r.format]?.label || r.format)}
      <div class="when">${course ? esc(course.name) + (course.location ? " · " + esc(course.location) : "") + " · par " + coursePar(course.holes) : "No course set"}</div>
      ${(() => {
        const ctp = contestHoles(r.ctpOn, r.ctpHoles, course?.holes);
        const ld = contestHoles(r.ldOn, r.ldHoles, course?.holes);
        const parts = [];
        if (ctp.length) parts.push("Closest to the pin: " + ctp.join(", "));
        if (ld.length) parts.push("Long drive: " + ld.join(", "));
        return parts.length ? `<div class="when">${parts.join(" · ")}</div>` : "";
      })()}
    </div>`;
  }).join("") : `<p class="empty">Not set up yet.</p>`;

  fillRoundSelect(document.getElementById("homeRoundSelect"));
  renderGroupsList();
}

function renderGroupsList(){
  const roundId = document.getElementById("homeRoundSelect").value;
  const el = document.getElementById("groupsList");
  const base = roundContext(roundId);
  if (!base){ el.innerHTML = `<p class="empty">No tee times posted yet.</p>`; return; }

  const unitLine = u => (base.units[u]?.playerIds || []).map(pid => esc(cfg.roster?.[pid]?.name || "?")).join(" &amp; ");
  const tees = Object.values(base.teeTimes)
    .map(t => ({ start: t.start || "", unitIds: (t.unitIds || []).filter(u => base.units[u]) }))
    .filter(t => t.unitIds.length)
    .sort((a, b) => a.start.localeCompare(b.start));

  el.innerHTML = tees.length ? tees.map(t => `
    <div class="pairing">
      <b>${t.start ? esc(t.start) : "Time to be confirmed"}</b>
      ${t.unitIds.map(u => `<div class="when">${unitLine(u)}</div>`).join("")}
    </div>`).join("") : `<p class="empty">No tee times posted yet.</p>`;
}

/* ---------- scorecard ---------- */

// Which card this phone is keeping, per round: a tee time, or a single team (or player)
// not yet put in a tee time. Defaults to whatever contains the logged-in player.
const scoringFor = {};

// Every card a phone could keep for a round. A tee time carries everyone out on the course
// together; anything not yet in a tee time can still be scored on its own.
function cardOptions(base){
  const tees = Object.entries(base.teeTimes || {})
    .map(([id, t]) => ({ id: "t:" + id, start: t.start || "", unitIds: (t.unitIds || []).filter(u => base.units[u]) }))
    .filter(t => t.unitIds.length)
    .sort((a, b) => a.start.localeCompare(b.start));
  const placed = new Set(tees.flatMap(t => t.unitIds));
  const loose = Object.keys(base.units).filter(u => !placed.has(u))
    .map(u => ({ id: "u:" + u, start: "", unitIds: [u] }));
  return [...tees, ...loose];
}

const unitLabel = (base, u) => boardName(base.units[u]?.playerIds || []).big;

function myUnit(base){
  return Object.keys(base.units).find(u => (base.units[u].playerIds || []).includes(meId)) || null;
}

function chosenCard(roundId, base){
  const options = cardOptions(base);
  const picked = options.find(o => o.id === scoringFor[roundId]);
  if (picked) return picked;
  const mine = myUnit(base);
  return options.find(o => o.unitIds.includes(mine)) || null;
}

function fillGroupSelect(roundId){
  const sel = document.getElementById("scoreGroupSelect");
  const base = roundContext(roundId);
  const options = base ? cardOptions(base) : [];
  if (!options.length){ sel.classList.add("hidden"); sel.innerHTML = ""; return; }
  sel.classList.remove("hidden");

  const mine = myUnit(base);
  const current = chosenCard(roundId, base);
  sel.innerHTML = (current ? "" : '<option value="">Pick the card you are keeping</option>') +
    options.map(o => {
      const names = o.unitIds.map(u => unitLabel(base, u)).join(" / ");
      const label = (o.start ? o.start + " · " : "") + names + (o.unitIds.includes(mine) ? " (you)" : "");
      return '<option value="' + o.id + '"' + (current && o.id === current.id ? " selected" : "") + ">" +
        "Scoring " + esc(label) + "</option>";
    }).join("");
}

function renderScoreTab(){
  fillRoundSelect(document.getElementById("scoreRoundSelect"));
  renderScorecard();
}

// Everything the scorecard needs: the round, the teams on this card, and every box — one
// per player, or one per team in scramble and alternate shot — each tagged with the team
// whose score it is.
function currentCard(){
  const roundId = document.getElementById("scoreRoundSelect").value;
  const base = roundContext(roundId);
  if (!base) return null;
  const card = chosenCard(roundId, base);
  if (!card) return { roundId, fields: [] };

  const { round, course, units, playerPhs, teamPhs, holeCount, maxRule, maxPlus, contests } = base;
  const teamEntry = FORMATS[round.format]?.entry === "team";

  const teams = card.unitIds.map(u => ({
    unitId: u,
    label: unitLabel(base, u),
    ctx: { memberIds: units[u].playerIds || [], playerPhs, teamPh: teamPhs[u] ?? 0, holeCount, maxRule, maxPlus }
  }));

  const fields = card.unitIds.flatMap(u => teamEntry
    ? [{ unitId: u, key: "team", label: unitLabel(base, u), ph: teamPhs[u] ?? 0 }]
    : (units[u].playerIds || []).map(pid => ({
        unitId: u, key: pid, label: cfg.roster?.[pid]?.name || "?", ph: playerPhs[pid] ?? 0
      })));

  return {
    roundId, round, course, holeCount, maxRule, maxPlus, contests, teams, fields,
    start: card.start,
    format: round.format,
    holes: course.holes || []
  };
}

const cellFor = (c, f, hole) => scores?.[c.roundId]?.[f.unitId]?.[hole]?.[f.key];
const unitScores = (c, unitId) => scores?.[c.roundId]?.[unitId] || {};

const holeComplete = (c, hole) => c.fields.every(f => {
  const cell = cellFor(c, f, hole);
  return cell && (cell.x || cell.v != null);
});

// Index of the first hole still missing a score or pickup, or -1 once the card is full.
const firstOpenIndex = c => c.holes.findIndex(h => !holeComplete(c, h.number));

function contestLabel(c, holeNumber){
  const names = [];
  if (c.contests.ctp.includes(holeNumber)) names.push("Closest to the pin");
  if (c.contests.ld.includes(holeNumber)) names.push("Long drive");
  return names.join(" & ");
}

function contestBadges(c, holeNumber){
  return (c.contests.ctp.includes(holeNumber) ? '<span class="contest ctp">Closest to the pin</span>' : "") +
         (c.contests.ld.includes(holeNumber) ? '<span class="contest ld">Long drive</span>' : "");
}

// Standard scorecard notation, taken from gross against par.
function markClass(gross, par){
  if (gross == null) return "";
  const d = gross - par;
  if (d <= -2) return "eagle";
  if (d === -1) return "birdie";
  if (d === 1) return "bogey";
  if (d >= 2) return "double";
  return "";
}

// Running totals, one line per team on the card.
function totalsHtml(c){
  return '<div class="card-totals">' + c.teams.map(t => {
    const r = roundTotals(c.format, c.holes, unitScores(c, t.unitId), t.ctx);
    return '<div class="stats">' +
      (c.teams.length > 1 ? '<span class="tt-name">' + esc(t.label) + "</span>" : "") +
      "<span>Thru <b>" + r.thru + "</b></span>" +
      "<span>Total <b>" + (r.thru ? fmtToPar(r.toPar) : "&mdash;") + "</b></span>" +
    "</div>";
  }).join("") + "</div>";
}

let currentHole = null;

function renderScorecard(){
  const body = document.getElementById("scorecardBody");
  fillGroupSelect(document.getElementById("scoreRoundSelect").value);
  const c = currentCard();

  if (!c){ body.innerHTML = '<p class="empty">This round does not have a course set yet.</p>'; return; }
  if (!c.fields.length){ body.innerHTML = '<p class="empty">Pick the card you are keeping above.</p>'; return; }
  if (!c.holes.length){ body.innerHTML = '<p class="empty">This round\'s course has no holes set up.</p>'; return; }

  if (scoreView === "card"){ renderFullCard(body, c); return; }

  // Land on the first unplayed hole rather than making the player hunt for it.
  if (currentHole == null || !c.holes.some(h => h.number === currentHole)){
    const firstOpen = c.holes.find(h => !holeComplete(c, h.number));
    currentHole = (firstOpen || c.holes[c.holes.length - 1]).number;
  }
  renderHoleView(body, c);
}

function renderHoleView(body, c){
  const hole = c.holes.find(h => h.number === currentHole);
  const idx = c.holes.indexOf(hole);

  // Holes past the first one still missing a score are locked, so a group can't get three
  // holes down the fairway before anyone notices a blank. Going back is always allowed.
  const openIdx = firstOpenIndex(c);
  const strip = c.holes.map((h, i) => {
    const locked = openIdx !== -1 && i > openIdx;
    const contest = contestLabel(c, h.number);
    return '<button data-goto="' + h.number + '" class="' +
      (h.number === currentHole ? "current " : "") +
      (holeComplete(c, h.number) ? "done " : "") +
      (locked ? "locked " : "") +
      (c.contests.ctp.includes(h.number) ? "ctp " : "") +
      (c.contests.ld.includes(h.number) ? "ld" : "") + '"' +
      (locked ? " disabled" : "") +
      (contest ? ' title="' + contest + '"' : "") +
      ">" + h.number + "</button>";
  }).join("");

  // With two teams on one card, each team's boxes sit under its name.
  const headed = c.teams.length > 1 && FORMATS[c.format]?.entry !== "team";
  let lastUnit = null;
  const entries = c.fields.map((f, i) => {
    const cell = cellFor(c, f, hole.number) || {};
    const shots = strokesOnHole(f.ph, hole.si, c.holeCount);
    const cap = grossCap(c.maxRule, hole.par, shots, c.maxPlus);
    const picked = !!cell.x;
    const header = headed && f.unitId !== lastUnit
      ? '<div class="team-head">' + esc(c.teams.find(t => t.unitId === f.unitId).label) + "</div>" : "";
    lastUnit = f.unitId;
    return header +
      '<div class="entry" data-i="' + i + '">' +
        '<span class="who">' + esc(f.label) +
          '<span class="shots">' +
            (shots ? shots + " shot" + (shots > 1 ? "s" : "") + " here" : "no shot here") +
            " &middot; plays off " + f.ph + (cap != null ? " &middot; max " + cap : "") +
          "</span>" +
        "</span>" +
        '<span class="big-box">' +
          '<input type="' + (picked ? "text" : "number") + '" inputmode="numeric" min="1" max="15"' +
            ' class="' + (picked ? "picked" : "") + '"' + (picked ? " disabled" : "") +
            ' value="' + (picked ? "X" : (cell.v ?? "")) + '" data-score>' +
          (shots ? '<span class="dot ' + (shots > 1 ? "two" : "") + '"></span>' : "") +
        "</span>" +
        '<span class="acts">' +
          (cap == null && !picked ? "" : '<button data-pickup class="' + (picked ? "on" : "") + '">Picked up</button>') +
          "<button data-clear>Clear</button>" +
        "</span>" +
      "</div>";
  }).join("");

  const complete = holeComplete(c, hole.number);
  body.innerHTML =
    '<p style="margin-bottom:10px;">' + esc(FORMATS[c.format]?.label || c.format) + " &middot; " +
      esc(c.course.name || "") + (c.start ? " &middot; " + esc(c.start) : "") + "</p>" +
    '<div class="strip">' + strip + "</div>" +
    '<div class="hole-head"><span class="num">' + hole.number + "</span>" +
      '<span class="meta">Par ' + hole.par + " &middot; stroke index " + hole.si + "</span></div>" +
    contestBadges(c, hole.number) +
    entries +
    totalsHtml(c) +
    '<p class="gate-hint' + (complete ? " hidden" : "") + '">Every player needs a score' +
      (c.maxRule === "none" ? "" : " or Picked up") + " before moving on.</p>" +
    '<div class="nav-holes">' +
      "<button data-prev" + (idx === 0 ? " disabled" : "") + ">&larr; " +
        (idx === 0 ? "Start" : "Hole " + c.holes[idx - 1].number) + "</button>" +
      '<button data-next class="primary"' + (idx === c.holes.length - 1 || !complete ? " disabled" : "") + ">" +
        (idx === c.holes.length - 1 ? "Last hole" : "Hole " + c.holes[idx + 1].number) + " &rarr;</button>" +
    "</div>" +
    (c.holes[idx + 1] && contestLabel(c, c.holes[idx + 1].number)
      ? '<p class="next-contest">Next hole: ' + contestLabel(c, c.holes[idx + 1].number) + "</p>" : "") +
    '<button class="link" id="switchPlayerBtn" style="margin-top:12px;">Not you? Switch player</button>';

  const inputs = [...body.querySelectorAll("input[data-score]")];

  body.querySelectorAll(".entry").forEach(row => {
    const f = c.fields[+row.dataset.i];
    const input = row.querySelector("input[data-score]");
    const pos = inputs.indexOf(input);

    input?.addEventListener("input", () => {
      if (input.value === ""){
        queueScoreWrite(c.roundId, f.unitId, hole.number, f.key, { v: null, x: false });
        refreshRunningTotal(c);
        return;
      }
      const n = Math.max(1, Math.min(15, Math.floor(+input.value) || 1));
      // Cap rather than storing a number nobody actually made.
      if (+input.value > 15) input.value = String(n);
      queueScoreWrite(c.roundId, f.unitId, hole.number, f.key, { v: n, x: false });
      refreshRunningTotal(c);

      // Move to the next box once the number cannot get any more specific — a lone 1
      // could still become 10 through 15, anything else could not.
      const raw = input.value;
      if (raw.length >= 2 || (raw.length === 1 && raw !== "1")) inputs[pos + 1]?.focus();
    });

    row.querySelector("[data-pickup]")?.addEventListener("click", () => {
      const now = !!cellFor(c, f, hole.number)?.x;
      queueScoreWrite(c.roundId, f.unitId, hole.number, f.key, now ? { v: null, x: false } : { v: null, x: true }, true);
    });
    row.querySelector("[data-clear]").addEventListener("click", () => {
      queueScoreWrite(c.roundId, f.unitId, hole.number, f.key, { v: null, x: false }, true);
    });
  });

  body.querySelectorAll("[data-goto]").forEach(btn => btn.addEventListener("click", () => {
    currentHole = +btn.dataset.goto;
    renderScorecard();
  }));
  body.querySelector("[data-prev]")?.addEventListener("click", () => {
    currentHole = c.holes[idx - 1]?.number ?? currentHole;
    renderScorecard();
  });
  body.querySelector("[data-next]")?.addEventListener("click", () => {
    if (!holeComplete(c, hole.number)) return;
    currentHole = c.holes[idx + 1]?.number ?? currentHole;
    renderScorecard();
  });
  document.getElementById("switchPlayerBtn").onclick = () => {
    localStorage.removeItem(ME_KEY);
    location.reload();
  };
}

// Updates totals, the strip and the gate without re-rendering the hole, which would throw
// focus out of the box being typed in.
function refreshRunningTotal(c){
  const totals = document.querySelector("#scorecardBody .card-totals");
  if (totals) totals.outerHTML = totalsHtml(c);

  const openIdx = firstOpenIndex(c);
  document.querySelectorAll("#scorecardBody [data-goto]").forEach((btn, i) => {
    btn.classList.toggle("done", holeComplete(c, +btn.dataset.goto));
    const locked = openIdx !== -1 && i > openIdx;
    btn.classList.toggle("locked", locked);
    btn.disabled = locked;
  });
  const complete = holeComplete(c, currentHole);
  const idx = c.holes.findIndex(h => h.number === currentHole);
  const next = document.querySelector("#scorecardBody [data-next]");
  if (next) next.disabled = idx === c.holes.length - 1 || !complete;
  document.querySelector("#scorecardBody .gate-hint")?.classList.toggle("hidden", complete);
}

function renderFullCard(body, c){
  const front = c.holes.filter(h => h.number <= 9);
  const back = c.holes.filter(h => h.number > 9);
  const sumPar = hs => hs.reduce((s, h) => s + (+h.par || 0), 0);

  // The score that COUNTS in each cell, after the round's maximum — the same number the
  // leaderboard uses, so the card and the leaderboard can never disagree.
  const countedFor = (f, h) => scoreCell(
    cellFor(c, f, h.number), h.par,
    strokesOnHole(f.ph, h.si, c.holeCount), c.maxRule, c.maxPlus
  );
  const sumGross = (f, hs) => {
    let total = 0, any = false;
    hs.forEach(h => {
      const res = countedFor(f, h);
      if (res){ total += res.gross; any = true; }
    });
    return any ? total : "";
  };
  const playerCells = (f, hs) => hs.map(h => {
    const res = countedFor(f, h);
    if (!res) return "<td></td>";
    if (res.pickedUp) return '<td><span class="mark double">X</span></td>';
    const cls = markClass(res.gross, h.par);
    return "<td>" + (cls ? '<span class="mark ' + cls + '">' + res.gross + "</span>" : res.gross) + "</td>";
  }).join("");

  const headed = c.teams.length > 1 && FORMATS[c.format]?.entry !== "team";
  const fieldRows = hs => {
    let lastUnit = null;
    return c.fields.map(f => {
      const head = headed && f.unitId !== lastUnit
        ? '<tr class="unit"><td class="name" colspan="' + (hs.length + 2) + '">' +
            esc(c.teams.find(t => t.unitId === f.unitId).label) + "</td></tr>"
        : "";
      lastUnit = f.unitId;
      return head + '<tr><td class="name">' + esc(f.label) + "</td>" + playerCells(f, hs) +
        '<td class="tot">' + sumGross(f, hs) + "</td></tr>";
    }).join("");
  };

  const section = (hs, label) => !hs.length ? "" :
    '<tr class="meta"><th class="name">Hole</th>' + hs.map(h => "<th>" + h.number + "</th>").join("") + "<th>" + label + "</th></tr>" +
    '<tr class="meta"><td class="name">Par</td>' + hs.map(h => "<td>" + h.par + "</td>").join("") + "<td>" + sumPar(hs) + "</td></tr>" +
    '<tr class="meta"><td class="name">Stroke index</td>' + hs.map(h => "<td>" + h.si + "</td>").join("") + "<td></td></tr>" +
    (hs.some(h => contestLabel(c, h.number))
      ? '<tr class="meta"><td class="name">Contest</td>' + hs.map(h =>
          "<td>" + (c.contests.ctp.includes(h.number) ? '<span class="contest ctp mini">CTP</span>' : "") +
          (c.contests.ld.includes(h.number) ? '<span class="contest ld mini">LD</span>' : "") + "</td>").join("") +
        "<td></td></tr>"
      : "") +
    fieldRows(hs);

  body.innerHTML =
    '<p style="margin-bottom:10px;">' + esc(FORMATS[c.format]?.label || c.format) + " &middot; " +
      esc(c.course.name || "") + (c.start ? " &middot; " + esc(c.start) : "") + "</p>" +
    '<div class="card-scroll"><table class="scard">' +
      section(front, "Out") +
      (back.length ? '<tr><td colspan="' + (back.length + 2) + '" style="border:none;height:10px;"></td></tr>' : "") +
      section(back, "In") +
    "</table></div>" +
    totalsHtml(c) +
    '<p style="font-size:12px;color:var(--dim);margin-top:10px;">' +
      "Circle = birdie &middot; double circle = eagle &middot; box = bogey &middot; double box = double or worse. " +
      "Numbers are the gross that counts, after the round's maximum; X is a picked-up ball, scored at the maximum. " +
      "Totals are net." +
    "</p>";
}

function queueScoreWrite(roundId, groupId, hole, field, value, immediate = false){
  scores[roundId] = scores[roundId] || {};
  scores[roundId][groupId] = scores[roundId][groupId] || {};
  scores[roundId][groupId][hole] = scores[roundId][groupId][hole] || {};
  scores[roundId][groupId][hole][field] = value;

  if (!db){
    localStorage.setItem("covidcup_scores_draft", JSON.stringify(scores));
    if (immediate) renderScorecard();
    return;
  }

  const key = `${roundId}|${groupId}|${hole}|${field}`;
  clearTimeout(writeTimers.get(key));
  const run = () => {
    writeTimers.delete(key);
    update(ref(db, `${SCORES_PATH}/${roundId}/${groupId}/${hole}`), { [field]: value })
      .catch(err => console.error(err));
  };
  if (immediate){ run(); renderScorecard(); }
  else writeTimers.set(key, setTimeout(run, 400));
}

/* ---------- leaderboard ---------- */

// "Andrew Hanna" -> first "Andrew", last "Hanna". A single word is treated as the last name.
function splitName(full){
  const parts = String(full || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return { first: "", last: parts[0] || "?" };
  return { first: parts.slice(0, -1).join(" "), last: parts[parts.length - 1] };
}

// Board-style name: surnames large, first names small underneath, like a hand-lettered board.
function boardName(playerIds){
  const names = (playerIds || []).map(id => splitName(cfg.roster?.[id]?.name));
  return {
    big: names.map(n => n.last).join(" & "),
    small: names.map(n => n.first).filter(Boolean).join(" & ")
  };
}

// One round's rows, in that round's natural unit (the group, or each player), with the
// front and back nine scored separately for the board.
function rowsForRound(roundId){
  const ctxBase = roundContext(roundId);
  if (!ctxBase) return [];
  const { round, course, groups, playerPhs, teamPhs, holeCount, maxRule, maxPlus } = ctxBase;
  const format = round.format;
  const holes = course.holes || [];
  const front = holes.filter(h => h.number <= 9);
  const back = holes.filter(h => h.number > 9);
  const byPlayer = FORMATS[format]?.unit === "player";
  const rows = [];

  const totalsFor = (groupScores, ctx) => ({
    ...roundTotals(format, holes, groupScores, ctx),
    front: roundTotals(format, front, groupScores, ctx),
    back: roundTotals(format, back, groupScores, ctx)
  });

  Object.entries(groups).forEach(([gid, g]) => {
    const memberIds = g.playerIds || [];
    const groupScores = scores?.[roundId]?.[gid] || {};

    if (byPlayer){
      memberIds.forEach(pid => {
        const t = totalsFor(groupScores, { memberIds: [pid], playerPhs, teamPh: 0, holeCount, maxRule, maxPlus });
        rows.push({ key: pid, names: cfg.roster?.[pid]?.name || "?", playerIds: [pid], ...t });
      });
    } else {
      const t = totalsFor(groupScores, { memberIds, playerPhs, teamPh: teamPhs[gid] ?? 0, holeCount, maxRule, maxPlus });
      rows.push({
        key: gid,
        names: memberIds.map(pid => cfg.roster?.[pid]?.name || "?").join(" / "),
        playerIds: memberIds, ...t
      });
    }
  });
  return rows;
}

// Overall rolls everything up to the player — a group's score counts for each of its
// members, so rounds with different formats and group sizes can share one table.
function rowsOverall(){
  const totals = new Map();
  orderedRounds().forEach(([roundId]) => {
    rowsForRound(roundId).forEach(r => {
      if (!r.thru) return;
      r.playerIds.forEach(pid => {
        const acc = totals.get(pid) || { toPar: 0, thru: 0, rounds: 0, byRound: {} };
        acc.toPar += r.toPar;
        acc.thru += r.thru;
        acc.rounds += 1;
        acc.byRound[roundId] = r.toPar;
        totals.set(pid, acc);
      });
    });
  });
  return [...totals.entries()].map(([pid, acc]) => ({
    key: pid,
    names: cfg.roster?.[pid]?.name || "?",
    playerIds: [pid],
    toPar: acc.toPar,
    thru: acc.thru,
    roundsPlayed: acc.rounds,
    byRound: acc.byRound
  }));
}

const parClass = n => n < 0 ? "under" : n > 0 ? "over" : "even";
const numCell = (n, extra = "") => n == null
  ? '<td class="num dash ' + extra + '">&ndash;</td>'
  : '<td class="num ' + parClass(n) + " " + extra + '">' + fmtToPar(n) + "</td>";

// Tied positions read "T2", the way a tournament board shows them.
function positions(rows){
  return rows.map(r => {
    const first = rows.findIndex(x => x.toPar === r.toPar) + 1;
    const tied = rows.filter(x => x.toPar === r.toPar).length > 1;
    return (tied ? "T" : "") + first;
  });
}

function nameCell(playerIds){
  const names = (playerIds || []).map(id => splitName(cfg.roster?.[id]?.name));
  // Every surname gets its own drop cap, the way each name is lettered on a board.
  const big = names.map(n => {
    const last = String(n.last);
    return '<span class="sn"><span class="cap">' + esc(last.charAt(0)) + "</span>" + esc(last.slice(1)) + "</span>";
  }).join(" &amp; ");
  const small = names.map(n => n.first).filter(Boolean).join(" & ");
  return '<td class="nm"><div class="lb-big">' + big + "</div>" +
    (small ? '<div class="lb-small">' + esc(small) + "</div>" : "") + "</td>";
}

function boardShell(sub, inner){
  return '<div class="board">' +
    '<div class="board-title">' + esc(cfg.event?.name || "Covid Cup 2026") + "</div>" +
    (sub ? '<div class="board-sub">' + sub + "</div>" : "") +
    '<div class="board-scroll">' + inner + "</div></div>";
}

function renderRoundBoard(el, roundId){
  const base = roundContext(roundId);
  if (!base){ el.innerHTML = boardShell("", '<p class="board-empty">This round has no course yet.</p>'); return; }

  const round = base.round;
  const holes = base.course.holes || [];
  const parOf = hs => hs.reduce((s, h) => s + (+h.par || 0), 0);
  const front = holes.filter(h => h.number <= 9);
  const back = holes.filter(h => h.number > 9);

  const rows = rowsForRound(roundId).filter(r => r.thru > 0)
    .sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);
  const pos = positions(rows);
  const unit = FORMATS[round.format]?.unit === "player" ? "Player" : "Team";

  const sub = esc(round.name || "") + " &middot; " + esc(base.course.name || "") + " &middot; " +
    esc(FORMATS[round.format]?.label || round.format);

  if (!rows.length){ el.innerHTML = boardShell(sub, '<p class="board-empty">No scores posted yet.</p>'); return; }

  const table =
    '<table class="lboard">' +
      '<tr class="parrow"><th></th><th class="nm">Par</th>' +
        "<th>" + (front.length ? parOf(front) : "") + "</th>" +
        "<th>" + (back.length ? parOf(back) : "") + "</th>" +
        "<th>" + parOf(holes) + "</th><th></th></tr>" +
      '<tr class="head"><th>Pos</th><th class="nm">' + unit + "</th><th>Out</th><th>In</th><th>Total</th><th>Thru</th></tr>" +
      rows.map((r, i) =>
        "<tr>" +
          '<td class="pos">' + pos[i] + "</td>" +
          nameCell(r.playerIds) +
          numCell(r.front.thru ? r.front.toPar : null) +
          numCell(back.length && r.back.thru ? r.back.toPar : null) +
          numCell(r.toPar, "tot") +
          '<td class="thru">' + (r.thru === holes.length ? "F" : r.thru) + "</td>" +
        "</tr>").join("") +
    "</table>";

  el.innerHTML = boardShell(sub, table);
}

function renderOverallBoard(el){
  const rounds = orderedRounds();
  const rows = rowsOverall().filter(r => r.thru > 0)
    .sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);
  const pos = positions(rows);

  if (!rows.length){ el.innerHTML = boardShell("All rounds", '<p class="board-empty">No scores posted yet.</p>'); return; }

  const table =
    '<table class="lboard">' +
      '<tr class="head"><th>Pos</th><th class="nm">Player</th>' +
        rounds.map((_, i) => "<th>R" + (i + 1) + "</th>").join("") + "<th>Total</th></tr>" +
      rows.map((r, i) =>
        "<tr>" +
          '<td class="pos">' + pos[i] + "</td>" +
          nameCell(r.playerIds) +
          rounds.map(([rid]) => numCell(r.byRound[rid] ?? null)).join("") +
          numCell(r.toPar, "tot") +
        "</tr>").join("") +
    "</table>";

  el.innerHTML = boardShell("All rounds", table);
}

function renderLeaderboard(){
  // With a single round there's nothing to choose between, so the picker goes away.
  const multi = orderedRounds().length > 1;
  const sel = document.getElementById("boardRoundSelect");
  fillRoundSelect(sel, { includeOverall: multi });
  sel.classList.toggle("hidden", !multi);
  const el = document.getElementById("leaderboardList");
  if (!sel.value){ el.innerHTML = boardShell("", '<p class="board-empty">No rounds set up yet.</p>'); return; }
  if (sel.value === "__all") renderOverallBoard(el);
  else renderRoundBoard(el, sel.value);
}

/* ---------- statistics ---------- */

let statsBasis = "net";   // "net" or "gross"
let statsSort = "toPar";

const STAT_COLUMNS = [
  { key: "toPar",   label: "To par",  best: "low"  },
  { key: "eagles",  label: "Eagles",  best: "high" },
  { key: "birdies", label: "Birdies", best: "high" },
  { key: "pars",    label: "Pars",    best: "high" },
  { key: "bogeys",  label: "Bogeys",  best: "low"  },
  { key: "doubles", label: "Dbl+",    best: "low"  },
  { key: "holes",   label: "Holes",   best: "high" }
];

// Every player's records across one round, or the whole event.
function gatherRecords(which){
  const rounds = which === "__all" ? orderedRounds().map(([id]) => id) : [which];
  const all = {};
  rounds.forEach(roundId => {
    const base = roundContext(roundId);
    if (!base) return;
    const { round, course, groups, playerPhs, teamPhs, holeCount, maxRule, maxPlus } = base;
    const recs = collectPlayerHoles(
      round.format, course.holes || [], groups,
      scores?.[roundId] || {}, playerPhs, teamPhs, holeCount, maxRule, maxPlus
    );
    Object.entries(recs).forEach(([pid, list]) => {
      (all[pid] = all[pid] || []).push(...list);
    });
  });
  return all;
}

function renderStatsTab(){
  fillRoundSelect(document.getElementById("statsRoundSelect"), { includeOverall: true });
  const sortSel = document.getElementById("statSort");
  if (!sortSel.options.length){
    sortSel.innerHTML = STAT_COLUMNS.map(c =>
      '<option value="' + c.key + '">Rank by ' + c.label + '</option>').join("");
    sortSel.value = statsSort;
  }
  renderStats();
}

function renderStats(){
  const which = document.getElementById("statsRoundSelect").value;
  const records = gatherRecords(which);

  const rows = Object.entries(records).map(([pid, list]) => {
    const s = summarisePlayer(list);
    return {
      pid,
      name: cfg.roster?.[pid]?.name || "?",
      pickedUp: s.pickedUp,
      holesPlayed: s.holesPlayed,
      bucket: statsBasis === "gross" ? s.gross : s.net
    };
  }).filter(r => r.holesPlayed > 0);

  const highlights = document.getElementById("statHighlights");
  const table = document.getElementById("statTable");
  const note = document.getElementById("statNote");

  if (!rows.length){
    highlights.innerHTML = "";
    table.innerHTML = '<p class="empty">No scores posted yet.</p>';
    note.textContent = "";
    return;
  }

  // ---- highlight cards ----
  const bestBy = (key, dir) => [...rows].sort((a, b) =>
    dir === "low" ? a.bucket[key] - b.bucket[key] : b.bucket[key] - a.bucket[key])[0];

  const lowScore = bestBy("toPar", "low");
  const mostBirdies = bestBy("birdies", "high");
  const mostOver = bestBy("doubles", "high");
  const label = statsBasis === "gross" ? "Gross" : "Net";

  const cards = [
    { cap: "Best " + label.toLowerCase(), who: lowScore.name, val: fmtToPar(lowScore.bucket.toPar) },
    { cap: "Most birdies", who: mostBirdies.name, val: mostBirdies.bucket.birdies },
    { cap: "Most doubles+", who: mostOver.name, val: mostOver.bucket.doubles },
    { cap: "Holes played", who: bestBy("holes", "high").name, val: bestBy("holes", "high").bucket.holes }
  ];
  highlights.innerHTML = cards.map(c =>
    '<div class="hl"><div class="cap">' + esc(c.cap) + '</div>' +
    '<div class="val">' + esc(String(c.val)) + '</div>' +
    '<div class="who">' + esc(c.who) + "</div></div>").join("");

  // ---- ranked table ----
  const col = STAT_COLUMNS.find(c => c.key === statsSort) || STAT_COLUMNS[0];
  rows.sort((a, b) => {
    const d = col.best === "low"
      ? a.bucket[col.key] - b.bucket[col.key]
      : b.bucket[col.key] - a.bucket[col.key];
    return d || a.bucket.toPar - b.bucket.toPar;
  });

  table.innerHTML =
    '<table class="statgrid"><tr><th></th><th class="name">Player</th>' +
    STAT_COLUMNS.map(c => "<th>" + c.label + "</th>").join("") + "</tr>" +
    rows.map((r, i) =>
      '<tr><td class="rank">' + (i + 1) + '</td><td class="name">' + esc(r.name) + "</td>" +
      STAT_COLUMNS.map(c => {
        const v = c.key === "toPar" ? fmtToPar(r.bucket.toPar) : r.bucket[c.key];
        return "<td" + (c.key === statsSort ? ' class="lead"' : "") + ">" + v + "</td>";
      }).join("") + "</tr>").join("") + "</table>";

  const picked = rows.reduce((n, r) => n + r.pickedUp, 0);
  note.innerHTML =
    (statsBasis === "gross"
      ? "Gross is the score that counts on each hole, after the round's maximum. "
      : "Net takes off the shots each player gets on each hole. ") +
    "Dbl+ counts <b>holes</b> at double bogey or worse, not strokes dropped. " +
    "In scramble and alternate shot the pair share one score, so it counts for both partners." +
    (picked ? " " + picked + " picked-up hole" + (picked === 1 ? " scores" : "s score") +
      " the round's maximum, in both gross and net." : "");
}

/* ---------- tabs ---------- */

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["home", "score", "board", "stats"].forEach(t =>
      document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab));
    if (btn.dataset.tab === "score") renderScoreTab();
    if (btn.dataset.tab === "board") renderLeaderboard();
    if (btn.dataset.tab === "stats") renderStatsTab();
  });
});

document.getElementById("homeRoundSelect").addEventListener("change", renderGroupsList);
document.getElementById("scoreRoundSelect").addEventListener("change", () => { currentHole = null; renderScorecard(); });
document.getElementById("scoreGroupSelect").addEventListener("change", e => {
  scoringFor[document.getElementById("scoreRoundSelect").value] = e.target.value;
  currentHole = null;
  renderScorecard();
});

document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".seg button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  scoreView = btn.dataset.view;
  renderScorecard();
}));
document.getElementById("boardRoundSelect").addEventListener("change", renderLeaderboard);
document.getElementById("statsRoundSelect").addEventListener("change", renderStats);
document.getElementById("statSort").addEventListener("change", e => { statsSort = e.target.value; renderStats(); });
document.querySelectorAll("#statsBasis button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll("#statsBasis button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  statsBasis = btn.dataset.basis;
  renderStats();
}));

/* ---------- login ---------- */

function findByCode(code){
  const wanted = String(code || "").trim().toUpperCase();
  if (!wanted) return null;
  const hit = Object.entries(cfg.roster || {}).find(([, p]) => String(p.code || "").toUpperCase() === wanted);
  return hit ? hit[0] : null;
}

function enterApp(){
  document.getElementById("loginGate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  renderHome();
}

function trySavedLogin(){
  const saved = localStorage.getItem(ME_KEY);
  if (saved && cfg.roster?.[saved]){ meId = saved; enterApp(); return true; }
  return false;
}

document.getElementById("codeSubmit").addEventListener("click", () => {
  const entered = document.getElementById("codeInput").value;

  // The two screens look almost identical, so a commissioner typing his console code
  // here is a routine mistake rather than a wrong code. Send him where he meant to go.
  if (isAdminCode(entered)){
    try { sessionStorage.setItem("covidcup_admin_ok", "1"); } catch (e){}
    location.href = "admin.html";
    return;
  }

  const id = findByCode(entered);
  if (!id){ document.getElementById("codeError").style.display = "block"; return; }
  meId = id;
  localStorage.setItem(ME_KEY, id);
  enterApp();
});
document.getElementById("codeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("codeSubmit").click();
});

/* ---------- data wiring ---------- */

function afterData(){
  if (!loaded){
    loaded = true;
    document.getElementById("codeWait").textContent =
      Object.keys(cfg.roster || {}).length ? "" : "Event isn't set up yet — check back shortly.";
    trySavedLogin();
  }
  if (!document.getElementById("app").classList.contains("hidden")){
    renderHome();
    if (!document.getElementById("tab-score").classList.contains("hidden")) renderScorecard();
    if (!document.getElementById("tab-board").classList.contains("hidden")) renderLeaderboard();
    if (!document.getElementById("tab-stats").classList.contains("hidden")) renderStatsTab();
  }
}

if (FIREBASE_CONFIGURED){
  const app = initializeApp(FIREBASE_CONFIG);
  db = getDatabase(app);
  onValue(ref(db, DB_PATH), snap => {
    cfg = snap.val() || { event: {}, courses: {}, roster: {}, rounds: {}, groups: {} };
    afterData();
  });
  onValue(ref(db, SCORES_PATH), snap => {
    scores = snap.val() || {};
    afterData();
  });
} else {
  try { cfg = JSON.parse(localStorage.getItem("covidcup_admin_draft") || "null") || cfg; } catch (e){}
  try { scores = JSON.parse(localStorage.getItem("covidcup_scores_draft") || "null") || {}; } catch (e){}
  afterData();
}

(async () => {
  try {
    const res = await fetch(`version.txt?cb=${Date.now()}`, { cache: "no-store" });
    document.getElementById("versionFooter").textContent = "v" + (await res.text()).trim();
  } catch (e){}
})();
</script>
