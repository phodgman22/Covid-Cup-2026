<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Covid Cup 2026</title>
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a1830; --surface:#0f2038; --surface2:#122845; --surface3:#173058;
  --line:#28405f; --text:#f0f3f8; --muted:#9fb0c9; --dim:#7288a6;
  --accent:#c7a34d; --accent-dim:#3a3320; --danger:#c8102e; --ok:#3fae6b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:40px;}
h1{font-size:19px;margin:0;}
h2{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
p{color:var(--muted);font-size:14px;margin:0 0 12px;}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg);}
header .sub{font-size:12px;color:var(--dim);margin-top:3px;}
nav.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
nav.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:12px 4px;font-size:13px;
  cursor:pointer;border-bottom:2px solid transparent;}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
main{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.empty{color:var(--dim);font-size:14px;}
select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 10px;font-size:14px;margin-bottom:12px;}
button.primary{background:var(--accent);border:1px solid var(--accent);color:#241d08;font-weight:600;
  border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;}
button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 4px;}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted);}
.pairing{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.pairing:last-child{border-bottom:none;}
.pairing .when{color:var(--dim);font-size:12px;}

.hole-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.hole-row:last-child{border-bottom:none;}
.hole-no{width:54px;font-size:12px;color:var(--dim);flex:0 0 54px;}
.hole-no b{display:block;color:var(--text);font-size:15px;}
.score-inputs{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.score-box{display:flex;flex-direction:column;align-items:center;gap:3px;}
.score-box label{font-size:10px;color:var(--dim);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.score-box input{width:52px;text-align:center;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);border-radius:8px;padding:8px 4px;font-size:16px;}
.score-box input:focus{outline:2px solid var(--accent);}
.score-box input.picked{opacity:.35;}
.pickup{font-size:10px;color:var(--dim);background:var(--surface3);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;cursor:pointer;}
.pickup.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

.lb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:22px;color:var(--dim);font-size:13px;}
.lb-names{flex:1;font-size:14px;}
.lb-thru{font-size:11px;color:var(--dim);}
.lb-topar{font-size:16px;font-weight:600;min-width:44px;text-align:right;}

#loginGate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;}
#loginGate .box{width:300px;text-align:center;}
#loginGate input{width:100%;text-align:center;letter-spacing:.4em;font-size:22px;text-transform:uppercase;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;margin-bottom:12px;}
.hidden{display:none !important;}
footer{text-align:center;color:var(--dim);font-size:11px;padding:16px;}
</style>
</head>
<body>

<div id="loginGate">
  <div class="box">
    <h1>Covid Cup 2026</h1>
    <p style="margin-top:6px;">Enter your player code</p>
    <input id="codeInput" placeholder="CODE" autocomplete="off" maxlength="8">
    <button class="primary" id="codeSubmit" style="width:100%">Enter</button>
    <p id="codeError" style="color:var(--danger);display:none;margin-top:10px;">Code not recognised</p>
    <p id="codeWait" style="margin-top:14px;font-size:12px;">Loading event&hellip;</p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <h1 id="eventName">Covid Cup 2026</h1>
  <div class="sub" id="eventSub">Loading event details&hellip;</div>
</header>

<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="score">Scorecard</button>
  <button data-tab="board">Leaderboard</button>
</nav>

<main>
  <section id="tab-home">
    <div class="card">
      <h2>Rounds</h2>
      <div id="roundsInfo"><p class="empty">Not set up yet.</p></div>
    </div>
    <div class="card">
      <h2>Groups</h2>
      <select id="homeRoundSelect"></select>
      <div id="groupsList"><p class="empty">No groups posted yet.</p></div>
    </div>
  </section>

  <section id="tab-score" class="hidden">
    <div class="card">
      <h2>Scorecard</h2>
      <select id="scoreRoundSelect"></select>
      <div id="scorecardBody"><p class="empty">No rounds set up yet.</p></div>
    </div>
  </section>

  <section id="tab-board" class="hidden">
    <div class="card">
      <h2>Leaderboard</h2>
      <select id="boardRoundSelect"></select>
      <div id="leaderboardList"><p class="empty">No scores posted yet.</p></div>
    </div>
  </section>
</main>
<footer id="versionFooter"></footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { FIREBASE_CONFIG, FIREBASE_CONFIGURED } from "./firebase-config.js";
import { FORMATS, coursePar, playingHandicaps, teamHandicaps,
         computeHoleResult, roundTotals, fmtToPar } from "./scoring.js";
import { isAdminCode } from "./admin-pins.js";

const DB_PATH = "covidcup";
const SCORES_PATH = "covidcup_scores";
const ME_KEY = "covidcup_me";

let db = null;
let cfg = { event: {}, courses: {}, roster: {}, rounds: {}, groups: {} };
let scores = {};      // roundId -> groupId -> hole -> { playerId|team: {v,x} }
let meId = null;
let loaded = false;

// One debounce timer per field. A single shared timer used to cancel earlier holes'
// pending writes before they reached Firebase — keep this keyed per field.
const writeTimers = new Map();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const orderedRounds = () =>
  Object.entries(cfg.rounds || {}).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0));

const courseFor = roundId => cfg.courses?.[cfg.rounds?.[roundId]?.courseId] || null;

/* ---------- handicap context for a round ---------- */

function roundContext(roundId){
  const round = cfg.rounds?.[roundId];
  const course = courseFor(roundId);
  if (!round || !course) return null;

  const playerPhs = playingHandicaps(cfg.roster || {}, course, {
    allowancePct: cfg.event?.allowancePct ?? 100,
    allowanceMode: cfg.event?.allowanceMode || "full"
  });

  const groups = cfg.groups?.[roundId] || {};
  const teamPhs = FORMATS[round.format]?.teamHcp
    ? teamHandicaps(round.format, groups, playerPhs, cfg.event?.teamHcpMode || "formula",
                    cfg.event?.teamWeights)
    : {};

  return { round, course, groups, playerPhs, teamPhs, holeCount: (course.holes || []).length };
}

function myGroupIn(roundId){
  const groups = cfg.groups?.[roundId] || {};
  for (const [gid, g] of Object.entries(groups)){
    if ((g.playerIds || []).includes(meId)) return [gid, g];
  }
  return [null, null];
}

/* ---------- round pickers ---------- */

function fillRoundSelect(el, { includeOverall = false } = {}){
  const rounds = orderedRounds();
  const current = el.value;
  el.innerHTML =
    (includeOverall ? `<option value="__all">Overall</option>` : "") +
    rounds.map(([id, r], i) => `<option value="${id}">${esc(r.name || `Round ${i + 1}`)}</option>`).join("");
  if (!rounds.length && !includeOverall) el.innerHTML = `<option value="">No rounds yet</option>`;
  if ([...el.options].some(o => o.value === current)) el.value = current;
}

/* ---------- home ---------- */

function renderHome(){
  document.getElementById("eventName").textContent = cfg.event?.name || "Covid Cup 2026";

  const rounds = orderedRounds();
  document.getElementById("eventSub").textContent = rounds.length
    ? `${rounds.length} round${rounds.length > 1 ? "s" : ""} · ${Object.keys(cfg.roster || {}).length} players`
    : "Event setup in progress";

  document.getElementById("roundsInfo").innerHTML = rounds.length ? rounds.map(([id, r], i) => {
    const course = courseFor(id);
    return `<div class="pairing">
      <b>${esc(r.name || `Round ${i + 1}`)}</b> &middot; ${esc(FORMATS[r.format]?.label || r.format)}
      <div class="when">${course ? esc(course.name) + (course.location ? " · " + esc(course.location) : "") + " · par " + coursePar(course.holes) : "No course set"}</div>
    </div>`;
  }).join("") : `<p class="empty">Not set up yet.</p>`;

  fillRoundSelect(document.getElementById("homeRoundSelect"));
  renderGroupsList();
}

function renderGroupsList(){
  const roundId = document.getElementById("homeRoundSelect").value;
  const groups = cfg.groups?.[roundId] || {};
  const entries = Object.entries(groups);
  document.getElementById("groupsList").innerHTML = entries.length ? entries.map(([gid, g]) => `
    <div class="pairing">
      ${(g.playerIds || []).map(pid => esc(cfg.roster?.[pid]?.name || "?")).join(" / ")}
      ${g.start ? `<div class="when">${esc(g.start)}</div>` : ""}
    </div>`).join("") : `<p class="empty">No groups posted yet.</p>`;
}

/* ---------- scorecard ---------- */

function renderScoreTab(){
  fillRoundSelect(document.getElementById("scoreRoundSelect"));
  renderScorecard();
}

function renderScorecard(){
  const body = document.getElementById("scorecardBody");
  const roundId = document.getElementById("scoreRoundSelect").value;
  const ctxBase = roundContext(roundId);

  if (!ctxBase){ body.innerHTML = `<p class="empty">This round doesn't have a course set yet.</p>`; return; }

  const [gid, group] = myGroupIn(roundId);
  if (!gid){ body.innerHTML = `<p class="empty">You're not in a group for this round yet.</p>`; return; }

  const { round, course, playerPhs, teamPhs, holeCount } = ctxBase;
  const format = round.format;
  const teamEntry = FORMATS[format]?.entry === "team";
  const memberIds = group.playerIds || [];
  const ctx = { memberIds, playerPhs, teamPh: teamPhs[gid] ?? 0, holeCount };
  const groupScores = scores?.[roundId]?.[gid] || {};

  const fields = teamEntry
    ? [{ key: "team", label: "Team" }]
    : memberIds.map(id => ({ key: id, label: cfg.roster?.[id]?.name || "?" }));

  const holes = course.holes || [];
  body.innerHTML = `
    <p>${esc(FORMATS[format]?.label || format)} &middot; ${esc(course.name || "")}
       ${group.start ? " &middot; " + esc(group.start) : ""}</p>
    <div id="holeRows">
      ${holes.map(h => {
        const entry = groupScores[h.number] || {};
        return `<div class="hole-row" data-hole="${h.number}">
          <div class="hole-no"><b>${h.number}</b>par ${h.par}</div>
          <div class="score-inputs">
            ${fields.map(f => {
              const cell = entry[f.key] || {};
              const picked = !!cell.x;
              return `<div class="score-box">
                <label>${esc(f.label)}</label>
                <input type="number" inputmode="numeric" min="1" max="15"
                  class="${picked ? "picked" : ""}" ${picked ? "disabled" : ""}
                  value="${cell.v ?? ""}" data-field="${esc(f.key)}">
                <span class="pickup ${picked ? "on" : ""}" data-pickup="${esc(f.key)}">picked up</span>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
    <div class="stats" style="margin-top:14px;">
      <span>Thru <b id="scThru">0</b></span>
      <span>Total <b id="scToPar">&mdash;</b></span>
    </div>
    <button class="link" id="switchPlayerBtn" style="margin-top:10px;">Not you? Switch player</button>`;

  body.querySelectorAll(".hole-row").forEach(row => {
    const hole = +row.dataset.hole;
    row.querySelectorAll("input[data-field]").forEach(inp => inp.addEventListener("input", () => {
      const val = inp.value === "" ? null : Math.max(1, Math.min(15, +inp.value));
      queueScoreWrite(roundId, gid, hole, inp.dataset.field, { v: val, x: false });
      updateScoreTotals(roundId, gid, format, course, ctx);
    }));
    row.querySelectorAll("[data-pickup]").forEach(btn => btn.addEventListener("click", () => {
      const field = btn.dataset.pickup;
      const now = !!(groupScores[hole]?.[field]?.x);
      queueScoreWrite(roundId, gid, hole, field, now ? { v: null, x: false } : { v: null, x: true }, true);
    }));
  });

  document.getElementById("switchPlayerBtn").onclick = () => {
    localStorage.removeItem(ME_KEY);
    location.reload();
  };

  updateScoreTotals(roundId, gid, format, course, ctx);
}

// Reads the live scores object rather than a captured one — the first entry on a
// fresh card replaces scores[roundId][gid], so a held reference goes stale.
function updateScoreTotals(roundId, gid, format, course, ctx){
  const t = roundTotals(format, course.holes || [], scores?.[roundId]?.[gid] || {}, ctx);
  const thruEl = document.getElementById("scThru");
  const parEl = document.getElementById("scToPar");
  if (!thruEl || !parEl) return;
  thruEl.textContent = t.thru;
  parEl.textContent = t.thru ? fmtToPar(t.toPar) : "—";
}

function queueScoreWrite(roundId, groupId, hole, field, value, immediate = false){
  scores[roundId] = scores[roundId] || {};
  scores[roundId][groupId] = scores[roundId][groupId] || {};
  scores[roundId][groupId][hole] = scores[roundId][groupId][hole] || {};
  scores[roundId][groupId][hole][field] = value;

  if (!db){
    localStorage.setItem("covidcup_scores_draft", JSON.stringify(scores));
    if (immediate) renderScorecard();
    return;
  }

  const key = `${roundId}|${groupId}|${hole}|${field}`;
  clearTimeout(writeTimers.get(key));
  const run = () => {
    writeTimers.delete(key);
    update(ref(db, `${SCORES_PATH}/${roundId}/${groupId}/${hole}`), { [field]: value })
      .catch(err => console.error(err));
  };
  if (immediate){ run(); renderScorecard(); }
  else writeTimers.set(key, setTimeout(run, 400));
}

/* ---------- leaderboard ---------- */

// One round's rows, using that round's natural unit (the group, or each player).
function rowsForRound(roundId){
  const ctxBase = roundContext(roundId);
  if (!ctxBase) return [];
  const { round, course, groups, playerPhs, teamPhs, holeCount } = ctxBase;
  const format = round.format;
  const holes = course.holes || [];
  const byPlayer = FORMATS[format]?.unit === "player";
  const rows = [];

  Object.entries(groups).forEach(([gid, g]) => {
    const memberIds = g.playerIds || [];
    const groupScores = scores?.[roundId]?.[gid] || {};

    if (byPlayer){
      memberIds.forEach(pid => {
        const t = roundTotals(format, holes, groupScores,
          { memberIds: [pid], playerPhs, teamPh: 0, holeCount });
        rows.push({ key: pid, names: cfg.roster?.[pid]?.name || "?", playerIds: [pid], ...t });
      });
    } else {
      const t = roundTotals(format, holes, groupScores,
        { memberIds, playerPhs, teamPh: teamPhs[gid] ?? 0, holeCount });
      rows.push({
        key: gid,
        names: memberIds.map(pid => cfg.roster?.[pid]?.name || "?").join(" / "),
        playerIds: memberIds, ...t
      });
    }
  });
  return rows;
}

// Overall rolls everything up to the player — a group's score counts for each of its
// members, so rounds with different formats and group sizes can share one table.
function rowsOverall(){
  const totals = new Map();
  orderedRounds().forEach(([roundId]) => {
    rowsForRound(roundId).forEach(r => {
      if (!r.thru) return;
      r.playerIds.forEach(pid => {
        const acc = totals.get(pid) || { toPar: 0, thru: 0, rounds: 0 };
        acc.toPar += r.toPar;
        acc.thru  += r.thru;
        acc.rounds += 1;
        totals.set(pid, acc);
      });
    });
  });
  return [...totals.entries()].map(([pid, acc]) => ({
    key: pid,
    names: cfg.roster?.[pid]?.name || "?",
    toPar: acc.toPar,
    thru: acc.thru,
    roundsPlayed: acc.rounds
  }));
}

function renderLeaderboard(){
  fillRoundSelect(document.getElementById("boardRoundSelect"), { includeOverall: true });
  const which = document.getElementById("boardRoundSelect").value;
  const rows = (which === "__all" ? rowsOverall() : rowsForRound(which)).filter(r => r.thru > 0);

  rows.sort((a, b) => a.toPar - b.toPar || b.thru - a.thru);

  document.getElementById("leaderboardList").innerHTML = rows.length ? rows.map((r, i) => `
    <div class="lb-row">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-names">${esc(r.names)}
        <div class="lb-thru">${which === "__all"
          ? `${r.roundsPlayed} round${r.roundsPlayed === 1 ? "" : "s"} · thru ${r.thru}`
          : `thru ${r.thru}`}</div></span>
      <span class="lb-topar">${fmtToPar(r.toPar)}</span>
    </div>`).join("") : `<p class="empty">No scores posted yet.</p>`;
}

/* ---------- tabs ---------- */

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["home", "score", "board"].forEach(t =>
      document.getElementById("tab-" + t).classList.toggle("hidden", t !== btn.dataset.tab));
    if (btn.dataset.tab === "score") renderScoreTab();
    if (btn.dataset.tab === "board") renderLeaderboard();
  });
});

document.getElementById("homeRoundSelect").addEventListener("change", renderGroupsList);
document.getElementById("scoreRoundSelect").addEventListener("change", renderScorecard);
document.getElementById("boardRoundSelect").addEventListener("change", renderLeaderboard);

/* ---------- login ---------- */

function findByCode(code){
  const wanted = String(code || "").trim().toUpperCase();
  if (!wanted) return null;
  const hit = Object.entries(cfg.roster || {}).find(([, p]) => String(p.code || "").toUpperCase() === wanted);
  return hit ? hit[0] : null;
}

function enterApp(){
  document.getElementById("loginGate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  renderHome();
}

function trySavedLogin(){
  const saved = localStorage.getItem(ME_KEY);
  if (saved && cfg.roster?.[saved]){ meId = saved; enterApp(); return true; }
  return false;
}

document.getElementById("codeSubmit").addEventListener("click", () => {
  const entered = document.getElementById("codeInput").value;

  // The two screens look almost identical, so a commissioner typing his console code
  // here is a routine mistake rather than a wrong code. Send him where he meant to go.
  if (isAdminCode(entered)){ location.href = "admin.html"; return; }

  const id = findByCode(entered);
  if (!id){ document.getElementById("codeError").style.display = "block"; return; }
  meId = id;
  localStorage.setItem(ME_KEY, id);
  enterApp();
});
document.getElementById("codeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("codeSubmit").click();
});

/* ---------- data wiring ---------- */

function afterData(){
  if (!loaded){
    loaded = true;
    document.getElementById("codeWait").textContent =
      Object.keys(cfg.roster || {}).length ? "" : "Event isn't set up yet — check back shortly.";
    trySavedLogin();
  }
  if (!document.getElementById("app").classList.contains("hidden")){
    renderHome();
    if (!document.getElementById("tab-score").classList.contains("hidden")) renderScorecard();
    if (!document.getElementById("tab-board").classList.contains("hidden")) renderLeaderboard();
  }
}

if (FIREBASE_CONFIGURED){
  const app = initializeApp(FIREBASE_CONFIG);
  db = getDatabase(app);
  onValue(ref(db, DB_PATH), snap => {
    cfg = snap.val() || { event: {}, courses: {}, roster: {}, rounds: {}, groups: {} };
    afterData();
  });
  onValue(ref(db, SCORES_PATH), snap => {
    scores = snap.val() || {};
    afterData();
  });
} else {
  try { cfg = JSON.parse(localStorage.getItem("covidcup_admin_draft") || "null") || cfg; } catch (e){}
  try { scores = JSON.parse(localStorage.getItem("covidcup_scores_draft") || "null") || {}; } catch (e){}
  afterData();
}

(async () => {
  try {
    const res = await fetch(`version.txt?cb=${Date.now()}`, { cache: "no-store" });
    document.getElementById("versionFooter").textContent = "v" + (await res.text()).trim();
  } catch (e){}
})();
</script>
</body>
</html>
