/* ==========================================================================
   8. EVENTS
   ========================================================================== */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => {
    const n = el.dataset.nav;
    if (n !== "match") V.fromCard = false;   // leaving the card/hole loop
    if (n === "home")  V.view = "home";
    if (n === "board"){ V.view = "board"; if (el.dataset.boardtab) V.boardTab = el.dataset.boardtab; }
    if (n === "matches") V.view = "matches";
    if (n === "profile") V.view = "profile";
    if (n === "stats") V.view = "stats";
    if (n === "chat")  V.view = "chat";
    if (n === "event") V.view = "event";
    if (n === "round"){ V.view = "round"; V.round = +el.dataset.i; }
    if (n === "match"){
      V.view = "match"; V.matchId = el.dataset.id; V.editTees = false; V.showStrokeSummary = false;
      const {r, m} = ALL_MATCHES[V.matchId];
      V.round = ROUNDS.indexOf(r);
      // land on the first hole still missing a score, in THIS match's own
      // shotgun order, not on the close-out hole — so the card can be
      // finished for the statistics
      const sc = Store.scores(m.id);
      V.hole = firstUnenteredHole(r, m, sc);
      // A match with no scores AT ALL opens on its own briefing screen — format,
      // who's stroking where, and who's picking up the card — before any scoring.
      // "Any score" and not "a completed hole": a half-entered hole means the
      // group is mid-round and must land back on the scoring screen.
      const begun = matchBegun(m.id);
      if (!begun) V.view = "brief";
      V.briefOpen = false;
      V.pendingTaunt = m.id;   // every click into a match plays one, every time
    }
    if (n === "card"){ V.view = "card"; V.matchId = el.dataset.id; }
    V.sheet = null; render(); window.scrollTo(0, 0);
    if (V.pendingTaunt){
      const {r, m} = ALL_MATCHES[V.pendingTaunt];
      V.pendingTaunt = null;
      playTaunt(r, m);
    }
  });

  const upd = document.querySelector("[data-update]");
  if (upd) upd.onclick = applyUpdate;
  document.querySelectorAll("[data-profile]").forEach(el => el.onclick = () => {
    const id = el.dataset.profile;
    if (id !== Session.id) showProfilePopup(id);   // your own row is already the page you're on
  });
  document.querySelectorAll("[data-sheet]").forEach(el =>
    el.onclick = () => { V.sheet = el.dataset.sheet; render(); });
  document.querySelectorAll("[data-sort]").forEach(el =>
    el.onclick = () => { V.statSort = el.dataset.sort; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-boardtab]").forEach(el =>
    el.onclick = () => { V.boardTab = el.dataset.boardtab; render(); });
  const sel = document.getElementById("statsel");
  if (sel) sel.onchange = () => { V.statSort = sel.value; render(); };

  /* --- chat --------------------------------------------------------------- */
  document.querySelectorAll("[data-chan]").forEach(el =>
    el.onclick = () => { V.chan = el.dataset.chan; render(); });
  const retry = document.querySelector("[data-retry]");
  if (retry) retry.onclick = () => { Store.chatRetry(); render(); };

  if (V.view === "chat"){
    const inp = document.getElementById("chatin");
    const btn = document.getElementById("chatsend");
    const tag = document.getElementById("tagbtn");
    if (tag){
      tag.classList.toggle("on", !!V.tagOpen);
      tag.onclick = () => { V.draft = inp ? inp.value : null; V.tagOpen = !V.tagOpen;
                            V.refocusChat = false; render(); };
    }
    document.querySelectorAll("[data-tag]").forEach(el => el.onclick = () => {
      const box = document.getElementById("chatin");
      const cur = (box.value || "").trimEnd();
      V.draft = (cur ? cur + " " : "") + "@" + PLAYERS[el.dataset.tag].n + " ";
      V.tagOpen = false; V.refocusChat = true; render();
    });
    const listEl = document.getElementById("chatlist");
    const ch = V.chan === "team" ? myChannel() : "all";
    if (listEl) listEl.scrollTop = listEl.scrollHeight;      // newest message in view
    Store.chatMarkRead(ch);

    const grow = () => { inp.style.height = "auto";
                         inp.style.height = Math.min(inp.scrollHeight, 104) + "px"; };
    const send = () => {
      const txt = inp.value.trim();
      if (!txt) return;
      Store.chatSend(ch, txt.slice(0, 500), Session.id);
      inp.value = ""; grow(); V.pending = false; render();
      const l = document.getElementById("chatlist");
      if (l) l.scrollTop = l.scrollHeight;
      document.getElementById("chatin").focus();
    };
    if (inp){
      // a message arriving mid-sentence must not eat the draft or the caret
      if (V.draft != null){ inp.value = V.draft; V.draft = null; grow(); }
      inp.oninput = grow;
      inp.onfocus = () => setTimeout(() =>
        inp.scrollIntoView({block: "center", behavior: "smooth"}), 260);
      inp.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
      };
      if (V.refocusChat){ V.refocusChat = false; inp.focus(); }
    }
    if (btn) btn.onclick = send;
  }
  document.querySelectorAll("[data-close]").forEach(el =>
    el.onclick = e => { if (e.target === el){ V.sheet = null; render(); } });
  document.querySelectorAll("[data-closebtn]").forEach(el =>
    el.onclick = () => { V.sheet = null; render(); });
  /* --- tiebreak ----------------------------------------------------------- */
  const tbf = document.querySelector("[data-tbformat]");
  if (tbf) tbf.onclick = () => {
    const v = (document.getElementById("tbformat").value || "").trim();
    if (!v){ alert("Say what the tiebreak is first."); return; }
    Store.setTiebreak({format: v.slice(0, 300)}, Session.id);
    render(); window.scrollTo(0, 0);
  };
  document.querySelectorAll("[data-tbwinner]").forEach(el => el.onclick = () => {
    const res = (document.getElementById("tbresult").value || "").trim();
    const team = el.dataset.tbwinner;
    if (!confirm(`Declare the ${team === "s" ? "KRAFT" : "HEINZ"} winners of the Outing on the tiebreak?`)) return;
    Store.setTiebreak({result: res.slice(0, 300), winner: team}, Session.id);
    render(); window.scrollTo(0, 0);
  });
  const tbe = document.querySelector("[data-tbedit]");
  if (tbe) tbe.onclick = () => { Store.setTiebreak({format: ""}, Session.id); render(); };
  const tbr = document.querySelector("[data-tbreset]");
  if (tbr) tbr.onclick = () => {
    if (confirm("Clear the tiebreak and start it over?")) { Store.clearTiebreak(Session.id); render(); }
  };

  const exp = document.querySelector("[data-export]");
  if (exp) exp.onclick = () => {
    const blob = new Blob([JSON.stringify(Store.exportAll(), null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
      String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${
      String(d.getMinutes()).padStart(2,"0")}`;
    a.href = URL.createObjectURL(blob);
    a.download = `crusade-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast("Backup downloaded");
  };
  const rst2 = document.querySelector("[data-restore]");
  const rf = document.getElementById("restorefile");
  if (rst2 && rf){
    rst2.onclick = () => rf.click();
    rf.onchange = () => {
      const f = rf.files && rf.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const res = Store.importAll(JSON.parse(rd.result));
          showToast(`Restored ${res.restored} entr${res.restored === 1 ? "y" : "ies"}` +
                    (res.skipped ? ` &middot; ${res.skipped} already current` : ""));
          V.sheet = null; render();
        } catch(e){ alert("Couldn't read that file.\n\n" + e.message); }
      };
      rd.readAsText(f);
    };
  }
  const so = document.querySelector("[data-signout]");
  if (so) so.onclick = () => { Session.id = null; V.sheet = null; V.view = "home"; render(); };

  document.querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    const entry = ALL_MATCHES[V.matchId];
    if (!entry){ V.hole = Math.max(0, Math.min(17, V.hole + (+el.dataset.step))); render(); return; }
    const order = playOrder(entry.m);
    const pos = Math.max(0, Math.min(17, orderPos(entry.m, V.hole) + (+el.dataset.step)));
    V.hole = order[pos]; render();
  });
  document.querySelectorAll("[data-hole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.hole; render(); });
  // tapping a hole on the review card jumps straight into editing it
  document.querySelectorAll("[data-gohole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.gohole; V.view = "match"; V.fromCard = true;
    render(); window.scrollTo(0, 0); });

  const claim = document.querySelector("[data-claim]");
  if (claim) claim.onclick = () => { Store.setScorer(claim.dataset.claim, Session.id); render(); };
  document.querySelectorAll("[data-teefor]").forEach(el => { if (el.disabled) return;
    el.onchange = () => Store.setPlayerTee(el.dataset.teefor, el.value, Session.id); });
  document.querySelectorAll("[data-idxfor]").forEach(el => { if (el.disabled) return;
    el.onchange = () => {
      const v = parseFloat(el.value);
      Store.setPlayerIdx(el.dataset.idxfor, Number.isFinite(v) ? v : 0, Session.id);
    }; });
  const editTees = document.querySelector("[data-edittees]");
  if (editTees) editTees.onclick = () => { V.editTees = true; V.showStrokeSummary = false; render(); };
  const reviewStrokes = document.querySelector("[data-reviewstrokes]");
  if (reviewStrokes) reviewStrokes.onclick = () => { V.showStrokeSummary = true; render(); window.scrollTo(0, 0); };
  const backToTees = document.querySelector("[data-backtotees]");
  if (backToTees) backToTees.onclick = () => { V.showStrokeSummary = false; V.editTees = true; render(); };
  const startScoring = document.querySelector("[data-startscoring]");
  if (startScoring) startScoring.onclick = () => {
    const mId = startScoring.dataset.startscoring, firstTime = !Store.teesConfirmed(mId);
    Store.setTeesConfirmed(mId, Session.id);
    V.editTees = false; V.showStrokeSummary = false; render();
    if (firstTime) showToast("Good luck out there &mdash; may your day go smoother than a jar of Heinz Mayo.");
  };
  // hand the card to a named player straight from the briefing
  document.querySelectorAll("[data-give]").forEach(el => el.onclick = () => {
    const to = el.dataset.to;
    if (to !== Session.id && !confirm(`Hand scoring to ${PLAYERS[to].n}?\n\n`
      + `${PLAYERS[to].n} enters the scores from their own phone.`)) return;
    Store.setScorer(el.dataset.give, to);
    // Claiming for yourself jumps straight to tee confirmation — that's the
    // first step of scoring now, not a screen you have to dig for.
    if (to === Session.id) V.view = "match";
    render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll("[data-briefopen]").forEach(el => el.onclick = () => {
    V.briefOpen = !V.briefOpen; render();
    if (V.briefOpen){ const d = document.querySelector(".briefdrop");
      if (d) d.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  });
  const pro = document.querySelector("[data-toscoring]");
  if (pro) pro.onclick = () => { V.view = "match"; render(); window.scrollTo(0, 0); };
  const sub = document.querySelector("[data-submit]");
  if (sub) sub.onclick = () => {
    const id = sub.dataset.submit, {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    Store.setSubmitted(id, true, Session.id);
    V.view = "home"; render(); window.scrollTo(0, 0);
    // celebrate only once the card is signed off, never on a mistyped score
    if (st.winner === "s") playWin(r, m, st);
    else if (st.winner === "d") playHeinzWin(r, m, st);
  };
  const unsub = document.querySelector("[data-unsubmit]");
  if (unsub) unsub.onclick = () => {
    if (confirm("Reopen this round for editing?\n\nIt stops being official until it's submitted again."))
      { Store.setSubmitted(unsub.dataset.unsubmit, false, Session.id); render(); }
  };
  const rst = document.querySelector("[data-reset]");
  if (rst) rst.onclick = () => {
    if (confirm("Wipe every score in this match and start it over?\n\nThis clears it on everyone's phone."))
      { Store.resetMatch(rst.dataset.reset); V.hole = 0; render(); } };

  const rstAll = document.querySelector("[data-resetall]");
  if (rstAll) rstAll.onclick = () => {
    if (!confirm(`Wipe EVERY score, scorer and submission on all ${MATCH_COUNT} match${
        MATCH_COUNT === 1 ? "" : "es"}?\n\n`
      + "This affects every phone at once. Download a backup first if you want a record "
      + "of what's there now.")) return;
    if (!confirm("Really sure? This is the whole event's data, not just one match, and it "
      + "cannot be undone.")) return;
    Object.keys(ALL_MATCHES).forEach(id => Store.resetMatch(id));
    /* The once-only scenes remember on THIS phone that they already fired.
       Without clearing them a wipe isn't really a clean slate: a phone that
       saw a dormie or the Outing win during testing would never show it
       again for real, and the victory scene only ever gets one chance. */
    try { localStorage.removeItem(VICTORY_KEY); localStorage.removeItem(DORMIE_KEY); } catch(e){}
    ANNOUNCED.clear(); broadcastReady = false;   // Philly Boy's field broadcast, same reset logic
    V.sheet = null; render();
    showToast(`All ${MATCH_COUNT} match${MATCH_COUNT === 1 ? "" : "es"} reset to a clean slate`);
  };

  /* --- gross score inputs -------------------------------------------------
     Writes are "silent" (no re-render) so the keyboard stays open and the
     caret doesn't jump. The derived numbers are patched in place instead. */
  document.querySelectorAll(".gsin").forEach(el => {
    if (el.readOnly) return;
    el.oninput = () => {
      const raw = el.value.replace(/[^0-9]/g, "").slice(0, 2);
      if (el.value !== raw) el.value = raw;
      let v = raw === "" ? null : parseInt(raw, 10);
      // Out of range: refuse the keystroke and put the box back to what is
      // actually stored. Letting "16" sit in the box while a 1 is saved is how
      // a scorer ends up certain he entered a number the card never got.
      if (v !== null && (v < 1 || v > 15)){
        const {m: mm} = ALL_MATCHES[V.matchId];
        const cur = (Store.scores(mm.id)[V.hole] || {})[el.dataset.entrant];
        el.value = (cur == null || cur === PICKED) ? "" : String(cur);
        el.select();
        return;
      }
      const {r, m} = ALL_MATCHES[V.matchId];
      const before = holeEntered(r, m, V.hole, Store.scores(m.id));
      Store.setScore(m.id, V.hole, el.dataset.entrant, v, Session.id, true);
      patch();
      // The LAST expected score just landed. Don't judge it instantly — the "1"
      // may be about to become "12". Settle, then announce and unlock together.
      // While a settle is armed, every further keystroke pushes it back, so the
      // verdict always reads the finished number. It never re-arms for a hole
      // that was already complete, so corrections don't re-announce.
      const after = holeEntered(r, m, V.hole, Store.scores(m.id));
      const armed = scheduleHoleSettle._armed;
      if (after && (!before || (armed && armed.mId === m.id && armed.h === V.hole)))
        scheduleHoleSettle(r, m, V.hole);
      else if (!after){
        clearTimeout(scheduleHoleSettle._t);
        scheduleHoleSettle._armed = null;
      }
      // Auto-advance the moment the number can't get any more specific: two
      // digits, or a single digit other than "1" (which could still become
      // 10-15). Saves a tap on every score without jumping ahead of a "1"
      // that's still mid-keystroke.
      if (raw.length === 2 || (raw.length === 1 && raw !== "1")){
        const boxes = [...document.querySelectorAll(".gsin")].filter(b => !b.readOnly);
        const idx = boxes.indexOf(el);
        if (idx > -1 && idx < boxes.length - 1) boxes[idx + 1].focus();
      }
    };
    el.onfocus = () => {
      el.select();
      // iOS slides the keyboard up over the page; put the active box mid-screen.
      setTimeout(() => el.scrollIntoView({block: "center", behavior: "smooth"}), 260);
    };
    el.onblur = () => {
      // last line of defence: the box must always show what the card holds
      const {m: mm} = ALL_MATCHES[V.matchId];
      const cur = (Store.scores(mm.id)[V.hole] || {})[el.dataset.entrant];
      const shown = (cur == null) ? "" : cur === PICKED ? "X" : String(cur);
      if (el.value !== shown) el.value = shown;
      if (!V.pending){ patch(); return; }
      /* A deferred render is waiting on this blur, but blur also fires when
         focus is simply moving to the NEXT score box — auto-advance does it on
         every score. Rendering there rebuilds every box, so the box the focus
         is travelling to no longer exists by the time it lands and iOS drops
         the keyboard mid-hole. Let focus settle first: still on a score box
         means still typing, so patch and keep the render pending. */
      setTimeout(() => {
        if (!V.pending) return;
        const ae = document.activeElement;
        if (ae && ae.classList && ae.classList.contains("gsin")){ patch(); return; }
        V.pending = false; render();
      }, 0);
    };
  });
  const proceed = document.querySelector("[data-proceed]");
  if (proceed) proceed.onclick = () => {
    const ae = document.activeElement;
    if (ae && ae.classList.contains("gsin")) ae.blur();   // commit what's typed
    const {r: pr, m: pm} = ALL_MATCHES[V.matchId], prevHole = V.hole;
    const order = playOrder(pm), prevPos = orderPos(pm, prevHole);
    if (V.fromCard){ V.fromCard = false; V.view = "card"; }   // one tap back to review
    else if (prevPos === 17) V.view = "card";                 // all 18 in — review and submit
    else V.hole = order[prevPos + 1];                         // next hole in THIS match's own order
    V.pending = false; render(); window.scrollTo(0, 0);
    if (V.view === "match" && orderPos(pm, V.hole) === prevPos + 1) checkDormie(pr, pm, prevHole);
  };
  document.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => {
    const {m} = ALL_MATCHES[V.matchId];
    Store.setScore(m.id, V.hole, el.dataset.clear, null, Session.id, true);
    render();
  });
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    const {r, m} = ALL_MATCHES[V.matchId];
    const cur = (Store.scores(m.id)[V.hole] || {})[el.dataset.pick];
    const before = holeEntered(r, m, V.hole, Store.scores(m.id));
    // tapping Picked Up again un-picks
    Store.setScore(m.id, V.hole, el.dataset.pick,
      cur === PICKED ? null : PICKED, Session.id, true);
    render();
    // a tap is deliberate — no settle delay needed, announce right away
    const verdict = holeVerdict(r, m, V.hole, Store.scores(m.id));
    if (verdict && !before) afterHoleComplete(r, m, V.hole, verdict);
  });
  document.querySelectorAll("[data-mully]").forEach(el => el.onclick = () => {
    const {m} = ALL_MATCHES[V.matchId], entrant = el.dataset.mully;
    const cur = (Store.mulligans(m.id)[V.hole] || {})[entrant] || 0;
    Store.setMulligan(m.id, V.hole, entrant, cur + (+el.dataset.dir), Session.id);
    render();
  });

  if (V.view === "match"){
    let x0 = null, y0 = null;
    const w = document.querySelector(".wrap");
    w.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; };
    w.ontouchend = e => {
      if (x0 === null || document.activeElement.classList.contains("gsin")) { x0 = null; return; }
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8){
        const fwd = dx < 0;
        // swiping forward obeys the same gate as the buttons
        const {r: rr, m: mm2} = ALL_MATCHES[V.matchId];
        const done = matchState(rr, mm2, Store.scores(mm2.id)).holes[V.hole] !== null;
        if (!fwd || done){
          const prevHole = V.hole;
          V.hole = Math.max(0, Math.min(17, V.hole + (fwd ? 1 : -1)));
          render();
          if (fwd && V.hole === prevHole + 1) checkDormie(rr, mm2, prevHole);
        }
      }
      x0 = null;
    };
  }
}

/** Update everything derived from a score without rebuilding the DOM. */
function patch(){
  if (V.view !== "match") return;
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores), h = V.hole;

  ["s","d"].forEach(key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores);
    const sn = document.getElementById(`sidenet-${key}`);
    if (sn) sn.innerHTML = bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;";
    const ents = r.mode === "team" ? [[key, teamStrokes(r, side, h)]]
      : side.p.map(pl => [pl[0], playerStrokes(r, side, pl, h)]);
    const hs = holeScores(r, m, h, scores);
    ents.forEach(([id, strokes]) => {
      const raw = (scores[h] || {})[id], v = hs[id], picked = raw === PICKED;
      const out = document.getElementById(`net-${id}`);
      if (out) out.innerHTML = !v ? "" : `${picked ? "plays" : "net"}<b>${v.net}</b>`;
      const inp = document.getElementById(`gs-${id}`);
      if (inp){
        inp.className = "gsin " + (raw == null ? "blank"
          : picked ? "picked" : markCls(v.gross, c.par[h]));
        const row = inp.closest(".prow");
        if (row) row.classList.toggle("best",
          !!(bh && bh.byId === id && r.mode !== "team" && side.p.length > 1));
      }
    });
  });

  const r1 = document.getElementById("res1"), r2 = document.getElementById("res2");
  // matchLine() returns HTML-escaped text (a result like "5 & 3" becomes
  // "5 &amp; 3"), so it must go in as innerHTML — textContent would print the
  // escape literally. holeLine() is plain text and stays textContent.
  if (r1) r1.textContent = holeLine(r, m, h, scores);
  if (r2) r2.innerHTML = matchBegun(m.id) ? matchLine(st) : "Match not started";
  const rb = document.getElementById("resbar");
  if (rb) rb.className = "resbar " + (st.winner || "");
  const c2 = document.getElementById("comp2bar");
  if (c2) c2.innerHTML = comp2BarHTML(r, m, scores);

  /* Navigation gating has to follow the scores LIVE — patch() runs on every
     keystroke while render() can't (it would rebuild the DOM under the
     scorer's thumb). Before this, the forward arrow and Save button kept
     whatever disabled state they were rendered with, so a hole completed
     from the keyboard stayed locked until something else forced a render. */
  const firstOpen = firstOpenHole(m, st);
  const firstOpenPos = orderPos(m, firstOpen);
  const holeDone = st.holes[h] !== null;
  for (let i = 0; i < 18; i++){
    const chip = document.getElementById(`chip-${i}`), w = st.holes[i];
    if (!chip) continue;
    const locked = orderPos(m, i) > firstOpenPos, sp = specialAt(r.n, i);
    // rebuild the FULL class list — dropping "lock"/"sp" here is what used to
    // erase the CTP/LD dots from the strip after the first keystroke
    chip.className = (i === h ? "cur " : "") + (locked ? "lock " : "") + (sp ? "sp " : "") +
      (w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : "");
    chip.disabled = locked;
  }
  const fwd = document.querySelector('.navbtn[data-step="1"]');
  if (fwd) fwd.disabled = orderPos(m, h) === 17 || !holeDone;
  const go = document.querySelector("[data-proceed]");
  if (go) go.disabled = !(holeDone || V.fromCard);
  const gate = document.getElementById("gatebar");
  if (gate) gate.classList.toggle("off", holeDone || V.fromCard);
}

/* ==========================================================================
   9. BOOT
   ========================================================================== */
Store.onChange(() => {
  if (!Session.id) return;
  checkVictory();
  pruneDormieShown();
  const ae = document.activeElement, cls = ae && ae.classList;
  // Never rebuild the DOM out from under someone who is typing a score.
  if (cls && cls.contains("gsin")){ V.pending = true; return; }
  // Chat can redraw live, but the draft and caret have to survive it.
  if (cls && cls.contains("chatin")){ V.draft = ae.value; V.refocusChat = true; }
  render();
  broadcastFieldEvents();   // anything that just landed from another match
});
Store.connect();
render();

// check for a new build on load, when the app comes back to the foreground,
// and every ten minutes while it's open
setTimeout(checkForUpdate, 4000);
setInterval(checkForUpdate, 600000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});
