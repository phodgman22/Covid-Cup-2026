<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Covid Cup 2026</title>
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a1830">
<style>
:root{
  --bg:#0a1830; --surface:#0f2038; --surface2:#122845; --surface3:#173058;
  --line:#28405f; --text:#f0f3f8; --muted:#9fb0c9; --dim:#7288a6; --accent:#c7a34d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);padding-bottom:40px;}
h1{font-size:22px;margin:0;}
h2{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;}
p{color:var(--muted);margin:0 0 8px;font-size:14px;}
header{padding:22px 16px;border-bottom:1px solid var(--line);}
header .sub{color:var(--muted);font-size:14px;margin-top:4px;}
main{max-width:720px;margin:0 auto;padding:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;}
th{color:var(--dim);font-weight:500;}
.pairing{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.pairing:last-child{border-bottom:none;}
.pairing .names{font-size:15px;}
.pairing .meta{color:var(--dim);font-size:13px;}
.empty{color:var(--dim);font-size:14px;padding:12px 0;text-align:center;}
.stats{display:flex;gap:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:100px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:12px;color:var(--dim);}
footer{text-align:center;color:var(--dim);font-size:12px;padding:20px;}
</style>
</head>
<body>

<header>
  <h1 id="eventName">Covid Cup 2026</h1>
  <div class="sub" id="eventSub">Loading event details…</div>
</header>

<main>
  <div class="card">
    <h2>Course</h2>
    <div id="courseInfo"><p>Not set up yet.</p></div>
  </div>

  <div class="card">
    <h2>Format</h2>
    <div class="stats" id="formatStats"></div>
  </div>

  <div class="card">
    <h2>Pairings</h2>
    <div id="pairingsList"><p class="empty">No pairings posted yet.</p></div>
  </div>
</main>

<footer id="versionFooter"></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { FIREBASE_CONFIG, FIREBASE_CONFIGURED } from "./firebase-config.js";

const DB_PATH = "covidcup";
const LS_KEY = "covidcup_admin_draft"; // same key admin.html writes as a local fallback

const SCORING_LABELS = {
  "net-best-ball": "Net best ball",
  "shamble": "Shamble",
  "scramble": "Scramble",
  "stroke-net": "Stroke play (net)",
  "stroke-gross": "Stroke play (gross)"
};

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(state){
  if (!state) return;
  const course = state.course || {};
  const roster = state.roster || {};
  const pairings = state.pairings || {};
  const settings = state.settings || {};

  document.getElementById("eventName").textContent = course.name || "Covid Cup 2026";
  document.getElementById("eventSub").textContent = course.location
    ? `${course.location} · ${Object.keys(roster).length} players`
    : `${Object.keys(roster).length} players`;

  const courseInfo = document.getElementById("courseInfo");
  if (course.holes && course.holes.length) {
    const totalPar = course.holes.reduce((s, h) => s + (+h.par || 0), 0);
    const teesLine = (course.tees || []).map(t => esc(t.name) + (t.rating ? ` (${t.rating}/${t.slope || "?"})` : "")).join(" &middot; ");
    courseInfo.innerHTML = `
      <p>${course.holes.length} holes &middot; par ${totalPar}</p>
      ${teesLine ? `<p>Tees: ${teesLine}</p>` : ""}
    `;
  } else {
    courseInfo.innerHTML = `<p>Not set up yet.</p>`;
  }

  const stats = document.getElementById("formatStats");
  stats.innerHTML = `
    <div class="stat"><div class="n">${SCORING_LABELS[settings.scoringType] || "—"}</div><div class="l">Scoring</div></div>
    <div class="stat"><div class="n">${settings.hcpAllowance != null ? settings.hcpAllowance + "%" : "—"}</div><div class="l">Handicap allowance</div></div>
    <div class="stat"><div class="n">${settings.shotgun ? "Shotgun" : "Tee times"}</div><div class="l">Start</div></div>
  `;

  const list = document.getElementById("pairingsList");
  const entries = Object.values(pairings);
  list.innerHTML = entries.length ? entries.map(p => {
    const names = (p.playerIds || []).map(id => roster[id]?.name || "?").join(" / ");
    return `<div class="pairing"><span class="names">${esc(names)}</span><span class="meta">${esc(p.start || "")}</span></div>`;
  }).join("") : `<p class="empty">No pairings posted yet.</p>`;
}

if (FIREBASE_CONFIGURED) {
  const app = initializeApp(FIREBASE_CONFIG);
  const db = getDatabase(app);
  onValue(ref(db, DB_PATH), snap => render(snap.val()));
} else {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
  render(local);
  document.getElementById("eventSub").textContent = "Event setup in progress";
}

(async () => {
  try {
    const res = await fetch(`version.txt?cb=${Date.now()}`, { cache: "no-store" });
    document.getElementById("versionFooter").textContent = "v" + (await res.text()).trim();
  } catch (e) {}
})();
</script>
</body>
</html>
