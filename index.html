    </div>`;
}
/** A small popup over whatever screen is already showing — just the card
    above, plus a close button. Tapping another player's row in "The field"
    no longer navigates away from your own profile; this is the replacement. */
function showProfilePopup(id){
  document.querySelectorAll(".ppopwrap").forEach(e => e.remove());
  const el = document.createElement("div");
  el.className = "ppopwrap";
  el.innerHTML = `<div class="ppopin">
      <button class="ppopclose" data-ppopclose="1" aria-label="Close">&times;</button>
      ${profileCardHTML(id)}
    </div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 250); };
  el.onclick = e => { if (e.target === el) close(); };
  el.querySelector("[data-ppopclose]").onclick = close;
  document.body.appendChild(el);
}
function viewProfile(){
  const meId = Session.id, p = PLAYERS[meId];
  const stats = playerStats().find(x => x.id === meId);

  let mine = "";
  ROUNDS.forEach(r => r.matches.forEach(m => {
    if (!inMatch(m, meId)) return;
    const ms = matchState(r, m, Store.scores(m.id));
    const side = m.s.p.some(x => x[0] === meId) ? "s" : "d";
    const opp = m[side === "s" ? "d" : "s"].p.map(x => last(x[0])).join(" / ");
    const partner = m[side].p.filter(x => x[0] !== meId).map(x => last(x[0])).join(" / ");
    const up = side === "s" ? ms.up : -ms.up;      // from this man's point of view
    const badge = !ms.started ? `<span class="badge soon">${esc(m.t)}</span>`
      : ms.done ? `<span class="badge ${ms.winner === side ? side : "h"}">${
          ms.winner === side ? "WON " + esc(ms.text) : ms.winner ? "LOST" : "HALVED"}</span>`
      : `<span class="badge ${up === 0 ? "h" : side}">${
          up === 0 ? "AS" : `${Math.abs(up)} ${up > 0 ? "UP" : "DN"}`}</span>`;
    mine += `<button class="card" data-nav="match" data-id="${m.id}"><div class="rowline">
      <div class="rnum" style="color:${rColour(r.n)};border-color:${rColour(r.n)};background:${rColour(r.n)}14">${r.n}</div>
      <div class="rmeta"><div class="t1">${partner ? `with ${esc(partner)}` : "Singles"}</div>
        <div class="t2">v ${esc(opp)} &middot; ${esc(r.fmt)}</div></div>
      <div class="rright"><div class="small">${badge}</div></div>
      <div class="chev">&rsaquo;</div></div></button>`;
  }));

  let roster = "";
  ["s","d"].forEach(t => {
    roster += `<div class="sect">${t === "s" ? "Kraft" : "Heinz"}</div>`;
    Object.keys(PLAYERS).filter(id => PLAYERS[id].t === t)
      .sort((a,b) => Store.playerIdx(a) - Store.playerIdx(b))
      .forEach(id => {
        const q = PLAYERS[id];
        roster += `<button class="card ${id === Session.id ? "me" : ""}" data-profile="${id}">
          <div class="rowline">${avatarSVG(id, "sm")}
          <div class="rmeta"><div class="t1">${esc(q.n)}${q.admin ? ` <span class="cmsh">ADMIN</span>` : ""}</div>
            <div class="t2">Index ${fmtIdx(Store.playerIdx(id))}</div></div>
          <div class="chev">&rsaquo;</div></div></button>`;
      });
  });

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Your profile<div class="sub">${
        p.t === "s" ? "Kraft" : "Heinz"}${p.title ? " &middot; " + esc(p.title) : ""}</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      ${profileCardHTML(meId)}
      <div class="mycode"><div class="mck">Your login code</div>
        <div class="mcv mono">${p.code}</div>
        <div class="mch">This is your key to the app. Write it down.</div></div>
      <div class="card flat"><div style="font-size:12.5px;color:var(--muted);line-height:1.7">
        ${stats ? `<b style="color:var(--text)">So far:</b> ${stats.holes} holes &middot;
          ${toPar(stats.grossToPar)} gross &middot; ${toPar(stats.netToPar)} net &middot;
          ${stats.birdie} birdie${stats.birdie === 1 ? "" : "s"}${
          stats.eagle ? ` &middot; ${stats.eagle} eagle${stats.eagle === 1 ? "" : "s"}` : ""}`
        : "No holes played yet."}</div></div>
      <div class="sect">Your matches</div>${mine}
      <div class="sect" style="margin-top:24px">The field</div>${roster}
    </div>`;
}

const toPar = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
function viewStats(){
  const rows = playerStats();
  if (!rows.length) return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">Nothing scored yet</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap"><div class="empty">Statistics appear here once scores start going in.<br>
      Every man's gross and net contribution to par, birdies, eagles and bogeys &mdash;
      across all five rounds.</div></div>`;

  // every statistic the filter can show: label, how to read it, sort direction
  const STATS = {
    net:      {lbl:"Net score to par",     get:p=>p.netToPar,   fmt:toPar, low:true},
    gross:    {lbl:"Gross score to par",   get:p=>p.grossToPar, fmt:toPar, low:true},
    worst:    {lbl:"Most over par (Gross)",get:p=>p.grossToPar, fmt:toPar},
    eagle:    {lbl:"Eagles (Gross)",       get:p=>p.eagle},
    eagleN:   {lbl:"Eagles (Net)",         get:p=>p.eagleN},
    birdie:   {lbl:"Birdies (Gross)",      get:p=>p.birdie},
    birdieN:  {lbl:"Birdies (Net)",        get:p=>p.birdieN},
    par:      {lbl:"Pars (Gross)",         get:p=>p.parCt},
    parN:     {lbl:"Pars (Net)",           get:p=>p.parCtN},
    over:     {lbl:"Holes over par (Gross)", get:p=>p.over},
    overN:    {lbl:"Holes over par (Net)",   get:p=>p.overN},
    holesWon: {lbl:"Most Holes Won",       get:p=>p.holesWon},
    holesLost:{lbl:"Most Holes Lost",      get:p=>p.holesLost}
  };
  const key = STATS[V.statSort] ? V.statSort : "net";
  const S = STATS[key];
  const val = p => S.get(p);
  const shown = p => (S.fmt ? S.fmt(val(p)) : String(val(p)));
  const sorted = [...rows].sort((a, b) =>
    (S.low ? val(a) - val(b) : val(b) - val(a)) ||
    (S.tie ? S.tie(a, b) : 0) || a.netToPar - b.netToPar);

  const bestBy = (fn, hi) => rows.reduce((x, y) => (hi ? fn(y) > fn(x) : fn(y) < fn(x)) ? y : x);
  const bNet = bestBy(p => p.netToPar, false), bGross = bestBy(p => p.grossToPar, false);
  const bBird = bestBy(p => p.birdie, true), bWorst = bestBy(p => p.grossToPar, true);

  // every badge is a shortcut into the leaderboard below it
  const card = (k, p, v, sub, jump, icon) => `<button class="statcard ${p ? p.team : ""}"
    data-sort="${jump}"><div class="k">${k}</div>
    <div class="v">${v}${icon || ""}<small>${sub}</small></div></button>`;

  const body = sorted.map((p, i) => `<tr class="${p.team}">
    <td class="rk">${i + 1}</td>
    <td class="nm">${esc(p.last)}</td>
    <td class="tm">${p.team === "s" ? "Kraft" : "Heinz"}</td>
    <td class="vl">${shown(p)}</td></tr>`).join("");

  const options = Object.keys(STATS).map(k =>
    `<option value="${k}"${k === key ? " selected" : ""}>${STATS[k].lbl}</option>`).join("");

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">${rows.length} players scored so far</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div class="statcards">
        ${card("Best net", bNet, esc(bNet.last), `${toPar(bNet.netToPar)} to par`, "net")}
        ${card("Best gross", bGross, esc(bGross.last), `${toPar(bGross.grossToPar)} to par`, "gross")}
        ${card("Most birdies (Gross)", bBird.birdie > 0 ? bBird : null,
          bBird.birdie > 0 ? esc(bBird.last) : "&mdash;",
          `${bBird.birdie} birdie${bBird.birdie === 1 ? "" : "s"}`, "birdie")}
        ${card("Most over par (Gross)", bWorst.grossToPar > 0 ? bWorst : null,
          bWorst.grossToPar > 0 ? esc(bWorst.last) : "&mdash;",
          `${toPar(bWorst.grossToPar)} to par`, "worst")}
      </div>
      <div class="sect">Leaderboard</div>
      <div class="filterbar">
        <label for="statsel">Show</label>
        <select id="statsel" class="statsel">${options}</select>
      </div>
      <div class="gridwrap"><table class="sl"><tbody>${body}</tbody></table>
        <div class="legend">Each man's own scores from best ball, shamble and singles.
          On scramble and alternate shot the team's score counts for both partners, and a
          picked-up ball (X) counts as double par. <b>Gross</b> is what he actually made;
          <b>Net</b> applies his strokes.</div>
      </div>
      <button class="btn ghost" data-nav="home">Back to home</button>
    </div>`;
}

/* ---------- round ---------- */
function viewRound(){
  const r = ROUNDS[V.round], c = COURSES[r.course];
  let list = "";
  r.matches.forEach(m => list += matchCard(r, m, matchState(r, m, Store.scores(m.id))));
  return `<div class="topbar">
      <button class="iconbtn" data-nav="matches">&#8592;</button>
      <h1>Round ${r.n} &middot; ${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(r.tee)} tees</div></h1>
      ${r.n === 3 ? beerMonoSVG() : ""}
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="card flat"><div style="font-size:12.5px;color:var(--muted);line-height:1.65">
        <b style="color:var(--text)">Strokes:</b> ${esc(r.rule)}<br>
        <b style="color:var(--text)">Format:</b> ${fmtBlurb(r)}
        ${c.note ? `<br><b style="color:var(--text)">Note:</b> ${esc(c.note)}` : ""}
      </div></div>
      <div class="sect">Matches</div>${list}</div>`;
}
const fmtBlurb = r => ({
  "Scramble":"Both partners tee off, play the best ball, repeat. One score per team.",
  "Best Ball":"Everyone plays their own ball. The pair's better net score counts.",
  "Shamble":"Play the best drive, then everyone plays their own ball in. Better net counts.",
  "Alternate Shot":"Partners alternate shots on one ball. One score per team.",
  "Singles":"One on one, own ball, net match play."
})[r.fmt] || "";

function matchCard(r, m, st){
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const mine = inMatch(m, Session.id);
  const cls = st.winner ? st.winner : "h";
  const right = st.started ? `<span class="badge ${cls}">${esc(st.text)}</span>`
                           : `<span class="badge soon">${esc(m.t)}</span>`;
  const sub = st.done ? "Final" : st.started ? `thru ${st.thru}` : esc(r.fmt);
  return `<button class="card ${mine ? "me" : ""}" data-nav="match" data-id="${m.id}"><div class="rowline">
    <div class="rmeta">
      <div class="t1" style="color:var(--snots)">${esc(nm("s"))}</div>
      <div class="vs" style="margin:2px 0">VS</div>
      <div class="t1" style="color:var(--ducks)">${esc(nm("d"))}</div>
      <div class="t2" style="margin-top:5px">${sub}${mine ? " &middot; your match" : ""}</div>
    </div>
    <div class="rright"><div class="small" style="margin:0 0 5px">${right}</div></div>
    <div class="chev">&rsaquo;</div></div></button>`;
}

/* ---------- match: hole entry ---------- */
/** Match players, both sides, as a flat list of ids — team mode collapses
    to just the two side keys since there's no individual roster to confirm
    tees for. */
function matchPlayerIds(r, m){
  if (r.mode === "team") return [];
  return [...m.s.p.map(p => p[0]), ...m.d.p.map(p => p[0])];
}

/* ---- shotgun start -------------------------------------------------------
   Every match's underlying data (scores[h], matchState, playerStats — all of
   it) stays keyed by the hole's real 0-based index, and every hole-counting
   function already tolerates holes landing out of order (that's what
   "decided" vs. "hole number" means in matchState). Only the live navigation
   needs to know which hole THIS foursome actually tees off on, so the whole
   shotgun format lives in these three helpers. */
/** The 18 hole indices (0-based), in the order this match's foursome plays
    them — starting hole first, wrapping back to hole 1 after 18. */
function playOrder(m){
  const s = (m.sh || 1) - 1;
  return Array.from({length: 18}, (_, i) => (s + i) % 18);
}
/** How far into THIS match's round a given hole falls — position 0 is their
    tee-off hole, position 17 is the last hole they'll play. */
function orderPos(m, h){ return ((h - (m.sh || 1) + 1) % 18 + 18) % 18; }
/** The first hole (real 0-based index) this match hasn't finished yet, in
    its own shotgun order — not simply the first null hole 1-18, since a
    group starting mid-card hasn't touched the early holes yet on purpose. */
function firstOpenHole(m, st){
  const order = playOrder(m);
  for (let pos = 0; pos < 18; pos++) if (st.holes[order[pos]] === null) return order[pos];
  return order[17];
}
/** Same idea, before a match has any decided holes to check against — used
    to land on the right hole the moment someone opens the match. */
function firstUnenteredHole(r, m, scores){
  const order = playOrder(m);
  for (let pos = 0; pos < 18; pos++) if (!holeEntered(r, m, order[pos], scores)) return order[pos];
  return order[17];
}
/** Blocks hole 1 until whoever just took over scoring has confirmed every
    player's tee — the course handicap engine reads it live, so this has to
    happen before any score is entered, not after. */
function viewTeeConfirm(r, m, sc){
  const c = COURSES[r.course], tees = Object.keys(c.tees);
  const isScorer = !!(sc && sc.id === Session.id);
  const rows = matchPlayerIds(r, m).map(id => {
    const p = PLAYERS[id], cur = Store.playerTee(id), curIdx = Store.playerIdx(id);
    const canEdit = isScorer || id === Session.id;
    const opts = tees.map(t => `<option value="${esc(t)}"${cur === t ? " selected" : ""}>${esc(t)}${
      c.tees[t].women ? " (Women's)" : ""}</option>`).join("");
    return `<div class="fmtrow" style="flex-direction:column;align-items:stretch;gap:7px">
      <label>${esc(p.n)} <span style="color:var(--dim)">&middot; ${
        p.t === "s" ? "Kraft" : "Heinz"}</span></label>
      <div style="display:flex;gap:8px">
        <select class="statsel teeconfirm" data-teefor="${id}" ${canEdit ? "" : "disabled"}>${opts}</select>
        <input class="statsel idxconfirm" style="flex:0 0 84px;text-align:center" type="number" step="0.1"
          inputmode="decimal" data-idxfor="${id}" value="${curIdx}" ${canEdit ? "" : "disabled"} title="Handicap index">
      </div></div>`;
  }).join("");
  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&#8592;</button>
      <h1>Confirm Tees<div class="sub">${esc(c.n)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="lockbar"><b>Before hole 1:</b> confirm your own tee and handicap index below —
        anyone who hasn't submitted a handicap yet can enter it here, and it's what sets your course
        handicap for the round.${sc && sc.id ? ` ${esc(PLAYERS[sc.id].n)} is keeping score and can adjust
        anyone's on their behalf too.` : ""}</div>
      ${rows}
      <button class="btn big" data-reviewstrokes="${m.id}" style="margin-top:6px">
        Review Strokes &rsaquo;</button>
    </div>`;
}
/** Every hole a player gets a stroke on, under a given playing handicap —
    a plain list, one entry per stroke. A high enough relative handicap
    gives the lowest stroke-index holes a second stroke, so a hole number
    can appear twice here (strokesOn() is what actually allocates it). */
function strokeHoleList(allowance, c){
  const holes = [];
  for (let h = 0; h < 18; h++){
    const n = strokesOn(allowance, c.hcp[h]);
    for (let i = 0; i < n; i++) holes.push(h + 1);
  }
  return holes;
}
/** Shown once tees are picked, before any score can be entered — the two
    competitions run different handicaps off the same tee choice, so this is
    the one place a player can see both stroke allocations side by side and
    catch a wrong tee before it matters. */
function viewStrokeSummary(r, m, sc){
  const c = COURSES[r.course];
  const rows = matchPlayerIds(r, m).map(id => {
    const p = PLAYERS[id];
    const a1 = liveAllowance(r, id), a2 = comp2Allowance(r, id);
    const h1 = strokeHoleList(a1, c), h2 = strokeHoleList(a2, c);
    return `<div class="card flat" style="margin-bottom:9px">
      <div style="font-weight:800;font-size:14px">${esc(p.n)}
        <span style="color:var(--dim);font-weight:650;font-size:12px">&middot; ${esc(Store.playerTee(id))} tees</span></div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.7">
        <span class="dot c1" style="display:inline-block;width:7px;height:7px;border-radius:50%;
          background:var(--red);margin-right:3px"></span> <b style="color:var(--text)">Ryder Cup:</b> ${a1} stroke${a1 === 1 ? "" : "s"}${
          h1.length ? ` &mdash; hole${h1.length === 1 ? "" : "s"} ${h1.join(", ")}` : ""}<br>
        <span class="dot c2" style="display:inline-block;width:7px;height:7px;border-radius:50%;
          background:#c9a227;margin-right:3px"></span> <b style="color:var(--text)">Foursome Stroke Play:</b> ${a2} stroke${a2 === 1 ? "" : "s"}${
          h2.length ? ` &mdash; hole${h2.length === 1 ? "" : "s"} ${h2.join(", ")}` : ""}
      </div>
    </div>`;
  }).join("");
  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&#8592;</button>
      <h1>Strokes Summary<div class="sub">${esc(c.n)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="lockbar">Confirm this looks right before scores start.</div>
      ${rows}
      <div class="actions">
        <button class="btn big ghost" data-backtotees="1">&lsaquo; Back to tees</button>
        <button class="btn big" data-startscoring="${m.id}">Start Scoring &rsaquo;</button>
      </div>
    </div>`;
}
/** This foursome's live Competition 2 (stroke play) total — shown right on
    the scoring screen so nobody has to leave the card to see how the group
    stands against the rest of the field. */
function comp2BarHTML(r, m, scores){
  const stat = comp2FoursomeTotal(r, m, scores);
  return stat.thru
    ? `Foursome Stroke Play: <b style="color:var(--text)">${toPar(stat.toPar)}</b> thru ${stat.thru}`
    : `Foursome Stroke Play: not started`;
}
function viewMatch(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);
  const h = V.hole, editable = canScore(m), sc = Store.scorer(m.id), par = c.par[h];
  /* No longer gated on a scorer being claimed — every player lands here
     before hole 1 no matter who (if anyone) is holding the card, so each
     of them can confirm their own tee/handicap without waiting on someone
     else to claim scoring first. */
  const teesEditable = r.mode !== "team" && !matchBegun(m.id);
  if (teesEditable){
    if (V.showStrokeSummary) return viewStrokeSummary(r, m, sc);
    if (!Store.teesConfirmed(m.id) || V.editTees) return viewTeeConfirm(r, m, sc);
  }

  // You can't run ahead of the card: the first hole without a result, in THIS
  // match's own shotgun order, is as far as anyone may go. Everything behind
  // it stays open for corrections.
  const firstOpen = firstOpenHole(m, st);
  const firstOpenPos = orderPos(m, firstOpen);
  const holeDone = st.holes[h] !== null;

  let strip = "";
  playOrder(m).forEach(i => {
    const w = st.holes[i], sp = specialAt(r.n, i);
    const locked = orderPos(m, i) > firstOpenPos;
    strip += `<button data-hole="${i}" id="chip-${i}" ${locked ? "disabled" : ""}
      class="${i === h ? "cur " : ""}${locked ? "lock " : ""}${sp ? "sp " : ""}${
      w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : ""}">${i + 1}${
      sp ? `<span class="spdot"></span>` : ""}</button>`;
  });
  const yd = yards(r, m, h);
  const sp = specialAt(r.n, h);

  const hs = holeScores(r, m, h, scores), row = scores[h] || {};
  // Shotgun mulligans: Round 3 (Shamble) only, tracked per player per hole.
  const mulRow = r.n === 3 ? (Store.mulligans(m.id)[h] || {}) : null;
  const sideBox = key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores), rows = [];
    if (r.mode === "team"){
      rows.push(entryRow({
        name: side.p.map(p => last(p[0])).join(" / "), sub: shotLbl(side.net),
        entrant: key, raw: row[key], gross: hs[key] ? hs[key].gross : null,
        strokes: teamStrokes(r, side, h), par, editable}));
    } else side.p.forEach(pl => {
      rows.push(entryRow({
        name: PLAYERS[pl[0]].n, sub: shotLbl(liveAllowance(r, pl[0])),
        entrant: pl[0], raw: row[pl[0]], gross: hs[pl[0]] ? hs[pl[0]].gross : null,
        strokes: playerStrokes(r, side, pl, h), strokes2: comp2PlayerStrokes(r, pl, h), par, editable,
        best: !!(bh && bh.byId === pl[0] && side.p.length > 1),
        showMulligan: !!mulRow, mulliganCount: mulRow ? (mulRow[pl[0]] || 0) : 0}));
    });
    return `<div class="sidebox ${key}"><div class="sidehdr">
        <span>${key === "s" ? "KRAFT" : "HEINZ"}</span>
        <span class="net" id="sidenet-${key}">${bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;"}</span>
      </div>${rows.join("")}</div>`;
  };

  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&#8592;</button>
      <h1>${esc(c.n)}<div class="sub">${esc(m.tee || r.tee)} &middot; ${esc(m.t)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="resbarwrap" id="resbarwrap">
        <div class="resbar ${st.winner || ""}" id="resbar">
          <div class="r1" id="res1">${holeLine(r, m, h, scores)}</div>
          <div class="r2" id="res2">${matchBegun(m.id) ? matchLine(st) : "Match not started"}</div>
        </div>
        <div class="vflashstack" id="vflashstack"></div>
      </div>
      <div class="lockbar" id="comp2bar" style="text-align:center">${comp2BarHTML(r, m, scores)}</div>
      ${st.done && st.played === 18 && !Store.isSubmitted(m.id) ? `<button class="btn" style="margin:0 0 10px"
        data-nav="card" data-id="${m.id}">Review &amp; Submit &rsaquo;</button>` : ""}
      <button class="roundbar ${V.briefOpen ? "open" : ""}" data-briefopen="1">
        <span class="rbn" style="background:${rColour(r.n)}">${r.n}</span>
        <span class="rbt">Round ${r.n} &middot; ${esc(r.fmt)}</span>
        <span class="rbc">${V.briefOpen ? "Hide" : "Details"} <i>&#9662;</i></span></button>
      ${V.briefOpen ? `<div class="brief briefdrop">${briefBody(r, m)}${
        Store.isSubmitted(m.id) ? "" : handoffHTML(m)}</div>` : ""}
      ${Store.isSubmitted(m.id) ? `<div class="lockbar"><b>Round submitted.</b>
        Signed off by ${esc(PLAYERS[Store.submittedBy(m.id)] ? PLAYERS[Store.submittedBy(m.id)].n : "a commissioner")}.
        ${Session.admin ? `<button data-unsubmit="${m.id}">Reopen &rsaquo;</button>` : "Scores are locked."}</div>`
        : scorerBar(m, sc)}
      ${teesEditable ? `<div class="lockbar" style="margin-top:-2px">
        Tees confirmed. <button data-edittees="1">Edit tees &rsaquo;</button></div>` : ""}
      <div class="holehead">
        <div class="holenav">
          <button class="navbtn" data-step="-1" ${orderPos(m, h) === 0 ? "disabled" : ""}>&#8592;</button>
          <div class="holeinfo"><div class="hn">Hole ${h + 1}</div>
            <div class="hd">Par ${par}${yd ? " &middot; " + yd : ""} &middot; S.I. ${c.hcp[h]}</div>
            ${sp ? `<div class="spbadge ${sp}">${SPECIAL_LABEL[sp]}</div>` : ""}</div>
          <button class="navbtn" data-step="1" ${orderPos(m, h) === 17 || !holeDone ? "disabled" : ""}>&rsaquo;</button>
        </div>
        <div class="strip">${strip}</div>
      </div>
      <div class="dotlegend"><span class="dot c1"></span> Ryder Cup stroke
        <span class="dot c2"></span> Foursome stroke-play stroke</div>
      ${sideBox("s")}${sideBox("d")}
      <div class="holebar">
        <button class="go ${orderPos(m, h) === 17 || V.fromCard ? "fin" : ""}" data-proceed="1"
          ${holeDone || V.fromCard ? "" : "disabled"}>${
          V.fromCard ? "Back to Review" : orderPos(m, h) === 17 ? "Review Round" : "Save Scores &amp; Proceed"}</button>
      </div>
      <div class="gate${holeDone || V.fromCard ? " off" : ""}" id="gatebar">Enter a score for
        <b>every player</b> before moving on.</div>
      <div class="savedtag">Every score saves the moment you type it${
        Store.online ? " and syncs to everyone" : " &mdash; will sync when you get service"}.${
        st.done ? " Keep going &mdash; the remaining holes still count for statistics." : ""}</div>
      <div class="actions">
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
        <button class="btn big ghost" data-nav="card" data-id="${m.id}">Full Scorecard</button>
      </div>
      ${Session.admin ? `<button class="btn ghost" data-reset="${m.id}"
        style="color:var(--red);margin-top:9px">Reset this match</button>` : ""}
    </div>`;
}
/** The briefing detail — used standalone before a match, and collapsed inside it. */
function briefBody(r, m){
  const rows = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => {
      const side = m[k], holes = [];
      for (let h = 0; h < 18; h++) if (teamStrokes(r, side, h)) holes.push(h + 1);
      rows.push({k, name: side.p.map(p => last(p[0])).join(" / "), n: side.net, holes});
    });
  } else ["s","d"].forEach(k => m[k].p.forEach(pl => {
    const holes = [];
    for (let h = 0; h < 18; h++){ const n = playerStrokes(r, m[k], pl, h);
      for (let i = 0; i < n; i++) holes.push(h + 1); }
    rows.push({k, name: PLAYERS[pl[0]].n, n: liveAllowance(r, pl[0]), holes});
  }));
  return `<div class="bd">${fmtBlurb(r)}<br><b>Strokes:</b> ${esc(r.rule)}</div>
    <ul>${rows.map(x => `<li><span class="who ${x.k}">${esc(x.name)}</span>
      <span class="hl">&mdash; ${x.holes.length ? `${x.holes.length} shot${x.holes.length===1?"":"s"}
      on hole${x.holes.length===1?"":"s"} ${x.holes.join(", ")}` : "no shots"}</span></li>`).join("")}</ul>
    ${r.par3Low ? `<div class="bd" style="margin-top:8px">On par 3s the pair plays off the
      lower partner's strokes.</div>` : ""}
    ${SPECIALS[r.n] ? `<div class="bd" style="margin-top:8px">
      <b>Closest to the Pin:</b> hole ${SPECIALS[r.n].ctp} &nbsp;&middot;&nbsp;
      <b>Long Drive:</b> hole ${SPECIALS[r.n].ld}</div>` : ""}`;
}

/** Who may be handed the card, and the button to do it. */
/* No "hand off to nobody" option, on purpose — once a card is claimed it
   always has a named scorer. The only way out is to give it to someone else
   in the match. */
function handoffHTML(m){
  const sc = Store.scorer(m.id);
  const others = [...m.s.p, ...m.d.p].map(p => p[0]).filter(id => !sc || id !== sc.id);
  if (!canClaim(m) && !(sc && sc.id === Session.id)) return "";
  return `<div class="handoff">
    <div class="hoh">${sc && sc.id ? "Hand scoring to someone else" : "Who's keeping score?"}</div>
    ${others.map(id => `<button class="honame ${PLAYERS[id].t}" data-give="${m.id}"
      data-to="${id}">${avatarSVG(id, "sm")}<span>${esc(PLAYERS[id].n)}</span>
      <em>${id === Session.id ? "that's me" : sc && sc.id ? "give the card" : "keeps score"}</em>
      </button>`).join("")}
  </div>`;
}

/** The standalone screen you land on when a match hasn't started. */
function viewBrief(){

        esc(m.tee || r.tee)} &middot; ${esc(m.t)} &middot; Starts hole ${m.sh || 1}</div></h1>

      </div>
      <div class="brief">${briefBody(r, m)}</div>
      ${sc && sc.id ? `<div class="lockbar"><b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.</div>`
        : `<div class="lockbar"><b>Nobody is keeping score yet.</b> Scores stay locked
           until someone takes it on.</div>`}

/** "Hodgman / Bertolini beat Mosele / MacDonald on Hole 1 with a Birdie" */
function holeVerdict(r, m, h, scores){
  if (!holeEntered(r, m, h, scores)) return null;  // wait for every score, not just one per side
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return null;
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const term = (gross, par) => {
    const x = gross - par;
    return x <= -3 ? "an Albatross" : x === -2 ? "an Eagle" : x === -1 ? "a Birdie"
         : x === 0 ? "a Par" : x === 1 ? "a Bogey" : x === 2 ? "a Double Bogey"
         : x === 3 ? "a Triple Bogey" : `a ${x} over par`;
  };
  const par = COURSES[r.course].par[h];
  if (s.net === d.net){
    // A small, work-appropriate nod to the brands — one per hole, picked
    // deterministically so it doesn't flicker between renders of the same hole.
    const TIE_LINES = ["square as a bottle of Heinz Ketchup", "even as two halves of a Kraft Single",
      "level as a fresh block of Philadelphia", "tied up like a Lunchables tray",
      "balanced as a box of Kraft Mac &amp; Cheese"];
    const tie = TIE_LINES[h % TIE_LINES.length];
    return {w:null, html:`<b>${esc(nm("s"))}</b> and <b>${esc(nm("d"))}</b> halved
      Hole ${h + 1} with ${term(s.gross, par)} &mdash; ${tie}`};
  }
  const w = s.net < d.net ? "s" : "d", l = w === "s" ? "d" : "s";
  const win = w === "s" ? s : d;
  return {w, html:`<b class="win ${w}">${esc(nm(w))}</b> beat ${esc(nm(l))} on Hole ${h + 1}
    with ${term(win.gross, par)}${win.picked ? " (picked up)" : ""}`};
}

/** The Dormie banner itself: a full-screen, team-specific modal that sticks
    until the "Proceed to Scoring" button is tapped — no tap-anywhere-to-skip
    like the trash-talk scenes, this one's meant to be read and dealt with. */
/* Plain text notice — was an illustrated astronaut/duck "Mission Control" /
   "Waterfowl Warning" scene. Dormie itself (leader's margin equals holes
   left) is a real match-play state worth flagging; only the mascot art and
   themed copy are gone. New visuals to come later. */
function showDormieModal(team){
  document.querySelectorAll(".dormiewrap").forEach(e => e.remove());
  const copy = team === "s"
    ? {title: "Kraft is Dormie", line: "One more hole for Kraft wins the match."}
    : {title: "Heinz is Dormie", line: "One more hole for Heinz wins the match."};
  const el = document.createElement("div");
  el.className = `dormiewrap ${team}`;
  el.innerHTML = `<div class="dormiein">
      <div class="dormiehd"><span class="dormietitle">${copy.title}</span></div>
      <div class="dormieline">${copy.line}</div>
    </div>
    <button class="dormiebtn" data-dormieok="1">Proceed to Scoring &rsaquo;</button>`;
  document.body.appendChild(el);
  el.querySelector("[data-dormieok]").onclick = () => {
    el.classList.add("out"); setTimeout(() => el.remove(), 300);
  };
}
/* Dormie: the leading side's margin now exactly equals the holes left to
   play. Fires once per match, ever — a lead that narrows and re-lands on
   the same margin later ("extending" the dormie) doesn't re-announce it.
   Called with the hole just finished (pre-increment), so this lands right
   as the dormie hole opens. */
const DORMIE_KEY = `${EVENT_KEY}_dormieshown`;
const dormieShown = () => {
  try { return JSON.parse(localStorage.getItem(DORMIE_KEY) || "[]"); } catch(e){ return []; }
};
const saveDormieShown = list => {
  try { localStorage.setItem(DORMIE_KEY, JSON.stringify(list)); } catch(e){}
};
/* Self-healing, same reason as the victory flag: this list is per-phone, so a
   wipe only really clears it on whoever ran the reset. Any match back to zero
   decided holes is dropped here, on every phone, next time data syncs. */
function pruneDormieShown(){
  const shown = dormieShown();
  if (!shown.length) return;
  const live = shown.filter(id => {
    const e = ALL_MATCHES[id];
    return e && matchState(e.r, e.m, Store.scores(id)).thru > 0;
  });
  if (live.length !== shown.length) saveDormieShown(live);
}
function checkDormie(r, m, h){
  const st = matchState(r, m, Store.scores(m.id));
  if (st.done || st.up === 0) return;
  const remain = 18 - st.thru;
  if (Math.abs(st.up) !== remain) return;
  const shown = dormieShown();
  if (shown.includes(m.id)) return;
  saveDormieShown([...shown, m.id]);
  showDormieModal(st.up > 0 ? "s" : "d");
}

    ${burst(96, 78, 1, 0, A)}
    ${burst(300, 66, .8, .3, B)}

/** One shell for every scene. */
function playScene(o){
  document.querySelectorAll(".taunt").forEach(e => e.remove());
  const el = document.createElement("div");
  el.className = "taunt" + (o.cls ? " " + o.cls : "");
  el.innerHTML = `${o.stamp ? `<div class="tstamp">${o.stamp}</div>` : ""}
    ${o.svg}
    <div class="tline">${o.line}</div>
    ${o.sub ? `<div class="tsub">${o.sub}</div>` : ""}
    <div class="tskip">tap to skip</div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 320); };
  el.onclick = close;
  document.body.appendChild(el);
  clearTimeout(playScene._t);
  playScene._t = setTimeout(close, o.ms || 3800);
}
/* Plain uniform draw — no player, match, or team ever weights this. Verified
   with a 1200-trial simulation of each pool: every scene landed within
   normal random variance of an even 1-in-6 (all counts 176-230, expected
   200). Genuinely random small samples still clump, though — the same
   viewer opening a handful of matches can easily draw the same scene twice
   in a row purely by chance, which reads as "biased" even when it isn't. To
   cut down on that, this phone's last scene is excluded from its own next
   draw (tracked locally only, never synced — every phone gets its own feel
   for "hasn't repeated in a while"). */
let _lastScene = null;
function pickScene(entries){
  const pool = entries.length > 1 ? entries.filter(e => e.key !== _lastScene) : entries;
  const choice = pool[Math.floor(Math.random() * pool.length)];
  _lastScene = choice.key;
  return choice;
}

    <div class="fbig">${SPECIAL_LABEL[kind].toUpperCase()}</div>
    <div class="fhole">Hole ${holeNo}</div>
    <div class="ftap">tap to continue</div></div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 300); };
  el.onclick = close;
  document.body.appendChild(el);
  clearTimeout(flashSpecial._t);
  flashSpecial._t = setTimeout(close, 3800);
}

/**
 * A hole just became complete. Announce who won it, then — if the NEXT hole is a
 * side contest — flash that too, one after the other.
 * Deliberately does NOT celebrate the match being won: a fat-fingered score can
 * make a match look over when it isn't. That fires on submit instead.
 */
/**
 * The last expected score for a hole just came off the keyboard. Give the
 * scorer a beat to finish a two-digit number, then do everything at once:
 * commit, rebuild the screen (which unlocks the forward arrow and Save
 * button), and announce the verdict. Any further keystroke or a cleared
 * score cancels it.
 */
function scheduleHoleSettle(r, m, h){
  clearTimeout(scheduleHoleSettle._t);
  scheduleHoleSettle._armed = {mId: m.id, h};   // so further keystrokes push it back
  scheduleHoleSettle._t = setTimeout(() => {
    scheduleHoleSettle._armed = null;
    if ((V.view !== "match" && V.view !== "card") || V.matchId !== m.id) return;
    const verdict = holeVerdict(r, m, h, Store.scores(m.id));
    if (!verdict) return;                     // a score was cleared in the meantime
    /* Every score is already committed on its own keystroke, so there is
       nothing to flush here — and yanking focus out of a box the scorer is
       still working in just closes the keyboard on him. patch() unlocks the
       arrow, the Save button and the hole strip without touching the DOM;
       the full render waits until he's actually finished. */
    const ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains("gsin")){ patch(); V.pending = true; }
    else { V.pending = false; render(); }
    afterHoleComplete(r, m, h, verdict);
  }, 900);
}

/**
 * Everything scene-worthy that happened on one completed hole, as plain data.
 * Kept separate from playing it so the scorer's own phone and every other
 * phone in the field decide identically — the two paths can't drift.
 */
/* The one event here is the Philly Boy birdie-or-better call-out — gross
   birdie or better, either team. It fires once a hole SETTLES (see
   scheduleHoleSettle above: a beat after the last keystroke, so a "1" that's
   about to become "12" never gets celebrated), not off a single raw
   keystroke and not held back until the whole card is submitted — Pat
   wants it live, just not premature. */
/** The actual name for a birdie-or-better gross score — null if it's only a
    par or worse, which also doubles as the qualifying check. */
function birdieTermWord(gross, par){
  const x = gross - par;
  return x <= -3 ? "Albatross" : x === -2 ? "Eagle" : x === -1 ? "Birdie" : null;
}
function holeEvents(r, m, h){
  const scores = Store.scores(m.id);
  const hs = holeScores(r, m, h, scores);
  const par = COURSES[r.course].par[h];
  const entries = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => {
      const v = hs[k]; if (!v || v.picked) return;
      const term = birdieTermWord(v.gross, par);
      if (term) entries.push({who: m[k].p.map(p => last(p[0])).join(" / "), term});
    });
  } else {
    for (const id in hs){
      const v = hs[id]; if (!v || v.picked) continue;
      const term = birdieTermWord(v.gross, par);
      if (term) entries.push({who: PLAYERS[id].n, term});
    }
  }
  // One event for the whole hole, not one per player — see playPhillyGood.
  return entries.length ? [{kind: "phillygood", entries}] : [];
}
/** Render one descriptor. `from` names the match when it isn't your own. */
function playHoleEvent(ev, from){
  if (ev.kind === "phillygood") return playPhillyGood(ev.entries, from);
}

function afterHoleComplete(r, m, h, verdict){
  flashHoleResult(verdict.html);
  ANNOUNCED.add(holeKey(m.id, h));   // so the field broadcast doesn't repeat it
  let delay = 1500;
  holeEvents(r, m, h).forEach(ev => {
    setTimeout(() => playHoleEvent(ev), delay);
    delay += 4400;
  });
  // the next hole is a side contest
  const nxt = specialAt(r.n, h + 1);
  if (nxt && h + 1 <= 17) setTimeout(() => flashSpecial(nxt, h + 2), delay);
}

/* ---------- trash talk from the rest of the field ----------
   Hole scenes used to fire only inside the scorer's own keystroke handler, so
   nineteen of twenty phones never saw any of it. Anything landing from another
   match now plays on whoever has the app open, captioned with whose match it
   came from — the talk spreads on its own from there. */
const ANNOUNCED = new Set();
const holeKey = (mId, h) => `${mId}:${h}`;
let broadcastReady = false;

/** Mark every finished hole as already seen, playing nothing. */
function seedAnnounced(){
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id], sc = Store.scores(id);
    for (let h = 0; h < 18; h++)
      if (holeEntered(r, m, h, sc)) ANNOUNCED.add(holeKey(id, h));
  }
  broadcastReady = true;
}

function broadcastFieldEvents(){
  if (!Session.id || !Store.synced) return;
  /* The first full picture from the server is history, not news — seed it
     silently. Waiting for that snapshot matters: localStorage alone is a
     fraction of the field, so seeding at boot would make the whole morning's
     holes look brand new the moment the real data landed. */
  if (!broadcastReady){ seedAnnounced(); return; }
  /* Mid-keystroke is the one time a full-screen scene is genuinely unwelcome,
     and nothing is marked seen on the way out — with matches syncing, the
     next tick comes along in seconds and it plays then. */
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("gsin")) return;

  const armed = scheduleHoleSettle._armed;
  const fresh = [];
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id], sc = Store.scores(id);
    for (let h = 0; h < 18; h++){
      const k = holeKey(id, h);
      // a wiped or corrected hole becomes eligible again
      if (!holeEntered(r, m, h, sc)){ ANNOUNCED.delete(k); continue; }
      if (ANNOUNCED.has(k)) continue;
      ANNOUNCED.add(k);
      /* Only the hole THIS phone is mid-entry on is skipped — its own settle
         is about to announce it and would double up. Anything else plays,
         including your own match when someone else is keeping the card, which
         is the whole point: watchers used to see nothing at all. */
      if (armed && armed.mId === id && armed.h === h) continue;
      const evs = holeEvents(r, m, h);
      if (evs.length) fresh.push({r, m, h, own: id === V.matchId, ev: evs[evs.length - 1]});
    }
  }
  if (!fresh.length) return;
  // Coming back after a while shouldn't queue ten scenes — newest one only.
  const pick = fresh[fresh.length - 1];
  const nm = k => esc(pick.m[k].p.map(p => last(p[0])).join(" / "));
  // no "from" line when it happened in the match you're already looking at
  playHoleEvent(pick.ev, pick.own ? null
    : `from Round ${pick.r.n} &middot; ${nm("s")} v ${nm("d")}`);
}

/* The Outing being won plays once, on every phone that sees it happen. */
const VICTORY_KEY = `${EVENT_KEY}_victory`;
function checkVictory(){
  if (!Session.id) return;
  // Count SUBMITTED cards only — same principle as the match-win scene: a
  // mistyped score must never start a party, and this one can only ever fire
  // once. The clinching point arrives when its card is signed off.
  let s = 0, d = 0;
  for (const id in ALL_MATCHES){
    if (!Store.isSubmitted(id)) continue;
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done){ s += st.pts.s; d += st.pts.d; }
  }
  const team = s >= CLINCH ? "s" : d >= CLINCH ? "d" : null;
  /* Self-healing: nobody is at clinch, so forget any earlier win. The flag is
     per-phone localStorage, and a wipe (or a reopened card) only clears it on
     the phone that did it — every other phone would sit on a stale "already
     played" and never show the real thing. This runs on every sync, so all 20
     recover on their own. */
  if (!team){ try { localStorage.removeItem(VICTORY_KEY); } catch(e){} return; }
  try { if (localStorage.getItem(VICTORY_KEY)) return;
        localStorage.setItem(VICTORY_KEY, "1"); } catch(e){}
  const pts = team === "s" ? s : d;
  playClinch(team, pts);
  // Kraft get the full podium scene too, timed to pick up right as the
  // fireworks flash finishes — Heinz clinching only ever gets the fireworks.
  if (team === "s") setTimeout(() => playVictory(pts), CLINCH_FIREWORKS_MS + 300);
}

/**
 * Hole-won announcements — flash right over the match bar, not mid-screen.
 * If a second one lands while the first is still up (two singles matches in
 * the same group, or a quick correction), they stack instead of overlapping.
 * Live banners are tracked outside the render cycle: a re-render rebuilds the
 * DOM underneath them, so they re-attach to the fresh stack each time.
 */
const VFLASH_LIVE = [];
function flashHoleResult(html){
  const el = document.createElement("div");
  // one wrapper span, not raw markup straight into the flex container: a bare
  // <b> next to a text node becomes two flex ITEMS, and flexbox drops the
  // whitespace that used to sit at that boundary — which is why "Name beat"
  // could render as "Namebeat". Wrapping keeps it one item, one text flow.
  el.className = "vflash"; el.innerHTML = `<span>${html}</span>`;
  VFLASH_LIVE.push(el);
  while (VFLASH_LIVE.length > 3) VFLASH_LIVE.shift().remove();
  setTimeout(() => {
    const i = VFLASH_LIVE.indexOf(el);
    if (i > -1) VFLASH_LIVE.splice(i, 1);
    el.remove();
  }, 3000);
  mountVflashes();
}
function mountVflashes(){
  const stack = document.getElementById("vflashstack");
  if (!stack) return;                       // not on the hole screen right now
  VFLASH_LIVE.forEach(el => {
    if (el.parentNode === stack) return;
    // survived a re-render: re-attach without replaying the fade-in
    if (el.parentNode){ el.style.animation = "none"; el.style.opacity = "1"; }
    stack.appendChild(el);
  });
}

function showToast(html){
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t);
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { if (t.parentNode) t.remove(); }, 4200);
}

function holeLine(r, m, h, scores){
  if (!holeEntered(r, m, h, scores)) return "";
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return "";
  return s.net < d.net ? "Kraft win the hole" : d.net < s.net ? "Heinz win the hole" : "Hole halved";
}
function matchLine(st){
  if (st.done) return st.winner
    ? `${st.winner === "s" ? "KRAFT" : "HEINZ"} win ${esc(st.text)}` : "Match halved";
  if (st.up === 0) return `All square thru ${st.thru}`;
  return `${st.up > 0 ? "KRAFT" : "HEINZ"} ${Math.abs(st.up)} UP thru ${st.thru}`;
}
/* Always rendered at the same height — if this bar appears or disappears as
   scores go in, every button below it jumps under the scorer's thumb. */
function scorerBar(m, sc){
  const mine = sc && sc.id === Session.id;
  let body;
  if (mine) body = `<b>You're keeping score.</b> Everyone else sees this live.
    <button data-briefopen="1">Hand off scoring &rsaquo;</button>`;
  else if (sc && sc.id) body = `<b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.` +
    (canClaim(m) ? ` <button data-claim="${m.id}">Take over &rsaquo;</button>` : ` View only.`);
  else if (canClaim(m)) body = `<b>Nobody is keeping score yet.</b> Scores are locked until
    someone takes it on. <button data-claim="${m.id}">I'll keep score &rsaquo;</button>`;
  else body = `<b>View only.</b> You're not in this match.`;
  return `<div class="lockbar">${body}</div>`;
}
function entryRow(o){
  const picked = o.raw === PICKED;
  const cls = picked ? "picked" : markCls(o.gross, o.par);
  const val = picked ? "X" : (o.raw == null ? "" : o.raw);
  return `<div class="prow ${o.best ? "best" : ""}">
    <div class="pname">${esc(o.name)}<span class="hc">${esc(o.sub)}</span>${
      o.best ? `<span class="ball">counts</span>` : ""}</div>
    <div class="entry">
      ${o.showMulligan ? "" : `<span class="lab">Gross Score:</span>`}
      <span class="gswrap">
        <input class="gsin ${val === "" ? "blank" : cls}" id="gs-${o.entrant}"
          data-entrant="${o.entrant}" type="${picked ? "text" : "number"}"
          inputmode="numeric" pattern="[0-9]*" min="1" max="15" value="${val}"
          ${o.editable && !picked ? "" : "readonly"}>
        ${dotsHTML(o.strokes, o.strokes2)}
      </span>
      ${o.showMulligan ? `<span class="mully" id="mully-${o.entrant}">
        <button class="mystep" data-mully="${o.entrant}" data-dir="-1"
          ${o.editable ? "" : "disabled"} aria-label="Fewer mulligans">&minus;</button>
        <span class="mymono">${beerMonoSVG(o.mulliganCount || 0)}</span>
        <button class="mystep" data-mully="${o.entrant}" data-dir="1"
          ${o.editable ? "" : "disabled"} aria-label="More mulligans">+</button>
      </span>` : ""}
      <span class="out" id="net-${o.entrant}">${
        o.gross == null ? "" : `${picked ? "plays" : "net"}<b>${o.gross - o.strokes}</b>`}</span>
      ${o.editable ? `<span class="acts">
        <button class="act pick ${picked ? "on" : ""}" data-pick="${o.entrant}">
          <b>Picked</b><i>up</i></button>
        <button class="act clear" data-clear="${o.entrant}">
          <b>Clear</b><i>score</i></button>
      </span>` : ""}
    </div></div>`;
}

/* ---------- full scorecard ---------- */
function viewCard(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);

  // running "up" after each decided hole (+ve = Kraft), null where not played
  const run = []; let u = 0;
  for (let h = 0; h < 18; h++){
    const w = st.holes[h];
    if (w === null){ run.push(null); continue; }
    if (w === "s") u++; else if (w === "d") u--;
    run.push(u);
  }
  const shortSide = key => m[key].p.length > 1
    ? m[key].p.map(p => last(p[0])[0]).join("/") : last(m[key].p[0][0]);

  const rowPair = (name, colour, entrantId, strokesFor, from, to) => {
    let g = `<tr class="gr"><td class="lbl" style="color:${colour}">${esc(name)}</td>`;
    let n = `<tr class="netrow"><td class="lbl">net</td>`;
    let gt = 0, nt = 0, any = false;
    for (let h = from; h <= to; h++){
      const hs = holeScores(r, m, h, scores);
      const v = hs[entrantId], raw = (scores[h] || {})[entrantId];
      // strokes show whether or not the hole has been scored yet, same as live entry
      const s = strokesFor(h);
      const cell = !v ? ""
        : raw === PICKED ? `<span class="mk picked">X</span>`
        : `<span class="mk ${markCls(v.gross, c.par[h])}">${v.gross}</span>`;
      g += `<td class="tap" data-gohole="${h}">${
        s > 0 ? `<span class="gdot${s > 1 ? " two" : ""}"></span>` : ""}${cell}</td>`;
      n += `<td>${v ? `<b>${v.net}</b>` : ""}</td>`;
      if (v){ gt += v.gross; nt += v.net; any = true; }
    }
    g += `<td class="tot">${any ? gt : ""}</td></tr>`;
    n += `<td class="tot">${any ? `<b>${nt}</b>` : ""}</td></tr>`;
    return g + n;
  };

  const nine = (from, to, label) => {
    // the hole range sits right next to OUT/IN so it's obvious at a glance
    // which nine each subtotal covers, with no counting required
    const range = `${from + 1}&ndash;${to + 1}`;
    let head = `<tr><th class="lbl">${label} <span class="hrange">${range}</span></th>`;
    for (let h = from; h <= to; h++){
      const sp = specialAt(r.n, h);
      // hole numbers double as a shortcut back into scoring that hole
      head += `<th class="tap${sp ? " sph" : ""}" ${sp ? `title="${SPECIAL_LABEL[sp]}" ` : ""
        }data-gohole="${h}">${h + 1}${
        sp ? `<span class="sptag">${SPECIAL_SHORT[sp]}</span>` : ""}</th>`;
    }
    head += `<th class="tot">${label} <span class="hrange">${range}</span></th></tr>`;
    let par = `<tr class="meta"><td class="lbl">Par</td>`, si = `<tr class="meta"><td class="lbl">Stroke index</td>`;
    let pT = 0;
    for (let h = from; h <= to; h++){ par += `<td>${c.par[h]}</td>`; si += `<td>${c.hcp[h]}</td>`; pT += c.par[h]; }
    par += `<td class="tot">${pT}</td></tr>`; si += `<td class="tot"></td></tr>`;

    let body = "";
    ["s","d"].forEach(key => {
      const side = m[key], colour = key === "s" ? "var(--snots)" : "var(--ducks)";
      if (r.mode === "team"){
        body += rowPair(side.p.map(p => last(p[0])).join(" / "), colour, key,
          h => teamStrokes(r, side, h), from, to);
      } else {
        side.p.forEach(pl => body += rowPair(PLAYERS[pl[0]].n, colour, pl[0],
          h => playerStrokes(r, side, pl, h), from, to));
        if (side.p.length > 1){
          let g = `<tr class="bestrow"><td class="lbl" style="color:${colour}">${
            key === "s" ? "KRAFT" : "HEINZ"} net</td>`;
          let t = 0, any = false;
          for (let h = from; h <= to; h++){
            const v = sideHole(r, m, key, h, scores);
            g += `<td>${v ? v.net : ""}</td>`;
            if (v){ t += v.net; any = true; }
          }
          body += g + `<td class="tot">${any ? t : ""}</td></tr>`;
        }
      }
      body += `<tr class="sep"><td class="lbl"></td>${"<td></td>".repeat(to - from + 2)}</tr>`;
    });

    /* Running match status, not per-hole winners. A golfer looking at this
       wants "who's up and by how much", not to add up S's and D's. */
    let res = `<tr class="rowres"><td class="lbl">Match</td>`;
    let lastU = null;
    for (let h = from; h <= to; h++){
      const u = run[h];
      if (u === null){ res += `<td></td>`; continue; }
      lastU = u;
      res += `<td class="${u > 0 ? "w" : u < 0 ? "l" : "hh"}">${
        u === 0 ? "AS" : `${Math.abs(u)} UP`}</td>`;
    }
    let totTxt = "", totCls = "";
    if (to === 17 && st.done){
      totTxt = st.winner ? `${shortSide(st.winner)} ${st.text}` : "AS &frac12;&ndash;&frac12;";
      totCls = st.winner || "h";                       // final result carries the winner's colour
    } else if (lastU !== null){
      totTxt = lastU === 0 ? "AS" : `${shortSide(lastU > 0 ? "s" : "d")} ${Math.abs(lastU)} UP`;
      totCls = lastU > 0 ? "s" : lastU < 0 ? "d" : "h";
    }
    res += `<td class="tot ${totCls}">${totTxt}</td></tr>`;
    return `<div class="gridwrap"><div class="gscroll"><table class="gc">
      <thead>${head}</thead><tbody>${par}${si}${body}${res}</tbody></table></div></div>`;
  };

  const holesFilled = st.holes.filter(Boolean).length;
  const submitted = Store.isSubmitted(m.id);
  // A closed-out match (e.g. 5 & 4) is mathematically decided well before all
  // 18 holes are played. Submit stays locked until every hole is in anyway —
  // Andrew wants the full card played every time, not just enough to win.
  const canSubmit = st.done && holesFilled === 18 && !submitted && (canScore(m) || Session.admin);

  return `<div class="topbar">
      <button class="iconbtn" data-nav="match" data-id="${m.id}">&#8592;</button>
      <h1>Review Round<div class="sub">${esc(c.n)} &middot; ${esc(r.fmt)} &middot; ${esc(m.tee || r.tee)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="resbar ${st.done && !st.winner ? "halved" : (st.winner || "")}">
        <div class="r1">${submitted ? "Submitted &middot; official" : st.done ? "Match decided" : "Match result"}</div>
        <div class="r2">${st.started ? matchLine(st) : "Not started"}</div></div>
      ${canSubmit ? `<div class="lockbar">Check the card against the paper copy, then submit.
        All 18 holes are in.</div>
        <button class="btn" style="margin:0 0 11px" data-submit="${m.id}">Attest &amp; Submit Round</button>` : ""}
      ${submitted ? `<div class="lockbar"><b>This round is submitted and locked.</b>
        ${Session.admin ? `<button data-unsubmit="${m.id}">Reopen &rsaquo;</button>`
          : "Ask Andrew or Pat if it needs reopening."}</div>` : ""}
      ${!st.done && st.started ? `<div class="lockbar">Match still in progress &mdash;
        thru ${st.thru}. You can submit once it's decided.</div>` : ""}
      ${st.done && holesFilled < 18 ? `<div class="lockbar"><b>Match decided, ${18 - holesFilled}
        hole${18 - holesFilled === 1 ? "" : "s"} still to play.</b> Keep going &mdash; every hole
        counts for the statistics, and submit unlocks once all 18 are in.</div>` : ""}
      ${nine(0, 8, "OUT")}${nine(9, 17, "IN")}
      <div class="gridwrap"><div class="legend">
        <span class="sw u c1">3</span> birdie &middot; <span class="sw u c2">2</span> eagle &middot;
        <span class="sw b1">5</span> bogey &middot; <span class="sw b2">6</span> double<br>
        <span class="rd"></span> a stroke is given on that hole
        ${r.par3Low ? "<br>Par 3s: the pair plays off the lower partner's strokes." : ""}
      </div></div>
      <div class="actions">
        <button class="btn big ghost" data-nav="match" data-id="${m.id}">Return to Your Match</button>
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
      </div>
    </div>`;
}

    <div class="mycode"><div class="mck">Your login code</div>
      <div class="mcv mono">${Session.me.code}</div>
      <div class="mch">Write this down. It's how you get back in if you're ever signed out.</div></div>
    ${codes}
    ${Session.admin ? `<div class="sect" style="margin-top:4px">Handicap allowance</div>
      <p style="margin-bottom:10px;color:var(--muted);font-size:12.5px;line-height:1.55">
        Locked at 100% for this event &mdash; both competitions play every stroke a
        player's handicap earns relative to the low man in his group.</p>` : ""}
    ${Session.admin ? `<div class="sect" style="margin-top:4px">Backup</div>
      <p style="margin-bottom:10px">Downloads every score, scorecard and chat message as a
      single file. If anything is ever lost, load that file back and it restores &mdash;
      it can only add back what's missing, never overwrite something newer.</p>
      <button class="btn ghost" data-export="1">Download backup</button>
      <button class="btn ghost" data-restore="1">Restore from backup&hellip;</button>
      <input type="file" id="restorefile" accept="application/json,.json" style="display:none">
      <div class="sect" style="margin-top:4px">Danger zone</div>
      <p style="margin-bottom:10px;color:var(--muted);font-size:12.5px;line-height:1.55">
        Wipes every score, scorer and submission on every match back to blank, on every
        phone at once. Download a backup first if you want a record of what's there now.
        <b style="color:var(--text)">This cannot be undone.</b>
      </p>
      <button class="btn ghost" data-resetall="1" style="color:var(--red)">Reset ALL matches&hellip;</button>` : ""}
    <button class="btn ghost" data-closebtn="1">Close</button>
    <button class="btn ghost" data-signout="1">Return to lock screen</button>
  </div></div>`;
}

/** Shows the span of tee times across a round's matches — collapses to one
    time when they're all equal, which is exactly what a shotgun start does. */
const teeSpan = r => {
  const t = r.matches.map(m => m.t);
  return t[0] === t[t.length - 1] ? t[0] : `${t[0]} &ndash; ${t[t.length - 1]}`;
};

/** The welcome message every player sees before the round — replaces the
    old trip-itinerary page entirely now that this is a one-day shotgun
    event. A real view (not a modal sheet) so the back arrow behaves exactly
    like every other screen. */

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Event Overview<div class="sub">Welcome</div></h1>
